[package]
name = "gam-geometry"
version = "0.3.154"
edition = "2024"
rust-version = "1.97"
description = "Riemannian-manifold geometry (charts, exp/log maps, Fréchet means, curvature estimands) for the gam penalized-likelihood engine"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SauersML/gam"

[lints.rust]
warnings = "deny"

[dependencies]
faer = "0.24.4"
libm = "0.2.16"
gam-linalg = { path = "../gam-linalg", version = "=0.3.154" }
gam-math = { path = "../gam-math", version = "=0.3.154" }
opt.workspace = true
ndarray = { version = "0.17.2", features = ["serde", "rayon"] }
wide = "1.5"
