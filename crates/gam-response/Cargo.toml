[package]
name = "gam-response"
version = "0.3.157"
edition = "2024"
description = "Exact finite-response calculus and intervention records for known network blocks"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SauersML/gam"
rust-version = "1.97"

[dependencies]
faer = "0.24.4"
gam-linalg = { path = "../gam-linalg", version = "=0.3.157" }
gam-math = { path = "../gam-math", version = "=0.3.157" }
gam-problem = { path = "../gam-problem", version = "=0.3.157" }
gam-runtime = { path = "../gam-runtime", version = "=0.3.157" }
gam-solve = { path = "../gam-solve", version = "=0.3.157" }
gam-terms = { path = "../gam-terms", version = "=0.3.157" }
ndarray = { version = "0.17.2", features = ["serde", "rayon"] }
rayon = "1.12.0"

[dev-dependencies]
gam-workspace-hack = { path = "../gam-workspace-hack" }
rand = "0.10.1"

[lints.rust]
warnings = "deny"
