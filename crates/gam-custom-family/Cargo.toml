[package]
name = "gam-custom-family"
version = "0.3.154"
edition = "2024"
description = "Custom-family blockwise carrier and joint-Newton solve for the gam penalized-likelihood engine"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SauersML/gam"
rust-version = "1.97"

[lints.rust]
warnings = "deny"


[dependencies]
faer = "0.24.4"
gam-identifiability = { path = "../gam-identifiability", version = "=0.3.154" }
gam-linalg = { path = "../gam-linalg", version = "=0.3.154" }
gam-model-api = { path = "../gam-model-api", version = "=0.3.154" }
gam-problem = { path = "../gam-problem", version = "=0.3.154" }
gam-runtime = { path = "../gam-runtime", version = "=0.3.154" }
gam-solve = { path = "../gam-solve", version = "=0.3.154" }
gam-spec = { path = "../gam-spec", version = "=0.3.154" }
gam-terms = { path = "../gam-terms", version = "=0.3.154" }
log = "0.4.29"
ndarray = { version = "0.17.2", features = ["serde", "rayon"] }
opt.workspace = true
rayon = "1.12.0"

[dev-dependencies]
approx = "0.5.1"
