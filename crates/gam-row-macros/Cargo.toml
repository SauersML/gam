[package]
name = "gam-row-macros"
version = "0.3.154"
edition = "2024"
rust-version = "1.97"
description = "Build-time symbolic lowering for gam row-program atoms"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SauersML/gam"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "3.0.3", features = ["full"] }

[dev-dependencies]
gam-math = { path = "../gam-math" }

[lints.rust]
warnings = "deny"
