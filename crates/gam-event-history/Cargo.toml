[package]
name = "gam-event-history"
version = "0.3.157"
edition = "2024"
description = "Joint latent event-history models and reference-law forecasting"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SauersML/gam"
rust-version = "1.97"

[lints.rust]
warnings = "deny"

[dependencies]
faer = "0.24.4"
gam-custom-family = { path = "../gam-custom-family", version = "=0.3.157" }
gam-data = { path = "../gam-data", version = "=0.3.157" }
gam-linalg = { path = "../gam-linalg", version = "=0.3.157" }
gam-math = { path = "../gam-math", version = "=0.3.157" }
gam-model-api = { path = "../gam-model-api", version = "=0.3.157" }
gam-problem = { path = "../gam-problem", version = "=0.3.157" }
gam-runtime = { path = "../gam-runtime", version = "=0.3.157" }
gam-solve = { path = "../gam-solve", version = "=0.3.157" }
gam-terms = { path = "../gam-terms", version = "=0.3.157" }
log = "0.4.29"
ndarray = { version = "0.17.2", features = ["serde", "rayon"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
