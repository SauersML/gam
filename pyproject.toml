[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gamfit"
version = "0.1.268"
description = "Formula-first generalized additive models with a high-performance Rust core"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
# The floor and every classifier version below are installed from the built
# wheels by scripts/wheel_smoke.py (pypi-wheels.yml, wheel-nightly.yml), which
# derives its Python matrix from these classifiers and refuses a floor that
# disagrees with this line. The extension is abi3-py310 (crates/gam-pyffi); the
# stable ABI does not cover free-threaded builds, so those get one wheel each.
requires-python = ">=3.10"
# SPDX expression (PEP 639). License :: classifiers are deliberately absent:
# PEP 639 forbids combining them with a license expression.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "SauersML" }]
keywords = [
  "gam",
  "generalized-additive-models",
  "additive-models",
  "penalized-splines",
  "smoothing-splines",
  "thin-plate-spline",
  "reml",
  "survival-analysis",
  "statistics",
  "regression",
  "machine-learning",
  "rust",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  # The extension declares `gil_used = false`, and every advertised version
  # PyO3 builds free-threaded (3.14t on; scripts/wheel_smoke.py) gets its own
  # wheel and smoke lane.
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
# numpy is the only runtime requirement: the wrapper hands numpy arrays to the
# Rust extension and returns them. Its lower bound is a tested claim, not a
# guess: the wheel smoke test's floor lane installs the oldest numpy this
# range admits on the requires-python floor (uv --resolution lowest).
dependencies = [
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/SauersML/gam"
Documentation = "https://gamfit.readthedocs.io/"
Source = "https://github.com/SauersML/gam"
Issues = "https://github.com/SauersML/gam/issues"
Changelog = "https://gamfit.readthedocs.io/en/latest/changelog/"

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12>=12.0,<13; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-nvrtc-cu12>=12.0,<13; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-runtime-cu12>=12.0,<13; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cusolver-cu12>=11.0,<12; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cusparse-cu12>=12.0,<13; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-nvjitlink-cu12>=12.0,<13; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
pandas = ["pandas>=2.0"]
plot = ["matplotlib>=3.8"]
sklearn = ["scikit-learn>=1.4"]
all = [
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
]

# Contributor tooling (PEP 735): resolved by `uv sync --group ...`, never
# published as installable extras of the user-facing package.
[dependency-groups]
test = [
  "pytest>=8",
  "mypy>=2.3",
  "pandas>=2.0",
  "pyarrow>=14",
  "polars>=1",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
]
type = [
  "mypy>=2.3",
  "pandas>=2.0",
  "pandas-stubs",
  "pyarrow>=14",
  "pyarrow-stubs",
  "polars>=1",
  "jax>=0.4",
  "safetensors",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "scikit-learn-stubs",
  "scipy-stubs",
  "pytest>=8",
  "types-requests",
  "vulture>=2.16",
]

[tool.maturin]
manifest-path = "crates/gam-pyffi/Cargo.toml"
module-name = "gamfit._rust"
# One authoritative Cargo-resolution policy for wheels, sdists, PEP 517, and
# direct maturin use. Subcommand-specific CLI placement cannot drift.
locked = true
# The sdist carries what building the extension reads, not the test suite:
# integration tests, cfg(test) modules and the fixtures they open, examples,
# helper binaries and benchmarks. `scripts/release_footprint.py sdist` compiles
# the unpacked sdist and refuses any file that compilation did not read, so a
# glob here can neither drop a source the build needs nor miss a test module
# (it runs on every PR touching the crates or the packaging, and before every
# PyPI upload). PyPI
# holds every file of every release against one project size limit (RELEASING.md).
exclude = [
  { path = "crates/**/tests/**", format = "sdist" },
  { path = "crates/**/tests.rs", format = "sdist" },
  { path = "crates/**/tests_*.rs", format = "sdist" },
  { path = "crates/**/*_tests.rs", format = "sdist" },
  { path = "crates/**/*_tests_*.rs", format = "sdist" },
  { path = "crates/**/test_support.rs", format = "sdist" },
  { path = "crates/**/*.json", format = "sdist" },
  { path = "crates/*/examples/**", format = "sdist" },
  { path = "crates/*/src/bin/**", format = "sdist" },
  { path = "bench/**", format = "sdist" },
  # `!` keeps a file a glob above drops: the library reads it. gam-problem and
  # gam-runtime export test_support to downstream crates' tests; the others are
  # test part-files spliced in with an unconditional `include!` (their contents
  # are cfg(test), but rustc still opens them).
  { path = "!crates/gam-problem/src/test_support.rs", format = "sdist" },
  { path = "!crates/gam-runtime/src/test_support.rs", format = "sdist" },
  { path = "!crates/gam-models/src/fit_orchestration/drivers/*_tests.rs", format = "sdist" },
  { path = "!crates/gam-sae/src/manifold/tests_topology_fixtures.rs", format = "sdist" },
  { path = "!crates/gam-solve/src/reml/glm_outer_hessian_fd_tests.rs", format = "sdist" },
  { path = "!crates/gam-terms/src/smooth/term_specs_tests.rs", format = "sdist" },
]
# crates/gam-cli is not a dependency of the extension, so maturin would leave it
# out, and Cargo.lock (which lists it and its dependencies) would then describe a
# workspace the sdist does not have; `locked = true` refuses to build from that.
include = [{ path = "crates/gam-cli/**/*", format = "sdist" }]

[tool.pytest.ini_options]
# Use importlib mode so pytest does not prepend each test file's parent
# directory to ``sys.path``. The default ``prepend`` mode would otherwise
# make ``tests/torch/`` discoverable as a top-level package named ``torch``,
# which silently shadows the real PyTorch library and breaks every test
# that does ``pytest.importorskip("torch")``.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
# `slow` identifies expensive tests for explicit CI scheduling. Failures remain
# ordinary failures: SPEC.md forbids XFAIL/XPASS masking.
markers = [
  "slow: test is too slow for the default CI Python-API job (run explicitly or locally)",
  "static_typing: mypy --strict over gamfit; needs the `type` dependency group plus torch",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["gamfit", "tests", "scripts", "bench"]
mypy_path = ["bench", "tests/bench_tools"]
explicit_package_bases = true
exclude = [
  "^bench/\\.venv/",
]

[[tool.mypy.overrides]]
module = ["mgcv", "pyvista", "imageio", "imageio.v2"]
ignore_missing_imports = true

[tool.vulture]
paths = ["gamfit", "tests", "scripts", "bench"]
exclude = ["bench/.venv/"]
ignore_names = [
  "_repr_html_",
]
