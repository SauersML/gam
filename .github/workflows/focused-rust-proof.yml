name: Focused Rust Proof

# Package-scoped compile-and-run lane for a newly edited leaf-crate test that
# does not yet exist in a full-workspace nextest archive.
#
# Validate One remains execution-only and exact-archive-only. This workflow has
# the opposite, deliberately narrow contract: compile one named package target
# only while the shared compiler cache is reachable, then run literal test-name
# filters. It never falls back to a workspace build.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Cargo package containing the focused tests."
        required: true
      runner:
        description: "Host/ISA lane for the focused proof."
        type: choice
        options:
          - ubuntu-latest
          - macos-15
        default: ubuntu-latest
        required: true
      target:
        description: "Compile library tests or one integration-test binary."
        type: choice
        options:
          - lib
          - integration
        default: lib
        required: true
      test_binary:
        description: "Integration-test binary name; required only for target=integration."
        default: ""
        required: false
      filters:
        description: "Bare Rust test-name substring(s), whitespace-separated."
        required: true
      issue:
        description: "Issue number, used only for concurrency and display."
        default: ""
        required: false
      r_packages:
        description: "Space-separated R packages to install before the run (e.g. 'nnet mgcv'). Empty = no R. A reference-quality test whose comparator is missing reports REFERENCE_ENV_MISSING and is NOT MEASURED, which is not a statement about gam."
        default: ""
        required: false
      base_sha:
        description: "Optional commit to check out INSTEAD of the dispatch ref. Use to run the identical filters on two commits for attribution; leave empty for the branch tip."
        default: ""
        required: false
      profile:
        description: "Cargo profile. `dev` is the default test profile. `release` is the ONLY lane in which a wall-clock ratio gate measures anything: those assertions compare a compiled lowering against a hand path, and `[profile.test.package.gam-models]` sets codegen-units = 16, which blocks the cross-CGU inlining the compiled side's whole advantage depends on. Every such gate in this repo is written `assert!(cfg!(debug_assertions) || ratio < 1.0, ...)`, so in any dev lane it is a no-op (#932)."
        type: choice
        options:
          - dev
          - release
        default: dev
        required: false

concurrency:
  group: focused-rust-proof-${{ github.event.inputs.issue }}-${{ github.event.inputs.package }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  # The two budgets below replace ONE bound that covered codegen, link AND
  # execution together (#2429).
  #
  # The compile allowance is UNCHANGED at the 1200s it already was. This split
  # exists to make an exhausted budget legible, not to buy more time: a budget
  # that has to keep growing is bounding the wrong thing, and the reachability
  # half of #2429 is fixed by changing the build's shape, not its allowance.
  BUILD_BUDGET_SECONDS: "1200"
  # Execution only, per filter, on an already-built target. This is not a new
  # restriction — under the old single bound a slow fit was racing whatever the
  # compile had left over, so a legitimately long solver test could be killed by
  # a bound meant for compilation. That conflation is exactly what this issue is
  # about, so execution gets its own allowance, set to the 600s per-test kill
  # the nextest lanes already use as the "this is a hang" threshold.
  RUN_BUDGET_SECONDS: "600"
  # `[profile.release]` carries thin-LTO and codegen-units = 1, so a release
  # test target is a substantially larger compile than the dev one the 1200s
  # allowance was set for. This is the same KIND of budget, sized for the other
  # profile -- not a looser bound on the same work.
  RELEASE_BUILD_BUDGET_SECONDS: "3000"

jobs:
  prove:
    name: Focused Rust proof (issue ${{ github.event.inputs.issue }})
    runs-on: ${{ github.event.inputs.runner }}
    # Must exceed BUILD_BUDGET_SECONDS + RUN_BUDGET_SECONDS plus checkout and
    # toolchain setup, so the LEGIBLE inner bounds always fire before the job
    # cap does. A job cancelled at the cap is the opaque outcome #2429 exists to
    # eliminate — it names no phase, writes no summary, and looks like a
    # failure of the code under test. This is not a larger compile allowance;
    # that is fixed at BUILD_BUDGET_SECONDS (RELEASE_BUILD_BUDGET_SECONDS for the
    # release profile), and the cap here only has to stay clear of it.
    timeout-minutes: ${{ github.event.inputs.profile == 'release' && 75 || 35 }}
    steps:
      - name: Provide bounded execution on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gtimeout >/dev/null 2>&1; then
            brew install coreutils
          fi
          echo "FOCUSED_TIMEOUT=gtimeout" >> "$GITHUB_ENV"

      - name: Select native timeout and linker flags on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "FOCUSED_TIMEOUT=timeout" >> "$GITHUB_ENV"
          # Keep this GNU ld flag scoped to Linux. GitHub expressions treat an
          # empty string as false, so the boolean-ternary idiom cannot safely
          # express "no RUSTFLAGS" for the macOS cache key.
          echo "RUSTFLAGS=-C link-arg=-Wl,--threads=1" >> "$GITHUB_ENV"

      - name: Checkout exact requested SHA
        uses: actions/checkout@v7
        with:
          # build.rs's human-author gate needs real history.
          fetch-depth: 0

      # Attribution needs two arms that differ by ONE commit and share
      # everything else -- same runner image, same toolchain, same filters.
      # Re-dispatching against a tip that has since moved does not give that,
      # and a stale local tree gives it even less. Checking out an explicit
      # commit here keeps both arms inside this one workflow definition.
      - name: Pin the arm to an explicit commit
        if: ${{ github.event.inputs.base_sha != '' }}
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.inputs.base_sha }}"
          echo "arm pinned to $(git rev-parse HEAD)"
          git --no-pager log -1 --format='%h %s' HEAD

      # A reference-quality test calls its comparator through Rscript. Without R
      # the harness raises REFERENCE_ENV_MISSING and says so in as many words:
      # "NOT MEASURED here -- it is not a statement about gam either way". That is
      # the correct behaviour and it is also indistinguishable, at the run's
      # exit code, from gam actually failing the comparison. Opt in to R and the
      # verdict becomes real; leave it empty and the lane is exactly as fast as
      # before.
      - name: Set up R for reference comparators
        if: ${{ github.event.inputs.r_packages != '' }}
        uses: ./.github/actions/setup-bench-r
        with:
          r-version: "4.4.3"

      - name: Install R packages
        if: ${{ github.event.inputs.r_packages != '' }}
        shell: bash
        env:
          R_PACKAGES: ${{ github.event.inputs.r_packages }}
        run: |
          set -euo pipefail
          read -r -a pkgs <<< "$R_PACKAGES"
          for pkg in "${pkgs[@]}"; do
            if [[ ! "$pkg" =~ ^[A-Za-z][A-Za-z0-9._]*$ ]]; then
              echo "::error::unsupported R package name: ${pkg}"
              exit 1
            fi
          done
          printf -v quoted '"%s",' "${pkgs[@]}"
          Rscript -e "install.packages(c(${quoted%,}), repos='https://cloud.r-project.org', Ncpus=max(1L, parallel::detectCores()-1L))"
          Rscript -e "invisible(lapply(c(${quoted%,}), function(p) library(p, character.only=TRUE)))"
          echo "R comparators available: ${R_PACKAGES}"

      - name: Set up warm Rust toolchain
        uses: ./.github/actions/setup-rust-ci
        with:
          free-disk-space: "false"
          # Compiler outputs belong in shared sccache. A target-directory cache
          # would be a second, key-sensitive source of truth.
          cache-targets: "false"

      - name: Record execution host and compiler
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          rustc -vV

      - name: Require reachable shared compiler cache
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUSTC_WRAPPER:-}" != "sccache" ]]; then
            echo "::error::Shared sccache is unavailable; refusing a cold source build."
            exit 1
          fi
          sccache --show-stats
          # Attribute every subsequent request and hit to this proof only.
          sccache --zero-stats

      - name: Validate inputs
        shell: bash
        env:
          FILTERS: ${{ github.event.inputs.filters }}
          PACKAGE: ${{ github.event.inputs.package }}
          TARGET: ${{ github.event.inputs.target }}
          TEST_BINARY: ${{ github.event.inputs.test_binary }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::package contains unsupported characters: ${PACKAGE}"
            exit 1
          fi

          # Both cargo invocations below take the SAME profile flag, so a
          # `--no-run` build and the run that follows can never end up in
          # different target directories measuring different code.
          case "${PROFILE:-dev}" in
            ""|dev)
              printf 'PROFILE_ARGS=\n' >> "$GITHUB_ENV"
              printf 'EFFECTIVE_BUILD_BUDGET=%s\n' "$BUILD_BUDGET_SECONDS" >> "$GITHUB_ENV"
              ;;
            release)
              printf 'PROFILE_ARGS=--release\n' >> "$GITHUB_ENV"
              printf 'EFFECTIVE_BUILD_BUDGET=%s\n' "$RELEASE_BUILD_BUDGET_SECONDS" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unsupported profile: ${PROFILE}"
              exit 1
              ;;
          esac

          # Feature selection is derived from the package's own manifest. PyO3's
          # `extension-module` feature tells the linker NOT to link libpython
          # (the importing interpreter supplies those symbols), so a test binary
          # built with it enabled cannot link: `--all-features` would turn it
          # back on and no test of such a package could ever run (#4455). A
          # package that declares it keeps it behind its default features, so
          # build it with every OTHER feature instead, exactly as
          # rust-archive.yml builds gam-pyffi's unit tests.
          declared_features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg p "$PACKAGE" '.packages[] | select(.name == $p) | .features | keys[]')
          if grep -qx 'extension-module' <<< "$declared_features"; then
            other_features=$(grep -vx -e 'extension-module' -e 'default' <<< "$declared_features" \
              | paste -sd, - || true)
            feature_args="--no-default-features"
            if [[ -n "$other_features" ]]; then feature_args+=" --features ${other_features}"; fi
          else
            feature_args="--all-features"
          fi
          printf 'FEATURE_ARGS=%s\n' "$feature_args" >> "$GITHUB_ENV"

          case "$TARGET" in
            lib)
              if [[ -n "$TEST_BINARY" ]]; then
                echo "::error::test_binary must be empty when target=lib."
                exit 1
              fi
              printf 'TARGET_ARGS=--lib\n' >> "$GITHUB_ENV"
              ;;
            integration)
              if [[ ! "$TEST_BINARY" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]; then
                echo "::error::target=integration requires a safe, non-empty test_binary."
                exit 1
              fi
              printf 'TARGET_ARGS=--test %s\n' "$TEST_BINARY" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unsupported target: ${TARGET}"
              exit 1
              ;;
          esac

          read -r -a filters <<< "$FILTERS"
          if [[ "${#filters[@]}" -eq 0 ]]; then
            echo "::error::filters must contain at least one test-name substring."
            exit 1
          fi
          for filter in "${filters[@]}"; do
            if [[ ! "$filter" =~ ^[A-Za-z0-9_][A-Za-z0-9_:.-]*$ ]]; then
              echo "::error::filter '${filter}' is not a bare Rust test-name substring."
              exit 1
            fi
          done

      # Compilation is a SEPARATE step from execution, with its own budget, so
      # that "could not build in the budget" is a distinct and visible outcome
      # from "the test failed" (#2429). Previously one step covered codegen,
      # link and execution under a single bound, and exceeding it surfaced only
      # as `##[error]Process completed with exit code 124` under a heading
      # naming the issue — indistinguishable at a glance from a real assertion
      # failure, so lanes debugged their own change against a run that had never
      # reached a test. That is the mirror of #2424: there a run reports SUCCESS
      # having verified nothing, here it reports FAILURE having verified
      # nothing. In both cases the defect is the same one — the run record does
      # not distinguish VERIFIED from NOT ATTEMPTED — so this step's job is to
      # make NOT ATTEMPTED say so, in the step name, in the annotation, and in
      # the job summary that is visible without opening a log.
      - name: Build focused test target (infrastructure step — not a test result)
        id: build
        shell: bash
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          read -r -a target_args <<< "$TARGET_ARGS"
          # Never empty (see "Validate inputs"), so no bash-3.2 empty-array guard.
          read -r -a feature_args <<< "$FEATURE_ARGS"
          # `PROFILE_ARGS` is empty for the dev profile. On the macos-15 lane
          # `shell: bash` is bash 3.2, where `"${arr[@]}"` on an EMPTY array is an
          # unbound-variable error under `set -u`, so build the array explicitly
          # and expand it with the portable `${arr[@]+...}` "only if set" form.
          profile_args=()
          if [[ -n "${PROFILE_ARGS:-}" ]]; then profile_args=("$PROFILE_ARGS"); fi
          mkdir -p focused-rust-logs
          log_file="focused-rust-logs/00-build.log"

          # Budget for compiling the package's test target ONCE. It is not the
          # cold-build guard: that job belongs entirely to the sccache gates,
          # which refuse an unreachable cache and refuse a proof that reused
          # zero compiler objects. Splitting it out of the per-filter loop also
          # fixes the accounting — the old single bound was charged afresh to
          # every filter even though only the first one compiled anything.
          echo "cargo test -p ${PACKAGE} ${feature_args[*]} ${PROFILE_ARGS:-} ${target_args[*]} --no-run"
          started=$(date +%s)
          set +e
          "$FOCUSED_TIMEOUT" --signal=TERM --kill-after=15s "$EFFECTIVE_BUILD_BUDGET" \
            cargo test -p "$PACKAGE" "${feature_args[@]}" ${profile_args[@]+"${profile_args[@]}"} "${target_args[@]}" --no-run \
            2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - started ))
          echo "build step exit=${status} elapsed=${elapsed}s budget=${EFFECTIVE_BUILD_BUDGET}s profile=${PROFILE_ARGS:-dev}"

          # `timeout` reports 124 when its TERM landed, or 137 when the process
          # had to be SIGKILLed after `--kill-after`. Both mean the same thing:
          # the budget ran out, so nothing about the code under test was
          # measured.
          if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
            last_unit=$(grep -E '^\s+(Compiling|Building|Linking) ' "$log_file" | tail -1 || true)
            {
              echo "### NOT ATTEMPTED — build budget exceeded"
              echo
              echo "\`${PACKAGE}\` did not finish compiling within \`${EFFECTIVE_BUILD_BUDGET}s\`,"
              echo "so **no test ran and nothing was verified**."
              echo "This is an infrastructure outcome (#2429), *not* a result about the code"
              echo "under test — do not debug your change against this run."
              echo
              echo "- last build activity: \`${last_unit:-<none recorded>}\`"
              echo "- elapsed: \`${elapsed}s\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=NOT ATTEMPTED: build budget exceeded (#2429)::${PACKAGE} did not finish compiling within ${EFFECTIVE_BUILD_BUDGET}s. No test ran and nothing was verified; this is an infrastructure outcome, not a result about the code under test. Last build activity: ${last_unit:-<none recorded>}"
            exit 1
          fi
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### NOT ATTEMPTED — the test target did not compile"
              echo
              echo "\`${PACKAGE}\` failed to build, so **no test ran**. A compile error is a"
              echo "real result about the code, but it is not a test outcome."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=NOT ATTEMPTED: test target did not compile::${PACKAGE} failed to build (exit ${status}); no test ran."
            exit "$status"
          fi
          echo "build completed in ${elapsed}s of a ${EFFECTIVE_BUILD_BUDGET}s budget."

      # Execution only — the target is already built, so a bound exceeded here
      # really is a statement about the tests (a hang or a runaway fit), which
      # is why it carries a different budget and a different annotation.
      - name: Run focused filters
        shell: bash
        env:
          FILTERS: ${{ github.event.inputs.filters }}
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          read -r -a target_args <<< "$TARGET_ARGS"
          read -r -a feature_args <<< "$FEATURE_ARGS"
          # `PROFILE_ARGS` is empty for the dev profile. On the macos-15 lane
          # `shell: bash` is bash 3.2, where `"${arr[@]}"` on an EMPTY array is an
          # unbound-variable error under `set -u`, so build the array explicitly
          # and expand it with the portable `${arr[@]+...}` "only if set" form.
          profile_args=()
          if [[ -n "${PROFILE_ARGS:-}" ]]; then profile_args=("$PROFILE_ARGS"); fi
          read -r -a filters <<< "$FILTERS"
          mkdir -p focused-rust-logs
          total_ran=0
          for filter in "${filters[@]}"; do
            log_file="focused-rust-logs/${filter//[:.]/_}.log"
            echo "cargo test -p ${PACKAGE} ${feature_args[*]} ${PROFILE_ARGS:-} ${target_args[*]} ${filter}"
            set +e
            "$FOCUSED_TIMEOUT" --signal=TERM --kill-after=15s "$RUN_BUDGET_SECONDS" \
              cargo test -p "$PACKAGE" "${feature_args[@]}" \
                ${profile_args[@]+"${profile_args[@]}"} "${target_args[@]}" "$filter" \
                -- --nocapture --test-threads=1 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
              {
                echo "### Test execution budget exceeded"
                echo
                echo "Filter \`${filter}\` was built successfully but did not finish running"
                echo "within \`${RUN_BUDGET_SECONDS}s\`. Unlike a build timeout this IS a"
                echo "statement about the tests — a hang or a non-terminating fit."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Test execution budget exceeded::filter '${filter}' built but did not finish running within ${RUN_BUDGET_SECONDS}s; the target compiled, so this is a test-side hang, not an infrastructure timeout."
              exit 1
            fi

            # A filter matching nothing makes `cargo test` exit 0 having verified
            # nothing — the #2424 defect. Count what actually ran and refuse the
            # phantom green. Checked BEFORE the exit status so a zero-match
            # filter is reported as such rather than as a pass.
            ran=$(awk '/test result:/ {
              for (i = 1; i < NF; i++) {
                if ($(i + 1) == "passed;") passed += $i;
                if ($(i + 1) == "failed;") failed += $i;
              }
            } END { print passed + failed + 0 }' "$log_file")
            if [[ "${ran:-0}" -eq 0 ]]; then
              echo "::error title=NOT ATTEMPTED: filter matched zero tests::filter '${filter}' executed zero tests; a filter that matches nothing verifies nothing."
              exit 1
            fi
            if [[ "$status" -ne 0 ]]; then
              echo "filter '${filter}' executed ${ran} test(s) and FAILED."
              exit "$status"
            fi
            echo "filter '${filter}' executed ${ran} test(s)."
            total_ran=$(( total_ran + ran ))
          done
          {
            echo "### VERIFIED — ${total_ran} test(s) executed"
            echo
            echo "Package \`${PACKAGE}\`, profile \`${PROFILE_ARGS:-dev}\`, filters: \`${FILTERS}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require measured compiler-cache reuse
        shell: bash
        run: |
          set -euo pipefail
          stats=$(sccache --show-stats)
          printf '%s\n' "$stats"
          hits=$(awk '$1 == "Cache" && $2 == "hits" { print $3; exit }' <<< "$stats")
          if [[ ! "${hits:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read sccache hit count; refusing an unmeasured warm proof."
            exit 1
          fi
          if (( hits == 0 )); then
            # A release proof compiles into its own sccache namespace (different
            # opt-level, codegen-units and LTO), so zero reuse is what the FIRST
            # release run of a given tree looks like — not the cold-source build
            # this gate was written to refuse. The release build budget already
            # refuses a compile that cannot finish, so reporting is the correct
            # outcome here; failing would make the lane unusable exactly once
            # per new namespace and teach people to ignore it.
            if [[ "${PROFILE_ARGS:-}" == "--release" ]]; then
              echo "::warning::Release proof reused zero compiler objects; the release profile has its own sccache namespace, so a first run in it is cold by construction."
            else
              echo "::error::Focused proof reused zero compiler objects; this was a cold build."
              exit 1
            fi
          else
            echo "Focused proof reused ${hits} cached compiler object(s)."
          fi

      - name: Report compiler-cache evidence
        if: ${{ always() }}
        shell: bash
        run: sccache --show-stats

      - name: Upload focused logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: focused-rust-${{ github.run_id }}
          path: focused-rust-logs
          if-no-files-found: ignore
