name: Test source integrity (#2818)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One running census per ref plus the newest waiting one: a started run is
  # never cancelled, and a superseded waiting run is covered by the next.
  group: test-census-${{ github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Positive control against the public-function sweep
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin d484a091a4d133aec6f3ed980754b6cda151d41b
          python scripts/public_api_census.py --positive-control
      - name: Positive control against the symbol-table sweep's own commit
        # A removal guard that has stopped refusing anything prints exactly what a
        # diff that removed nothing prints, so point it at d484a091a -- "delete
        # every function no production artifact links" -- on every run, and
        # require each arm (public, test-scoped, private with callers) to refuse.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin d484a091a4d133aec6f3ed980754b6cda151d41b
          python scripts/source_removal_guard.py --positive-control
      - name: Positive control against the sweep this gate exists for
        # A census that has stopped detecting anything is byte-identical to a
        # census over a tree that lost nothing, so point the instrument at a
        # known loss on every run: c0a21b554 and its parent, fetched by SHA.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin c0a21b5540ce76b76f62d880addf2612246ce1ee
          python scripts/test_census.py --positive-control
      - name: Fetch the #2110 positive-control blob
        # `actions/checkout` fetches depth 2, so a1d610d21 is not in the clone.
        # This runs BEFORE the unit tests, not beside them: the detector's own
        # positive-control case reads that blob, and it FAILS rather than skips
        # when the blob is unreachable -- a gate whose control cannot run has not
        # passed. Fetching inside the later step left the earlier one to fail on
        # a missing object (d9ed281b8).
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin a1d610d212a2ba5f2b4c2097260c814bdc45d579
      - name: Unit-test every scripts/tests module
        # One directory-level discovery instead of one step per file, so a module
        # added to scripts/tests runs on the day it lands. While each file had to
        # be named here, the #1561 quality-gate tests and the test-only src-item
        # scanner's tests ran in no job (#1512). It runs after the #2110 blob
        # fetch because the assertion-less detector's positive-control case reads
        # that blob.
        run: python -m unittest discover -s scripts/tests -v
      - name: Positive control against the #2110 incident
        # Same reasoning as the census control above, for the other instrument:
        # a detector that has stopped detecting anything prints exactly what a
        # clean tree prints. a1d610d21 added two assertion-less probes and the
        # then-live build.rs gate reported exactly 2, so re-measure that.
        run: python scripts/assertionless_tests.py --positive-control
      - name: Demand zero assertion-less tests
        # The tree scan is ENFORCING and demands zero. It used to ratchet against
        # scripts/assertionless_ledger.txt, whose entries doubled as known-offending
        # inputs. Its last entry, the #2695 warp ladder, was deleted, and the ledger
        # check refuses an empty ledger because it can certify nothing, so the ledger
        # went with it. The positive-control step above still re-measures the #2110
        # incident through the same detector.
        run: python scripts/assertionless_tests.py --root .
      - name: Compare immutable source inventories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python scripts/test_census.py --base "$BASE_SHA" --head "$HEAD_SHA" --output test-census.json
          python scripts/source_removal_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
          python scripts/public_api_census.py --base "$BASE_SHA" --head "$HEAD_SHA" --output public-api-census.json
      - name: SPEC ban ratchet
        # scripts/spec_ban_ledger.tsv lists every known shape-level SPEC
        # violation (grid, box, jitter, unconverged, magic, fd, gcv,
        # python-math), each linked to its issue. The positive control plants
        # one violation per rule; the check demands tree == ledger and that the
        # ledger only lost lines relative to the base.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python scripts/spec_ban_ratchet.py --positive-control
          python scripts/spec_ban_ratchet.py --base "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-source-inventory-${{ github.sha }}
          path: |
            test-census.json
            public-api-census.json
          if-no-files-found: error
