name: Test source integrity (#2818)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-census-${{ github.sha }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the census detects planted losses
        run: python -m unittest discover -s scripts/tests -p test_test_census.py -v
      - name: Positive control against the sweep this gate exists for
        # A census that has stopped detecting anything is byte-identical to a
        # census over a tree that lost nothing, so point the instrument at a
        # known loss on every run: c0a21b554 and its parent, fetched by SHA.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin c0a21b5540ce76b76f62d880addf2612246ce1ee
          python scripts/test_census.py --positive-control
      - name: Fetch the #2110 positive-control blob
        # `actions/checkout` fetches depth 2, so a1d610d21 is not in the clone.
        # This runs BEFORE the unit tests, not beside them: the detector's own
        # positive-control case reads that blob, and it FAILS rather than skips
        # when the blob is unreachable -- a gate whose control cannot run has not
        # passed. Fetching inside the later step left the earlier one to fail on
        # a missing object (d9ed281b8).
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin a1d610d212a2ba5f2b4c2097260c814bdc45d579
      - name: Verify the assertion-less-test detector
        run: python -m unittest discover -s scripts/tests -p test_assertionless_tests.py -v
      - name: Positive control against the #2110 incident
        # Same reasoning as the census control above, for the other instrument:
        # a detector that has stopped detecting anything prints exactly what a
        # clean tree prints. a1d610d21 added two assertion-less probes and the
        # then-live build.rs gate reported exactly 2, so re-measure that.
        run: python scripts/assertionless_tests.py --positive-control
      - name: Ratchet the tree against the assertion-less ledger
        # The tree scan is now ENFORCING. It was deliberately unwired while 19
        # tests reached no assertion, because a gate that is red the day it lands
        # trains everyone to ignore it -- which makes it the same non-instrument
        # as a scan nobody runs. It is wired here as a bidirectional ratchet,
        # the shape `scripts/rustdoc_ratchet.sh` already uses for the rustdoc
        # surface: an unrecorded offender is a regression, and a recorded test
        # that now asserts something is a stale ledger whose line must go in the
        # fix's own commit. The recorded set only ever shrinks, and it doubles
        # as the scan's positive control -- every line is a known-offending
        # input, so a scan that measured nothing reports them all as fixed and
        # this step fails loudly rather than printing a clean tree.
        run: python scripts/assertionless_tests.py --root . --ledger scripts/assertionless_ledger.txt
      - name: Compare immutable source inventories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python scripts/test_census.py --base "$BASE_SHA" --head "$HEAD_SHA" --output test-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-source-inventory-${{ github.sha }}
          path: test-census.json
          if-no-files-found: error
