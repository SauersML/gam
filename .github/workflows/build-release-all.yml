name: Build and Release All

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

# #2443/#2437: the every-2h schedule is the release-artifact record for the
# commit it ran on, so it is keyed on `github.sha` and never cancelled. Keyed on
# `github.ref` with cancellation, any lane `workflow_dispatch` from `main` shares
# the group and kills the scheduled build. Dispatches still supersede each other.
concurrency:
  group: build-release-all-${{ github.event_name == 'schedule' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Content-addressed compiler cache shared across CI runs (GitHub Actions
  # backend). These release builds are the heaviest dep-graph compiles in the
  # repo, so warming sccache here is what makes every later run — and, via a
  # shared SCCACHE_BUCKET, local build.sh — start warm instead of cold. sccache
  # keys on flags too, so each matrix target keeps its own entries.
  # RUSTC_WRAPPER is set after the shared backend is reachable. Every target
  # measures compiler requests and cache health; cold misses seed future runs.
  SCCACHE_GHA_ENABLED: "true"
  # Keep long release compiles and their counters alive until explicit cleanup.
  SCCACHE_IDLE_TIMEOUT: "0"

permissions:
  contents: write
  actions: read

jobs:
  # Throttle: skip this run if another run of THIS workflow started within
  # the last 15 minutes and was NOT cancelled. Cancelled runs don't count
  # — the next push should still produce a release.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check recent non-cancelled runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: build-release-all.yml
          SELF_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '15 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "Cutoff (UTC): $cutoff"
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=30" \
            --jq '.workflow_runs[] | {id: .id, status: .status, conclusion: .conclusion, created_at: .created_at}')
          echo "$runs"
          conflict=$(echo "$runs" | jq -s --arg cutoff "$cutoff" --arg self "$SELF_RUN_ID" '
            map(select(
              (.id|tostring) != $self
              and .created_at > $cutoff
              and .conclusion != "cancelled"
              and .status != "cancelled"
            )) | length')
          echo "Conflicting recent runs: $conflict"
          if [[ "$conflict" -gt 0 ]]; then
            echo "Another non-cancelled run started in the last 15 min — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.should_run == 'true'

      - name: Verify release-cache policy
        if: steps.check.outputs.should_run == 'true'
        run: python3 -m unittest discover -s scripts/tests -p test_release_cache.py -v

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # MacOS ARM (Apple Silicon) - GH Actions uses M1
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: gam
            asset_name: gam-macos-arm64
            cpu: apple-m1

          # MacOS Intel - use macos-15-intel which runs on Intel hardware
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: gam
            asset_name: gam-macos-intel
            cpu: x86-64-v3

          # Linux x86_64 (ubuntu-22.04 for wider glibc compatibility)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: gam
            asset_name: gam-linux-x64
            cpu: x86-64-v3

          # Linux ARM64 (ubuntu-22.04 for wider glibc compatibility)
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: gam
            asset_name: gam-linux-arm64
            cpu: neoverse-n1

          # Windows x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: gam.exe
            asset_name: gam-windows-x64
            cpu: x86-64-v3

          # Windows ARM64 (native ARM runner)
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: gam.exe
            asset_name: gam-windows-arm64
            cpu: cortex-a76

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Free runner disk space
        # ubuntu-latest / ubuntu-22.04 ship with ~14 GB free on /. On
        # x86_64-unknown-linux-gnu we additionally install the NVIDIA CUDA
        # Toolkit (~5–6 GB unpacked) and then run `cargo build --release`
        # against this dep graph (faer, burn, bevy_reflect, ndarray,
        # nalgebra, arrow, parquet, cudarc, …). The combined footprint has
        # been exhausting the disk during link, surfacing as
        # `System.IO.IOException: No space left on device` from the runner's
        # diagnostic log writer (which kills the whole job, not just the
        # build step). Wiping these preinstalled toolchains (.NET, Android
        # SDK, GHC, CodeQL, Boost) frees ~30 GB up-front so the CUDA install
        # and release link have headroom. Each `rm` is `|| true`-guarded so
        # a future runner image that drops one of these paths doesn't break
        # the step. Linux-only — macOS/Windows runners have a different
        # filesystem layout and don't share this pressure point.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Install pinned Rust toolchain
        # A moving nightly changes rustc's content hash every day and therefore
        # invalidates every compiler-cache object. Pin the exact toolchain that
        # seeded the release cache; toolchain upgrades are explicit cache
        # migrations, never an accidental cold build on the first run of a day.
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: nightly-2026-07-25
          targets: ${{ matrix.target }}

      - name: Set up cache-service-v2 sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          # Our receipt is collected before explicit daemon cleanup.
          disable_annotations: true

      - name: Require reachable shared compiler cache
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/release-cache.sh
          release_cache_start
          if [[ "$RUNNER_OS" == Windows ]]; then
            RUSTC_WRAPPER=$(cygpath -w "$RUSTC_WRAPPER")
          fi
          echo "RUSTC_WRAPPER=$RUSTC_WRAPPER" >> "$GITHUB_ENV"

      - name: Install NVIDIA CUDA Toolkit
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.2.2'

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Keep rustup/cargo shims owned by the toolchain setup step. Caching
          # ~/.cargo/bin can restore macOS runner rustup-init stubs over them.
          cache-bin: false
          # Preserve successful dependency work even if a later step fails.
          cache-on-failure: true

      - name: Verify Rust toolchain
        shell: bash
        run: |
          rustup --version
          rustc +nightly-2026-07-25 --version
          cargo +nightly-2026-07-25 --version

      - name: Remove local cargo config
        # Prevent .cargo/config.toml's target-cpu=native from interfering with release builds
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Build
        shell: bash
        env:
          # Use specific CPU target instead of 'native' to fix ring#2527 while keeping max optimization
          RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
          # Embed commit-addressable release tag in binary for version command
          GAM_RELEASE_TAG: "main-${{ github.sha }}"
        run: cargo +nightly-2026-07-25 build --release --target ${{ matrix.target }} -p gam-cli

      - name: Require measured compiler-cache health
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/release-cache.sh
          release_cache_verify

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          tar -czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -Destination ${{ matrix.asset_name }}.exe
          Compress-Archive -Path ${{ matrix.asset_name }}.exe -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: error

      - name: Stop compiler cache
        if: always()
        shell: bash
        run: sccache --stop-server

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate release tag
        id: tag
        run: echo "release_tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Release ${{ steps.tag.outputs.release_tag }}
          files: artifacts/**/*
