name: gamfit vs pyGAM benchmark

# Runs a named plan of the permanent gamfit-vs-pyGAM benchmark
# (bench/pygam_compare) on a fresh release wheel and publishes the markdown
# report as the job summary and as an artifact. Optional by design: manual
# dispatch or weekly, never per-PR, because a benchmark on a shared runner is a
# measurement to read, not a gate. The per-PR contract is the smoke test in
# bench/pygam_compare/test_pygam_compare_smoke.py, which python-contracts.yml
# runs with the rest of bench/.
#
# pyGAM comes from bench/pygam_compare/requirements.txt (bench-only; never a
# runtime dependency of gamfit).

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan name from bench/pygam_compare/plans.py (smoke, quick, n1e4_core, n1e5_core, full)"
        required: true
        default: quick
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: pygam-compare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  pygam-compare:
    name: gamfit vs pyGAM (${{ inputs.plan || 'quick' }})
    runs-on: ubuntu-latest
    # Harness safety net for the whole job, not a solver budget: the quick plan
    # takes minutes after the ~17 min wheel build, and per-rep runaways are
    # already bounded (and recorded as a status) by the plan's own timeout.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # build.rs human-author gate needs the real last build.rs editor.
          fetch-depth: 0

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          free-disk-space: 'true'
          cache-targets: 'true'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build and install gamfit wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip "maturin>=1.7,<2"
          rm -rf dist
          maturin build --release -i python3 -o dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Install bench-only requirements (pyGAM)
        run: python -m pip install -r bench/pygam_compare/requirements.txt

      - name: Run plan
        shell: bash
        env:
          # Passed through the environment, not interpolated into the script.
          PLAN: ${{ inputs.plan || 'quick' }}
        run: |
          set -euo pipefail
          python -m bench.pygam_compare.run "$PLAN" --out "$RUNNER_TEMP/pygam_compare"

      - name: Publish report to job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/pygam_compare/report.md" ]; then
            cat "$RUNNER_TEMP/pygam_compare/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload records and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pygam-compare-${{ inputs.plan || 'quick' }}
          path: ${{ runner.temp }}/pygam_compare
          if-no-files-found: warn
