name: Doctest census (#2732)

# A MEASUREMENT, NOT A GATE, on `workflow_dispatch` only.
#
# The gate is `cross-check.yml`'s `doctest-gate` job: `scripts/doctest_gate.sh`,
# one `cargo test --doc --workspace` pass on every push, at a bar of ZERO --
# any failing doctest fails it, and there is no ledger of tolerated crates.
#
# This workflow answers the one question that gate cannot: WHICH crate went red.
# `scripts/doctest_census.sh` shells `cargo test --doc -p <crate>` once per
# crate, which measured ~1h39m over 24 crates (run 30696464338), so it is a
# triage cost rather than a push cost. Dispatch it when the gate goes red, not
# to find out whether it is.
#
# It is separate from the rustdoc gate because they are different commands over
# different surfaces -- `cargo doc --no-deps` generates docs, `cargo test --doc`
# compiles and RUNS every doctest -- and folding them into one green would make
# both uninterpretable. It covers doctests only; ordinary `#[test]` bodies are a
# different lane.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctest-census-${{ github.sha }}
  cancel-in-progress: false

jobs:
  census:
    name: cargo test --doc, per crate (measurement, gates nothing)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Doctest census
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
        run: |
          set +e
          scripts/doctest_census.sh
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error title=Doctest census could not measure::The scan did not run to completion, so this run says nothing about the doctest surface. Treat it as a non-run, not as a pass."
          fi
          exit "$status"
