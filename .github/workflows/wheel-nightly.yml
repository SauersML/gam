name: Rolling wheel (warm-start artifact)
run-name: Runtime ${{ github.event.inputs.build_sha || github.sha }}

# Permanent warm-start: pushes to main keep the x86_64 manylinux wheel plus CLI
# pinned to the rolling `wheel-latest` prerelease. Exact-SHA consumers can also
# commission one immutable runtime without publishing over that rolling channel.
# Compute boxes and validation workflows download one verified runtime in seconds
# instead of paying a cold cargo build:
#
#   gh release download wheel-latest --repo SauersML/gam -p 'gamfit-*.whl' -D dist/
#   pip install --force-reinstall dist/gamfit-*.whl
#
# The wheel is built in a manylinux_2_28 container so it runs on MSI's Rocky 8
# (glibc 2.28) as well as modern cloud images — a plain ubuntu-runner build
# would tag manylinux_2_35 and refuse to install on the cluster. sccache keeps
# rebuilds warm across runs. `concurrency` coalesces pending rolling builds to
# the newest push without cancelling the running one; commissioned exact-SHA
# builds are never cancelled by another lane.
#
# This channel NEVER publishes to PyPI — pypi-wheels.yml stays the version-gated
# release path; this is the fleet's iteration artifact. It builds under the
# iteration profile (LTO off, CGU 16: 2-4x faster rebuilds for ~10% runtime),
# so use it for correctness/quality/acceptance work — NOT for wall-clock perf
# measurements, which need a real release-profile build.

on:
  push:
    branches: [main]
    # Results commits (bench/gha_results/**) are data, not code: they are
    # pushed by the publish-gha-results action and must not re-trigger the
    # compile gate, which is already starved for runners (#2582).
    paths-ignore:
      - 'bench/gha_results/**'
  # A periodic build that pushes CANNOT cancel.
  #
  # The push lane below deliberately cancels superseded builds, on the premise
  # recorded under concurrency: main has one newest-writer lane, so only the
  # newest push should spend minutes. That premise no longer holds. Measured
  # 2026-07-30: pushes to main arrive every 1-3 minutes from a multi-lane fleet
  # while a manylinux build takes far longer, so EVERY automatic build is
  # superseded before it finishes -- 19 of the last 20 runs cancelled, zero
  # successes. A rolling artifact that never rolls is worse than a slow one: the
  # Python suites, whose only runtime is this wheel, had then gone unmeasured for
  # over a week -- see gam#2616 and gam#2432.
  #
  # Scheduled runs land in a DIFFERENT concurrency group from pushes: push uses
  # the literal runtime-main, while everything else falls through to the
  # ref-keyed group. So a push can no longer kill one. That keeps the cheap
  # rolling behaviour for rapid pushes and still guarantees an artifact exists
  # on a bounded delay.
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:
    inputs:
      build_sha:
        description: "Exact lowercase 40-character commit to build. Empty = dispatch SHA."
        type: string
        default: ""
        required: false

# Push builds are NEVER cancelled. Under `cancel-in-progress: false` GitHub
# keeps the running build and coalesces every pending push in the group down to
# the newest one, so at most one build runs and one waits regardless of push
# rate: the cost is bounded by one build per build-duration, not one per push,
# and the artifact rolls every build-duration instead of once per cancelled
# night. Measured 2026-09-01 22:46-23:12 CDT under the old newest-wins policy:
# six consecutive pushes to main, six cancelled Runtime builds, zero artifacts.
# The daily schedule above stays as the floor for a quiet main. A commissioned
# build is keyed by the exact commit it promises and is never cancelled either;
# an ordinary empty-input dispatch keeps newest-wins on its own ref.
#
# The SCHEDULED build is the floor, so it gets a group of its own and is never
# cancelled. Under the previous expression a schedule fell through to the
# ref-keyed group with `cancel-in-progress` true, because its event name is not
# `push` and its `build_sha` input is empty: an ordinary empty-input dispatch on
# main landed in the same `runtime-refs/heads/main` group and could kill the
# nightly, and so could the next schedule. A floor that another lane can cancel
# is not a floor. Only an empty-input dispatch keeps newest-wins now, on its own
# ref, which is the one lane the comment above describes as wanting it.
concurrency:
  group: >-
    runtime-${{ github.event_name == 'push' && 'main'
      || github.event_name == 'schedule' && 'scheduled-main'
      || github.event.inputs.build_sha
      || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_sha == '' }}

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      smoke_matrix: ${{ steps.smoke-matrix.outputs.matrix }}
    steps:
      - name: Resolve the exact commit to build
        id: target
        shell: bash
        env:
          # `github` exists on every event; a missing nested property evaluates
          # to the empty string on push. The `inputs` context itself is only
          # available to workflow_dispatch/workflow_call runs.
          REQUESTED_SHA: ${{ github.event.inputs.build_sha }}
        run: |
          set -euo pipefail
          target_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::build_sha must be one full lowercase 40-character commit SHA; got '${target_sha}'."
            exit 1
          fi
          printf 'sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          echo "Building immutable runtime ${target_sha}."

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          # build.rs consults git history (author guard / SPEC HEAD-diff check);
          # a shallow clone with depth 2 keeps a parent commit available.
          fetch-depth: 2

      - name: Verify the commissioned tree and repository bans
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$checked_out_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Requested ${TARGET_SHA}, but actions/checkout produced ${checked_out_sha}."
            exit 1
          fi
          echo "Preflighting immutable runtime ${checked_out_sha}."
          scripts/ban_scanner.sh .

      - name: Plan the installed-wheel smoke matrix
        id: smoke-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/wheel_smoke.py matrix --families linux-x86_64)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # The abi3 wheel on the requires-python floor plus one wheel per
      # free-threaded version (scripts/wheel_smoke.py); maturin builds an
      # interpreter the image lacks from its bundled sysconfig.
      - name: Plan the build interpreters
        id: interpreters
        shell: bash
        run: |
          set -euo pipefail
          versions=$(python3 scripts/wheel_smoke.py interpreters)
          echo "$versions"
          echo "linux=$(printf 'python%s ' $versions)" >> "$GITHUB_OUTPUT"

      - name: Build manylinux_2_28 x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip -o dist -i ${{ steps.interpreters.outputs.linux }}
          manylinux: 2_28
          sccache: true
          # build.rs queries git history (author guard); inside the manylinux
          # container the repo is owned by the runner uid while git runs as
          # root, so git refuses with "dubious ownership" unless marked safe.
          before-script-linux: |
            git config --global --add safe.directory "$(pwd)"
            # maturin-action configures the GHA sccache backend before entering
            # the container but normally installs the executable only AFTER
            # this hook. Install it now so the CLI pre-build gets the same warm
            # compiler cache as the wheel; both still share one target tree.
            uv tool install "sccache>=0.10.0"
            cargo build --release -p gam-cli
            mkdir -p dist
            cp target/release/gam dist/gam
        env:
          # Iteration profile — same knobs as the MSI warm builder: 2-4x faster
          # rebuilds for ~10% runtime. Numerics are unaffected.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      # The runtime channel is one wheel (validate-one.yml and every
      # `pip install dist/gamfit-*.whl` consumer rely on that), so the
      # free-threaded wheels travel in their own artifact for the smoke lanes.
      - name: Set the free-threaded wheels apart
        shell: bash
        run: |
          set -euo pipefail
          mkdir free-threaded
          mv dist/gamfit-*-cp3*t-*.whl free-threaded/
          ls free-threaded

      - name: Seal exact runtime provenance
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/gamfit-*.whl)
          test -x dist/gam
          {
            echo "commit=${TARGET_SHA}"
            (cd dist && sha256sum "$(basename "$WHEEL")" gam)
          } > dist/RUNTIME_PROVENANCE.txt

      - name: Pin newest main runtime to rolling release
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.build_sha == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/gamfit-*.whl)
          gh release view wheel-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create wheel-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Rolling main wheel" \
              --notes "Continuously replaced by the newest green-main build. Not a versioned release."
          gh release upload wheel-latest "$WHEEL" dist/gam --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload wheel-latest dist/RUNTIME_PROVENANCE.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Also keep it as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamfit-runtime-${{ steps.target.outputs.sha }}
          path: |
            dist/gamfit-*.whl
            dist/gam
            dist/RUNTIME_PROVENANCE.txt
          retention-days: 14

      - name: Keep the free-threaded wheels as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamfit-free-threaded-${{ steps.target.outputs.sha }}
          path: free-threaded/gamfit-*.whl
          if-no-files-found: error
          retention-days: 14

  # The same installed-wheel gate pypi-wheels.yml runs before an upload
  # (scripts/wheel_smoke.py), on every rolling build, so an undeclared
  # dependency or missing package file is caught on the push that adds it
  # rather than at the next PyPI release. It installs into an empty venv from
  # a directory with no package checkout, on every advertised Python version.
  smoke:
    name: Smoke py${{ matrix.python }} (${{ matrix.resolution }})
    needs: wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheel.outputs.smoke_matrix) }}
    env:
      RESOLUTION: ${{ matrix.resolution }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wheel.outputs.sha }}
          path: smoke-src
          sparse-checkout: |
            scripts/wheel_smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: gamfit-${{ matrix.free_threaded && 'free-threaded' || 'runtime' }}-${{ needs.wheel.outputs.sha }}
          path: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel into a fresh venv and exercise it
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          python smoke-src/scripts/wheel_smoke.py run --wheel-dir runtime --resolution "$RESOLUTION"
