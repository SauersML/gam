name: Publish to PyPI

# Build wheels per (os, arch) as artifacts, then upload them in one final
# job using twine. Why split build from upload?
#
# The former unpinned `maturin-action@v1` `command: publish` injected `--release` into the
# maturin invocation, but newer maturin's `publish` subcommand rejects it
# (it's always release). Every wheel job was failing at that line, but
# `continue-on-error: true` swallowed the error so only the sdist made it
# to PyPI — leaving downstream consumers (`uv sync` / `pip install`) to
# fall back to the source build path. That's the "Building gamfit from sdist"
# 5× in parallel symptom.
#
# `command: build` does NOT trigger the `--release` injection, so the
# wheels actually get built. We then upload them all via `twine upload`
# in the `release` job — same pattern the existing sdist path uses, and
# the standard PyO3 wheel-distribution recipe.
#
# `continue-on-error: true` is removed everywhere: real failures need to
# fail loudly so the wheel slot doesn't silently disappear.

# Publication is explicit. The workflow itself is dispatched on main so GitHub's
# branch-scoped compiler cache remains visible; every job checks out the required
# immutable source commit instead of compiling the moving workflow ref.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-hex commit to package'
        type: string
        required: true
      scope:
        # Select the exact artifact set for this explicit publication:
        #   full  — every platform (manylinux + musllinux x86_64/aarch64, macOS, Windows)
        #   linux — all Linux wheels (manylinux + musllinux, x86_64 + aarch64); skip macOS/Windows
        #   x86   — manylinux x86_64 ONLY (the biobank target); fastest, no native-ARM wait
        # Non-built platforms fall back to the sdist on PyPI until a full run.
        description: 'Wheel scope for a manual run'
        type: choice
        options: [full, linux, x86]
        default: full

permissions:
  contents: read

env:
  # Smaller incremental footprint inside CI — incremental caches don't
  # survive across runs anyway, so disabling them saves disk + a small
  # amount of metadata bookkeeping at the start of every compile.
  CARGO_INCREMENTAL: "0"
  # Avoid network-bound metadata fetches on the hot path — we always
  # have the lockfile in-tree.
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Sparse index avoids the multi-minute git clone of the full crates.io
  # index on cold caches.  Identical cargo behavior on warm caches (the
  # registry is already populated under ~/.cargo).  Does not affect the
  # rustc invocation, so does not invalidate Swatinem/rust-cache keys.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Measure wrapper use and cache health. A valid cold build seeds the cache;
  # cache history must not determine whether an artifact can be published.
  SCCACHE_GHA_ENABLED: "true"
  # Long LTO requests must not outlive the daemon or erase its receipt.
  # Each lane explicitly stops its daemon once compilation is finished.
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  # Validate the immutable source commit before the matrix fans out.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      smoke_matrix: ${{ steps.smoke-matrix.outputs.matrix }}
      interpreters: ${{ steps.interpreters.outputs.versions }}
      linux_interpreters: ${{ steps.interpreters.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Require an exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be one exact lowercase 40-hex commit."
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout resolved to $actual, not requested source $SOURCE_SHA."
            exit 1
          fi
          echo "Release source is immutable commit $actual."

      - name: Verify release-cache policy
        run: python3 -m unittest discover -s scripts/tests -p test_release_cache.py -v

      # The families this scope builds, each on the Python versions the trove
      # classifiers advertise (see scripts/wheel_smoke.py).
      - name: Plan the installed-wheel smoke matrix
        id: smoke-matrix
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/wheel_smoke.py matrix --scope "$SCOPE")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # One abi3 wheel on the requires-python floor plus one wheel per
      # free-threaded version, from the same classifiers. The manylinux and
      # musllinux images name their interpreters python3.X[t]; maturin builds
      # one they lack from its bundled sysconfig, which is all a Linux
      # extension needs (it does not link libpython).
      - name: Plan the build interpreters
        id: interpreters
        shell: bash
        run: |
          set -euo pipefail
          versions=$(python3 scripts/wheel_smoke.py interpreters)
          echo "$versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "linux=$(printf 'python%s ' $versions)" >> "$GITHUB_OUTPUT"

      # Resolve metadata once before the matrix fans out. Running without
      # --locked is deliberate in this ephemeral checkout: Cargo can reveal the
      # exact resolver-owned delta, then this gate refuses publication if the
      # checked-in lockfile was not already canonical.
      - name: Require resolver-clean Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          cargo +1.97.1 metadata \
            --manifest-path crates/gam-pyffi/Cargo.toml \
            --format-version 1 \
            --no-deps >/dev/null
          if ! git diff --exit-code -- Cargo.lock; then
            echo "::error::Cargo.lock is not the canonical resolution of the release manifests; refusing to start the wheel matrix."
            exit 1
          fi

  linux:
    needs: gate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        # manylinux x86_64 (the glibc target the biobank box consumes) plus
        # native-ARM aarch64 — EXCEPT a manual `scope=x86` run, which builds
        # x86_64 only (fastest, no native-ARM-runner wait).
        platform: ${{ github.event.inputs.scope == 'x86' && fromJSON('[{"runner":"ubuntu-24.04","target":"x86_64"}]') || fromJSON('[{"runner":"ubuntu-24.04","target":"x86_64"},{"runner":"ubuntu-24.04-arm","target":"aarch64"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build Linux wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          # Cross-run compilation cache (GitHub Actions cache backend),
          # configured INSIDE the manylinux container by maturin-action.
          # CI runners are ephemeral, so without this every wheel recompiles
          # the whole dependency graph (faer, ndarray, pyo3, …) cold in
          # release mode — the dominant ~10 min cost. With sccache warm, only
          # the changed gam crate recompiles on subsequent releases.
          sccache: true
          target: ${{ matrix.platform.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
            -i ${{ needs.gate.outputs.linux_interpreters }}
          manylinux: 2014
          # #1534: inside the manylinux container the mounted workspace is
          # owned by a different uid than the build user, so git refuses
          # build.rs's author-gate `git log` with "detected dubious ownership"
          # and the build panics. Trust the mounted tree before the build runs.
          before-script-linux: |
            git config --global --add safe.directory '*'
            source .github/scripts/release-cache.sh
            # This function runs after maturin-action installs sccache and in
            # the same container as the actual compiler and its cache daemon.
            maturin() {
              trap 'sccache --stop-server' EXIT
              release_cache_start || return $?
              local status=0
              command maturin "$@" || status=$?
              release_cache_verify || status=1
              return "$status"
            }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error

  musllinux:
    needs: gate
    # Built for the full and Linux scopes; the x86 scope is manylinux-only.
    if: github.event.inputs.scope != 'x86'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04,     target: x86_64 }
          # Native ARM host for the musllinux aarch64 build, same
          # reasoning as the manylinux jobs above.
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build musllinux wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
            -i ${{ needs.gate.outputs.linux_interpreters }}
          manylinux: musllinux_1_2
          # #1534: same dubious-ownership fix as the manylinux job — the
          # musllinux_1_2 container mounts the workspace under a foreign uid,
          # blocking build.rs's `git log` author gate.
          before-script-linux: |
            git config --global --add safe.directory '*'
            source .github/scripts/release-cache.sh
            maturin() {
              trap 'sccache --stop-server' EXIT
              release_cache_start || return $?
              local status=0
              command maturin "$@" || status=$?
              release_cache_verify || status=1
              return "$status"
            }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    needs: gate
    # Full only: skipped by the Linux and x86 scopes.
    if: github.event.inputs.scope != 'linux' && github.event.inputs.scope != 'x86'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          # Our measured receipt precedes explicit daemon shutdown. The action
          # post hook would restart an empty daemon just to print zero stats.
          disable_annotations: true
      - name: Require reachable shared compiler cache
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/release-cache.sh
          release_cache_start
          echo "RUSTC_WRAPPER=$RUSTC_WRAPPER" >> "$GITHUB_ENV"
      # macOS and Windows extensions link against the interpreter, so each
      # build interpreter must exist on the runner: uv's managed CPython
      # builds include the free-threaded ones.
      - name: Install the build interpreters
        id: interpreters
        shell: bash
        env:
          INTERPRETERS: ${{ needs.gate.outputs.interpreters }}
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          set -euo pipefail
          python -m pip install uv
          python -m uv python install $INTERPRETERS
          paths=()
          for version in $INTERPRETERS; do
            path=$(python -m uv python find "$version")
            paths+=("$path")
          done
          echo "paths=${paths[*]}" >> "$GITHUB_OUTPUT"
      - name: Build macOS wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          sccache: false
          target: ${{ matrix.platform.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
            -i ${{ steps.interpreters.outputs.paths }}
      - name: Require measured compiler-cache health
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/release-cache.sh
          release_cache_verify
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Stop compiler cache
        if: always()
        shell: bash
        run: sccache --stop-server

  windows:
    needs: gate
    # Full only: skipped on a manual `scope=linux` or `scope=x86` run (same as macos).
    if: github.event.inputs.scope != 'linux' && github.event.inputs.scope != 'x86'
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ matrix.target }}
      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          disable_annotations: true
      - name: Require reachable shared compiler cache
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/release-cache.sh
          release_cache_start
          # Cargo is a native Windows executable, so use its native path.
          echo "RUSTC_WRAPPER=$(cygpath -w "$RUSTC_WRAPPER")" >> "$GITHUB_ENV"
      # macOS and Windows extensions link against the interpreter, so each
      # build interpreter must exist on the runner: uv's managed CPython
      # builds include the free-threaded ones.
      - name: Install the build interpreters
        id: interpreters
        shell: bash
        env:
          INTERPRETERS: ${{ needs.gate.outputs.interpreters }}
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          set -euo pipefail
          python -m pip install uv
          python -m uv python install $INTERPRETERS
          paths=()
          for version in $INTERPRETERS; do
            path=$(python -m uv python find "$version")
            # maturin splits -i on spaces: forward slashes, no backslashes.
            path=$(cygpath -m "$path")
            paths+=("$path")
          done
          echo "paths=${paths[*]}" >> "$GITHUB_OUTPUT"
      - name: Build Windows wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          sccache: false
          target: ${{ matrix.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
            -i ${{ steps.interpreters.outputs.paths }}
      - name: Require measured compiler-cache health
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/release-cache.sh
          release_cache_verify
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Stop compiler cache
        if: always()
        shell: bash
        run: sccache --stop-server

  sdist:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.14.1
          # `locked = true` lives in pyproject.toml so both `build` and
          # `sdist` receive it in maturin's supported configuration layer.
          args: --out dist --manifest-path crates/gam-pyffi/Cargo.toml
      # Every release keeps its sdist on PyPI for good: refuse one that ships
      # files the build never reads, or that no longer compiles as shipped.
      - name: Check the sdist footprint
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          python3 scripts/release_footprint.py sdist dist/*.tar.gz --target-dir "$RUNNER_TEMP/sdist-target"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # A wheel that builds is not a wheel that works (PKG-08). Every built wheel
  # is installed into an empty virtualenv with only the runtime requirements
  # its own metadata declares, binaries only, from a directory that holds no
  # package checkout, and then imported, fitted, predicted, summarised and
  # saved/loaded. That catches missing package data, undeclared or dev-only
  # dependencies, and extensions that do not load on their platform, before
  # anything reaches PyPI. The floor Python lane installs the lowest declared
  # requirement versions, so the numpy lower bound is tested too.
  smoke:
    name: Smoke ${{ matrix.family }} py${{ matrix.python }} (${{ matrix.resolution }})
    needs: [gate, linux, musllinux, macos, windows]
    # Builders a narrower scope skipped are absent from the matrix; any builder
    # that failed or was cancelled stops the smoke test and hence the upload.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.smoke_matrix) }}
    env:
      PYTHON_VERSION: ${{ matrix.python }}
      RESOLUTION: ${{ matrix.resolution }}
    steps:
      # Only the smoke script: the package sources are never on disk, let
      # alone importable, so only the installed wheel can satisfy `import`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: smoke-src
          sparse-checkout: |
            scripts/wheel_smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.family }}
          path: wheelhouse
      - uses: actions/setup-python@v5
        if: ${{ !matrix.musl }}
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel into a fresh venv and exercise it
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          python smoke-src/scripts/wheel_smoke.py run --wheel-dir wheelhouse --resolution "$RESOLUTION"
      # A glibc runner cannot load a musllinux extension: run under Alpine.
      - name: Install the wheel into a fresh venv and exercise it (Alpine)
        if: ${{ matrix.musl }}
        shell: bash
        run: |
          set -euo pipefail
          # No Alpine image ships a free-threaded CPython: the 3.14t lane runs
          # uv's managed musl build of it on the python:3.14-alpine image.
          docker run --rm -e RESOLUTION -e PYTHON_VERSION -v "$GITHUB_WORKSPACE:/w" -w /w "python:${PYTHON_VERSION%t}-alpine" sh -euc '
            python -m pip install --root-user-action=ignore uv
            case "$PYTHON_VERSION" in *t) python -m uv python install "$PYTHON_VERSION" ;; esac
            python smoke-src/scripts/wheel_smoke.py run --wheel-dir wheelhouse --resolution "$RESOLUTION" --python "$PYTHON_VERSION"
          '

  release:
    name: Upload to PyPI
    needs:
      - linux
      - musllinux
      - macos
      - windows
      - sdist
      - smoke
    # Full releases are atomic platform sets: every advertised wheel family must
    # succeed. A cancelled job is not a deliverable and must never be treated like
    # an intentional skip. Only a manually selected narrower scope may accept the
    # exact jobs that scope deliberately skipped.
    if: >-
      ${{
        always() &&
        needs.linux.result == 'success' &&
        needs.sdist.result == 'success' &&
        needs.smoke.result == 'success' &&
        (
          (
            github.event.inputs.scope == 'x86' &&
            needs.musllinux.result == 'skipped' &&
            needs.macos.result == 'skipped' &&
            needs.windows.result == 'skipped'
          ) ||
          (
            github.event.inputs.scope == 'linux' &&
            needs.musllinux.result == 'success' &&
            needs.macos.result == 'skipped' &&
            needs.windows.result == 'skipped'
          ) ||
          (
            github.event.inputs.scope == 'full' &&
            needs.musllinux.result == 'success' &&
            needs.macos.result == 'success' &&
            needs.windows.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: release-src
          sparse-checkout: |
            scripts/release_footprint.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download all wheel + sdist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show what will be uploaded
        run: ls -la dist
      - name: Install twine
        run: python -m pip install --upgrade twine
      # PyPI renders the long description and validates the metadata only at
      # upload time; refuse the whole set here, before any file is uploaded.
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      # twine uploads file by file, so a project that fills up mid-upload is
      # left with a release missing some of its wheels. Refuse before the
      # first file instead. A limit PyPI raised on request is invisible to its
      # API: record it in the repository variable (RELEASING.md).
      - name: Refuse an upload that would fill the PyPI project
        shell: bash
        env:
          PYPI_INDEX_URL: https://pypi.org/simple/
          PYPI_PROJECT_SIZE_LIMIT_GIB: ${{ vars.PYPI_PROJECT_SIZE_LIMIT_GIB }}
        run: |
          set -euo pipefail
          python release-src/scripts/release_footprint.py storage dist --index-url "$PYPI_INDEX_URL" ${PYPI_PROJECT_SIZE_LIMIT_GIB:+--project-limit-gib "$PYPI_PROJECT_SIZE_LIMIT_GIB"}
      - name: Upload to PyPI via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --verbose --skip-existing --non-interactive dist/*
