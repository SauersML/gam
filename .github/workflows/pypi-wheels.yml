name: Publish to PyPI

# Build wheels per (os, arch) as artifacts, then upload them in one final
# job using twine. Why split build from upload?
#
# The former unpinned `maturin-action@v1` `command: publish` injected `--release` into the
# maturin invocation, but newer maturin's `publish` subcommand rejects it
# (it's always release). Every wheel job was failing at that line, but
# `continue-on-error: true` swallowed the error so only the sdist made it
# to PyPI — leaving downstream consumers (`uv sync` / `pip install`) to
# fall back to the source build path. That's the "Building gamfit from sdist"
# 5× in parallel symptom.
#
# `command: build` does NOT trigger the `--release` injection, so the
# wheels actually get built. We then upload them all via `twine upload`
# in the `release` job — same pattern the existing sdist path uses, and
# the standard PyO3 wheel-distribution recipe.
#
# `continue-on-error: true` is removed everywhere: real failures need to
# fail loudly so the wheel slot doesn't silently disappear.

# Publication is explicit. The workflow itself is dispatched on main so GitHub's
# branch-scoped compiler cache remains visible; every job checks out the required
# immutable source commit instead of compiling the moving workflow ref.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-hex commit to package'
        type: string
        required: true
      scope:
        # Select the exact artifact set for this explicit publication:
        #   full  — every platform (manylinux + musllinux x86_64/aarch64, macOS, Windows)
        #   linux — all Linux wheels (manylinux + musllinux, x86_64 + aarch64); skip macOS/Windows
        #   x86   — manylinux x86_64 ONLY (the biobank target); fastest, no native-ARM wait
        # Non-built platforms fall back to the sdist on PyPI until a full run.
        description: 'Wheel scope for a manual run'
        type: choice
        options: [full, linux, x86]
        default: full

permissions:
  contents: read

env:
  # Smaller incremental footprint inside CI — incremental caches don't
  # survive across runs anyway, so disabling them saves disk + a small
  # amount of metadata bookkeeping at the start of every compile.
  CARGO_INCREMENTAL: "0"
  # Avoid network-bound metadata fetches on the hot path — we always
  # have the lockfile in-tree.
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Sparse index avoids the multi-minute git clone of the full crates.io
  # index on cold caches.  Identical cargo behavior on warm caches (the
  # registry is already populated under ~/.cargo).  Does not affect the
  # rustc invocation, so does not invalidate Swatinem/rust-cache keys.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # The wheel matrix is a publication boundary, so every compiled wheel must
  # prove it was compiled THROUGH the shared content-addressed compiler cache:
  # each job zeroes its counters immediately before compilation and refuses
  # publication unless the receipt shows rustc reached sccache and the backend
  # reported no errors.
  #
  # It does NOT require a nonzero hit count, and the difference cost a release.
  # `release-pypi` is a dedicated profile (fat LTO, one CGU, stripped) that
  # nothing else in this repo compiles, so its objects are shared with no other
  # workflow, and the Actions cache evicts entries unused for seven days while
  # this workflow runs only at release time. A hit-count floor is therefore
  # unsatisfiable on the first dispatch of any release: run 33654645604
  # (v0.3.154) refused macOS, musllinux and Windows at `hits 0` with `errors 0`,
  # `gamfit` 0.1.264 was never uploaded, and the only reason 0.1.260 shipped is
  # that eight dispatches were fired within two hours on 2026-07-26 until one
  # landed on a still-warm cache. A cold wheel is slow, not wrong; a wheel that
  # bypassed the wrapper is the misconfiguration worth refusing, and compile
  # requests measure that directly instead of by proxy. A cold run still writes
  # its objects back, so it seeds the next release.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Validate the immutable source commit before the matrix fans out.
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Require an exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be one exact lowercase 40-hex commit."
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout resolved to $actual, not requested source $SOURCE_SHA."
            exit 1
          fi
          echo "Release source is immutable commit $actual."

      # Resolve metadata once before the matrix fans out. Running without
      # --locked is deliberate in this ephemeral checkout: Cargo can reveal the
      # exact resolver-owned delta, then this gate refuses publication if the
      # checked-in lockfile was not already canonical.
      - name: Require resolver-clean Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          cargo +1.97.1 metadata \
            --manifest-path crates/gam-pyffi/Cargo.toml \
            --format-version 1 \
            --no-deps >/dev/null
          if ! git diff --exit-code -- Cargo.lock; then
            echo "::error::Cargo.lock is not the canonical resolution of the release manifests; refusing to start the wheel matrix."
            exit 1
          fi

  linux:
    needs: gate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        # manylinux x86_64 (the glibc target the biobank box consumes) plus
        # native-ARM aarch64 — EXCEPT a manual `scope=x86` run, which builds
        # x86_64 only (fastest, no native-ARM-runner wait).
        platform: ${{ github.event.inputs.scope == 'x86' && fromJSON('[{"runner":"ubuntu-24.04","target":"x86_64"}]') || fromJSON('[{"runner":"ubuntu-24.04","target":"x86_64"},{"runner":"ubuntu-24.04-arm","target":"aarch64"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build Linux wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          # Cross-run compilation cache (GitHub Actions cache backend),
          # configured INSIDE the manylinux container by maturin-action.
          # CI runners are ephemeral, so without this every wheel recompiles
          # the whole dependency graph (faer, ndarray, pyo3, …) cold in
          # release mode — the dominant ~10 min cost. With sccache warm, only
          # the changed gam crate recompiles on subsequent releases.
          sccache: true
          target: ${{ matrix.platform.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
          manylinux: 2014
          # #1534: inside the manylinux container the mounted workspace is
          # owned by a different uid than the build user, so git refuses
          # build.rs's author-gate `git log` with "detected dubious ownership"
          # and the build panics. Trust the mounted tree before the build runs.
          before-script-linux: |
            git config --global --add safe.directory '*'
            # maturin-action runs this definition in the same container shell
            # that later invokes maturin. The function therefore brackets the
            # real compiler invocation with target-local counters and turns a
            # build that bypassed the cache into a hard refusal before any
            # artifact upload.
            maturin() {
              # Measured 2026-09-02 (run 33654645604): the Actions cache
              # answered `503 ServerBusy: Egress is over the account limit`,
              # `sccache --start-server` failed outright, and `fail-fast` took
              # the rest of the release matrix with it. opendal classifies that
              # response as retryable, so the start gets a bounded schedule
              # before any compilation begins; a backend still unreachable
              # after it is fatal, exactly as before.
              local attempt started=0
              for attempt in 1 2 3 4 5; do
                if sccache --start-server; then started=1; break; fi
                echo "sccache --start-server failed (attempt ${attempt}/5)."
                if (( attempt < 5 )); then sleep $(( attempt * 20 )); fi
              done
              if (( started == 0 )); then
                echo "::error::sccache could not reach the shared cache backend after 5 attempts; refusing a wheel build with no compiler cache."
                return 1
              fi
              # maturin-action exports RUSTC_WRAPPER in its Node process, but
              # Docker receives an empty value on this route. Bind Cargo to the
              # executable that was just installed inside this container.
              export RUSTC_WRAPPER="$(command -v sccache)"
              sccache --zero-stats
              local status=0
              command maturin "$@" || status=$?
              local stats requests hits misses errors
              stats=$(sccache --show-stats)
              printf '%s\n' "$stats"
              # `Compile requests` counts every rustc invocation sccache
              # brokered. `Compile requests executed` is a separate, longer
              # line, so the exact field count pins the one meant here.
              requests=$(awk 'NF == 3 && $1 == "Compile" && $2 == "requests" { print $3; exit }' <<< "$stats")
              hits=$(awk '$1 == "Cache" && $2 == "hits" { print $3; exit }' <<< "$stats")
              misses=$(awk '$1 == "Cache" && $2 == "misses" { print $3; exit }' <<< "$stats")
              errors=$(awk '$1 == "Cache" && ($2 == "errors" || $2 == "read" || $2 == "write") { total += $NF } END { print total + 0 }' <<< "$stats")
              if (( status != 0 )); then
                return "$status"
              fi
              if [[ ! "${requests:-}" =~ ^[0-9]+$ || ! "${hits:-}" =~ ^[0-9]+$ || ! "${misses:-}" =~ ^[0-9]+$ || ! "${errors:-}" =~ ^[0-9]+$ ]]; then
                echo "::error::Could not parse the complete in-container sccache receipt; refusing an unmeasured wheel build."
                return 1
              fi
              if (( requests == 0 )); then
                echo "::error::rustc never reached sccache (0 compile requests): RUSTC_WRAPPER is not bound, so this wheel was compiled outside the shared cache and nothing about it was measured."
                return 1
              fi
              if (( errors != 0 )); then
                echo "::error::Wheel target reported ${errors} cache error(s); refusing an incomplete warm-cache receipt."
                return 1
              fi
              if (( hits == 0 )); then
                echo "::notice::Cold wheel target: ${requests} compile request(s) went through sccache, ${misses} miss(es) written back, 0 reused. Correct but slow; this run seeds the cache for the next release."
              else
                echo "Measured warm wheel build: requests=${requests}, hits=${hits}, misses=${misses}, cache errors=0."
              fi
            }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error

  musllinux:
    needs: gate
    # Built for the full and Linux scopes; the x86 scope is manylinux-only.
    if: github.event.inputs.scope != 'x86'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04,     target: x86_64 }
          # Native ARM host for the musllinux aarch64 build, same
          # reasoning as the manylinux jobs above.
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build musllinux wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
          manylinux: musllinux_1_2
          # #1534: same dubious-ownership fix as the manylinux job — the
          # musllinux_1_2 container mounts the workspace under a foreign uid,
          # blocking build.rs's `git log` author gate.
          before-script-linux: |
            git config --global --add safe.directory '*'
            # maturin-action runs this definition in the same container shell
            # that later invokes maturin. The function therefore brackets the
            # real compiler invocation with target-local counters and turns a
            # build that bypassed the cache into a hard refusal before any
            # artifact upload.
            maturin() {
              # Measured 2026-09-02 (run 33654645604): the Actions cache
              # answered `503 ServerBusy: Egress is over the account limit`,
              # `sccache --start-server` failed outright, and `fail-fast` took
              # the rest of the release matrix with it. opendal classifies that
              # response as retryable, so the start gets a bounded schedule
              # before any compilation begins; a backend still unreachable
              # after it is fatal, exactly as before.
              local attempt started=0
              for attempt in 1 2 3 4 5; do
                if sccache --start-server; then started=1; break; fi
                echo "sccache --start-server failed (attempt ${attempt}/5)."
                if (( attempt < 5 )); then sleep $(( attempt * 20 )); fi
              done
              if (( started == 0 )); then
                echo "::error::sccache could not reach the shared cache backend after 5 attempts; refusing a wheel build with no compiler cache."
                return 1
              fi
              # maturin-action exports RUSTC_WRAPPER in its Node process, but
              # Docker receives an empty value on this route. Bind Cargo to the
              # executable that was just installed inside this container.
              export RUSTC_WRAPPER="$(command -v sccache)"
              sccache --zero-stats
              local status=0
              command maturin "$@" || status=$?
              local stats requests hits misses errors
              stats=$(sccache --show-stats)
              printf '%s\n' "$stats"
              # `Compile requests` counts every rustc invocation sccache
              # brokered. `Compile requests executed` is a separate, longer
              # line, so the exact field count pins the one meant here.
              requests=$(awk 'NF == 3 && $1 == "Compile" && $2 == "requests" { print $3; exit }' <<< "$stats")
              hits=$(awk '$1 == "Cache" && $2 == "hits" { print $3; exit }' <<< "$stats")
              misses=$(awk '$1 == "Cache" && $2 == "misses" { print $3; exit }' <<< "$stats")
              errors=$(awk '$1 == "Cache" && ($2 == "errors" || $2 == "read" || $2 == "write") { total += $NF } END { print total + 0 }' <<< "$stats")
              if (( status != 0 )); then
                return "$status"
              fi
              if [[ ! "${requests:-}" =~ ^[0-9]+$ || ! "${hits:-}" =~ ^[0-9]+$ || ! "${misses:-}" =~ ^[0-9]+$ || ! "${errors:-}" =~ ^[0-9]+$ ]]; then
                echo "::error::Could not parse the complete in-container sccache receipt; refusing an unmeasured wheel build."
                return 1
              fi
              if (( requests == 0 )); then
                echo "::error::rustc never reached sccache (0 compile requests): RUSTC_WRAPPER is not bound, so this wheel was compiled outside the shared cache and nothing about it was measured."
                return 1
              fi
              if (( errors != 0 )); then
                echo "::error::Wheel target reported ${errors} cache error(s); refusing an incomplete warm-cache receipt."
                return 1
              fi
              if (( hits == 0 )); then
                echo "::notice::Cold wheel target: ${requests} compile request(s) went through sccache, ${misses} miss(es) written back, 0 reused. Correct but slow; this run seeds the cache for the next release."
              else
                echo "Measured warm wheel build: requests=${requests}, hits=${hits}, misses=${misses}, cache errors=0."
              fi
            }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    needs: gate
    # Full only: skipped by the Linux and x86 scopes.
    if: github.event.inputs.scope != 'linux' && github.event.inputs.scope != 'x86'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Require reachable shared compiler cache
        shell: bash
        run: |
          set -euo pipefail
          # Same bounded retry as the container jobs: the Actions cache answers
          # a retryable 503 under egress pressure and a single attempt turned
          # that into a lost release on 2026-09-02.
          started=0
          for attempt in 1 2 3 4 5; do
            if sccache --start-server; then started=1; break; fi
            echo "sccache --start-server failed (attempt ${attempt}/5)."
            if (( attempt < 5 )); then sleep $(( attempt * 20 )); fi
          done
          if (( started == 0 )); then
            echo "::error::sccache could not reach the shared cache backend after 5 attempts; refusing a wheel build with no compiler cache."
            exit 1
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          sccache --show-stats
          sccache --zero-stats
      - name: Build macOS wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          sccache: false
          target: ${{ matrix.platform.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
      - name: Require measured warm compiler-cache reuse
        shell: bash
        run: |
          set -euo pipefail
          stats=$(sccache --show-stats)
          printf '%s\n' "$stats"
          # `Compile requests` counts every rustc invocation sccache brokered.
          # `Compile requests executed` is a separate, longer line, so the exact
          # field count pins the one meant here.
          requests=$(awk 'NF == 3 && $1 == "Compile" && $2 == "requests" { print $3; exit }' <<< "$stats")
          hits=$(awk '$1 == "Cache" && $2 == "hits" { print $3; exit }' <<< "$stats")
          misses=$(awk '$1 == "Cache" && $2 == "misses" { print $3; exit }' <<< "$stats")
          errors=$(awk '$1 == "Cache" && ($2 == "errors" || $2 == "read" || $2 == "write") { total += $NF } END { print total + 0 }' <<< "$stats")
          if [[ ! "${requests:-}" =~ ^[0-9]+$ || ! "${hits:-}" =~ ^[0-9]+$ || ! "${misses:-}" =~ ^[0-9]+$ || ! "${errors:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse the complete sccache receipt; refusing an unmeasured wheel build."
            exit 1
          fi
          if (( requests == 0 )); then
            echo "::error::rustc never reached sccache (0 compile requests): RUSTC_WRAPPER is not bound, so this wheel was compiled outside the shared cache and nothing about it was measured."
            exit 1
          fi
          if (( errors != 0 )); then
            echo "::error::Wheel target reported ${errors} cache error(s); refusing an incomplete warm-cache receipt."
            exit 1
          fi
          if (( hits == 0 )); then
            echo "::notice::Cold wheel target: ${requests} compile request(s) went through sccache, ${misses} miss(es) written back, 0 reused. Correct but slow; this run seeds the cache for the next release."
          else
            echo "Measured warm wheel build: requests=${requests}, hits=${hits}, misses=${misses}, cache errors=0."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    needs: gate
    # Full only: skipped on a manual `scope=linux` or `scope=x86` run (same as macos).
    if: github.event.inputs.scope != 'linux' && github.event.inputs.scope != 'x86'
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ matrix.target }}
      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Require reachable shared compiler cache
        shell: pwsh
        run: |
          # Same bounded retry as the other lanes: the Actions cache answers a
          # retryable 503 under egress pressure and a single attempt turned that
          # into a lost release on 2026-09-02.
          $started = $false
          foreach ($attempt in 1..5) {
            sccache --start-server
            if ($LASTEXITCODE -eq 0) { $started = $true; break }
            Write-Host "sccache --start-server failed (attempt $attempt/5)."
            if ($attempt -lt 5) { Start-Sleep -Seconds ($attempt * 20) }
          }
          if (-not $started) { throw 'sccache could not reach the shared cache backend after 5 attempts; refusing a wheel build with no compiler cache.' }
          "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          sccache --show-stats
          sccache --zero-stats
      - name: Build Windows wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          sccache: false
          target: ${{ matrix.target }}
          args: >-
            --profile release-pypi
            --compatibility pypi
            --strip
            --out dist
            --manifest-path crates/gam-pyffi/Cargo.toml
      - name: Require measured warm compiler-cache reuse
        shell: pwsh
        run: |
          $stats = (sccache --show-stats | Out-String)
          Write-Host $stats
          # `Compile requests` counts every rustc invocation sccache brokered.
          # `Compile requests executed` is a separate, longer line, and the
          # anchored `\s+(\d+)\s*$` refuses to match it.
          $requestMatch = [regex]::Match($stats, '(?m)^Compile requests\s+(\d+)\s*$')
          $hitMatch = [regex]::Match($stats, '(?m)^Cache hits\s+(\d+)\s*$')
          $missMatch = [regex]::Match($stats, '(?m)^Cache misses\s+(\d+)\s*$')
          $errorMatches = [regex]::Matches($stats, '(?m)^Cache (?:read |write )?errors\s+(\d+)\s*$')
          if (-not $requestMatch.Success -or -not $hitMatch.Success -or -not $missMatch.Success -or $errorMatches.Count -ne 3) {
            throw 'Could not parse the complete sccache receipt; refusing an unmeasured wheel build.'
          }
          $requests = [int]$requestMatch.Groups[1].Value
          $hits = [int]$hitMatch.Groups[1].Value
          $misses = [int]$missMatch.Groups[1].Value
          $errors = ($errorMatches | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum
          if ($requests -eq 0) { throw 'rustc never reached sccache (0 compile requests): RUSTC_WRAPPER is not bound, so this wheel was compiled outside the shared cache and nothing about it was measured.' }
          if ($errors -ne 0) { throw "Wheel target reported $errors cache error(s); refusing an incomplete warm-cache receipt." }
          if ($hits -eq 0) {
            Write-Host "::notice::Cold wheel target: $requests compile request(s) went through sccache, $misses miss(es) written back, 0 reused. Correct but slow; this run seeds the cache for the next release."
          } else {
            Write-Host "Measured warm wheel build: requests=$requests, hits=$hits, misses=$misses, cache errors=0."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.14.1
          # `locked = true` lives in pyproject.toml so both `build` and
          # `sdist` receive it in maturin's supported configuration layer.
          args: --out dist --manifest-path crates/gam-pyffi/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Upload to PyPI
    needs:
      - linux
      - musllinux
      - macos
      - windows
      - sdist
    # Full releases are atomic platform sets: every advertised wheel family must
    # succeed. A cancelled job is not a deliverable and must never be treated like
    # an intentional skip. Only a manually selected narrower scope may accept the
    # exact jobs that scope deliberately skipped.
    if: >-
      ${{
        always() &&
        needs.linux.result == 'success' &&
        needs.sdist.result == 'success' &&
        (
          (
            github.event.inputs.scope == 'x86' &&
            needs.musllinux.result == 'skipped' &&
            needs.macos.result == 'skipped' &&
            needs.windows.result == 'skipped'
          ) ||
          (
            github.event.inputs.scope == 'linux' &&
            needs.musllinux.result == 'success' &&
            needs.macos.result == 'skipped' &&
            needs.windows.result == 'skipped'
          ) ||
          (
            github.event.inputs.scope == 'full' &&
            needs.musllinux.result == 'success' &&
            needs.macos.result == 'success' &&
            needs.windows.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download all wheel + sdist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show what will be uploaded
        run: ls -la dist
      - name: Upload to PyPI via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --verbose --skip-existing --non-interactive dist/*
