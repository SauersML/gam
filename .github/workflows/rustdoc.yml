name: Rustdoc census

# The rustdoc surface had NO job at all (#2711) -- not a job that ran without
# gating, not a check scoped past its target: nothing in `.github/` ran
# `cargo doc` or `rustdoc`. `docs.yml` is named `docs`, is green every night in
# ~50s, and builds the mkdocs site; it never touches Rust. So "docs is green"
# was true and carried no information about rustdoc, which exits 101.
#
# The bar is ZERO for every crate: `scripts/rustdoc_gate.sh` fails on any
# rustdoc error and there is no list of tolerated crates. #2753 measured the
# tree-wide debt at 754 errors across 15 crates -- the issue quoted 182, because
# nobody had swept every crate -- and fixed every one. See that script's header
# for the per-crate coverage control that keeps a green from being a non-run.
#
# THE GATE NOW LIVES IN `cross-check.yml`, on push. This workflow is the
# on-demand full census, not the gate, and it is deliberately no longer
# scheduled.
#
# It was introduced schedule-only, deferring promotion to "the commit that can
# demonstrate it green there". Run 30690710961 on 407d66f16 was that
# demonstration -- green on an ordinary commit, 24 crates scanned -- so the
# deferral's condition was met and the step moved to `linux-native-check`,
# which already has every dependency's rmeta built under sccache.
#
# The nightly cron was REMOVED with that move rather than kept as a second
# opinion. A scheduled job whose verdict nobody is required to look at is the
# same shape as the `docs.yml` decoy this replaced: it accumulates green runs
# while a crate going red fails only a run nobody opens.
# "Visible and trending" is a claim about a reader, and the push gate is the
# only place that has one. Dispatch this when you want the per-crate table --
# e.g. while fixing a crate, before putting it in front of the push gate.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the commit: the verdict's subject is the commit, and superseding it
  # destroys the only record of it (the reasoning cross-check.yml records).
  group: rustdoc-census-${{ github.sha }}
  cancel-in-progress: false

jobs:
  census:
    name: cargo doc --no-deps, per crate, zero-error bar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Rustdoc census
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
        run: |
          set +e
          scripts/rustdoc_gate.sh
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error title=Rustdoc census could not measure::The scan did not run to completion, so this run says nothing about the rustdoc surface. Treat it as a non-run, not as a pass."
          fi
          exit "$status"
