name: Python Contracts

# Fast Python full-fit contract checks, decoupled from the heavy Rust suite.
#
# The "Rust CI" workflow (test.yml) runs its Python pytest steps only AFTER the
# full Rust nextest suite in the same job, so a Python-only contract (e.g. the
# curv #1464 sign-recovery or the by-variable #1513 predict-clip guard) is not
# observable until hours into that run. This workflow builds just the maturin
# wheel and runs the targeted Python contract tests, so a fix to a Python-facing
# contract verifies in ~20-30 min instead of being hostage to the Rust suite.
# It is also the intended fast home for wiring in the orphaned Python contract
# tests tracked by #1512.

on:
  # The #1512 full-suite inventory is this workflow's deliverable and it had NO
  # automatic trigger on main: every run since 2026-07-07 was a hand-dispatched
  # workflow_dispatch. So the Python surface's verdict was only ever as fresh as
  # the last person who remembered to ask for it, and gam#2616's headline count
  # was measured 276 commits before it was read. A surface nobody schedules is a
  # surface that goes dark without anything turning red.
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      # Any Python test or the gamfit package itself: the #1512 full-suite
      # triage step below runs the whole tests/ directory on a fresh wheel, so a
      # PR touching any test_*.py (or gamfit/) gets a fast pass/fail inventory
      # without waiting on the multi-hour Rust suite in test.yml.
      - "tests/**"
      - "gamfit/**"
      - "src/inference/model.rs"
      - "src/inference/predict/mod.rs"
      - "src/inference/predict/standard.rs"
      - "src/terms/smooth/spatial_optimization.rs"
      - ".github/workflows/python-contracts.yml"

concurrency:
  # Keyed on the EVENT as well as the ref, and cancelling only for pull_request.
  # Superseding a PR's own newer push is right. Cancelling a 3-hour scheduled
  # inventory because someone dispatched one is not: both lanes key `main` on the
  # old expression, so either would silently destroy the other's measurement and
  # a cancelled run is not a red one. That is the exact failure mode measured on
  # wheel-nightly.yml (19 of 20 runs cancelled, zero successful, nothing red),
  # and this workflow carried the same shape. Same-event dispatches now QUEUE
  # instead of killing each other, which costs latency and preserves the result.
  group: python-contracts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Warm the dependency compile across runs via the GitHub Actions sccache
  # backend, so the maturin wheel build does not recompile the full dep closure
  # (faer/ndarray/nalgebra/arrow/…) on every run. setup-rust-ci enables the
  # RUSTC_WRAPPER only after a backend-reachability probe, so a cache outage
  # degrades to a cold-but-green build rather than a hard failure.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  python-contracts:
    permissions:
      contents: write
      actions: read
    name: Python contracts
    runs-on: ubuntu-latest
    # 60 was not enough to reach this workflow's own deliverable. Measured on
    # run 30350788096: the maturin wheel build alone consumed ~25 min, the three
    # targeted contracts ran, and the #1512 full-suite triage was then CANCELLED
    # mid-run when the job hit the cap at exactly 60 min (10:26:55Z -> 11:27:20Z)
    # — no JUnit inventory, no artifact, nothing published. The workflow's stated
    # purpose is "a fast pass/fail inventory" of tests/, and it structurally
    # could not produce one.
    #
    # The header's "20-30 min" estimate predates a much larger tests/ directory.
    #
    # 150 then failed the same way 60 did, twice: runs 30477445056 and
    # 30498582489 were both CANCELLED at exactly 2h30m with the triage step
    # mid-suite (23:26:50 -> 01:39:19, 2h12m of pytest), so neither produced a
    # JUnit inventory and gam#2616 had no re-measurement for 20 hours.
    #
    # The reason 150 was believed sufficient was the claim below it — "every test
    # inside it is already capped at 300 s by pytest-timeout, so this cannot
    # become the multi-hour wedge". That premise is FALSE, and measured false in
    # the last completed run's own artifact (30432774305): of the 26 tests killed
    # by pytest-timeout, 12 ran LONGER than the 300 s bound, the worst for 959.7 s
    # — 3.2x over. The default timeout method is SIGALRM, and a Python-level
    # signal handler only runs at a bytecode boundary, so a fit that spends its
    # time inside the Rust extension is not preempted until that native call
    # returns. `--timeout-method=thread` below makes the bound real; this cap is
    # the backstop, not the mechanism.
    #
    # 300 is sized off a measured suite (3796 s of pytest at the last completed
    # run, >7900 s at the two cancelled ones) plus the fixed ~17 min wheel build,
    # and stays a bound rather than an open budget.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # build.rs human-author gate needs the real last build.rs editor; a
          # shallow clone makes git log return HEAD and false-fails the gate.
          fetch-depth: 0

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          free-disk-space: 'true'
          # Cache the compiled `target/` (deps + prior gam/gam-pyffi objects)
          # across runs so the maturin wheel build is incremental: a cold run
          # populates the cache, subsequent runs restore it and recompile only
          # the crates whose sources changed (~3-5 min instead of ~13). This is
          # the dominant cost of the fast Python-contract verification.
          cache-targets: 'true'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install maturin
        run: python -m pip install --upgrade pip "maturin>=1.7,<2"

      - name: Build and install gam extension (maturin build + wheel install)
        id: extension
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          maturin build --release -i python3 -o dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Install Python test extras
        id: test-extras
        run: |
          python -m pip install \
            'pytest>=8' 'numpy>=1.26' 'pandas>=2.0' 'pyarrow>=14' \
            'matplotlib>=3.8' 'scikit-learn>=1.4' 'lifelines>=0.28'

      - name: Run numeric by-variable predict-clip contract (#1513)
        if: ${{ !cancelled() && steps.extension.outcome == 'success' && steps.test-extras.outcome == 'success' }}
        # s(x, by=z): the numeric by-multiplier must not be axis-clipped to its
        # training range at predict time, so the prediction stays affine in z.
        # Guards the collect_by_variable_numeric_axes exemption in model.rs.
        #
        # Run from runner.temp, NOT the repo root: the maturin wheel installs
        # gamfit (incl. the compiled gamfit._rust) into site-packages, but the
        # source tree's ./gamfit has no compiled _rust, so `python -m pytest`
        # from the repo root imports the source package and fails with
        # `ModuleNotFoundError: gamfit._rust`. Running from a directory without
        # ./gamfit makes the installed wheel win the import.
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/test_bug_hunt_numeric_by_variable_clamped_to_training_range_at_predict.py" -v --tb=short

      # ── every contract below runs, even after one above it fails ─────────
      #
      # These steps MEASURE independent contracts; none is a precondition for
      # the next. Unguarded they inherit step-sequential semantics, so the first
      # red one cancels every measurement after it — including the #1512
      # full-suite triage, which is the entire reason this workflow exists
      # ("a fast pass/fail inventory", per the header).
      #
      # Measured on run 30349168807: the #1464 curv contract went red and took
      # steps 10-12 with it, so the triage that was supposed to give a 20-30
      # minute inventory produced nothing at all and the upload published an
      # empty result. This is the same defect 414888eb3 fixed in test.yml's
      # python-tests job, and the two were found within hours of each other.
      #
      # `!cancelled()` rather than `always()`: a real cancellation still stops
      # the job, but an upstream FAILURE no longer decides what gets measured.
      # The job conclusion is unchanged — a failed step fails the job whether or
      # not later steps run — so this only ever ADDS evidence.
      - name: Run curv() constant-curvature sign-recovery contract (#1464)
        if: ${{ !cancelled() && steps.extension.outcome == 'success' && steps.test-extras.outcome == 'success' }}
        # Hyperbolic (kappa*<0) data must not be recovered as spherical; the
        # Python full-fit path must recover the signed curvature estimand.
        # Matches the Rust bug_hunt_1464_* production-estimand gates.
        #
        # Run from runner.temp, NOT the repo root: the maturin wheel installs
        # gamfit (incl. the compiled gamfit._rust) into site-packages, but the
        # source tree's ./gamfit has no compiled _rust, so `python -m pytest`
        # from the repo root imports the source package and fails with
        # `ModuleNotFoundError: gamfit._rust`. Running from a directory without
        # ./gamfit makes the installed wheel win the import.
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/test_bug_hunt_curv_smooth_hyperbolic_recovered_as_spherical.py" -v --tb=short

      - name: Run all-zero-count predictable-mean contract (#1515)
        if: ${{ !cancelled() && steps.extension.outcome == 'success' && steps.test-extras.outcome == 'success' }}
        # A Poisson/NB GAM fitted on identically-zero counts must stay
        # predictable: the response-scale posterior mean overflows on the
        # near-singular flat-likelihood Hessian, so predict must fall back to
        # the finite plug-in mean g^-1(eta_hat) instead of returning None.
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/test_bug_hunt_poisson_zero_count_fit_unpredictable_mean.py" -v --tb=short

      - name: Run bench-package Python tests (#1512 orphans)
        if: ${{ !cancelled() && steps.extension.outcome == 'success' && steps.test-extras.outcome == 'success' }}
        # `bench/` holds five pytest files — 26 test functions covering the
        # manifold-zoo geometry contracts, the exact analytic handoff, the zoo
        # figure records and the synthetic-SAE metrics — and they ran in NO CI
        # job. `pyproject.toml` sets `testpaths = ["tests"]`, and BOTH
        # directory-level steps pass an explicit `tests/` target, which
        # overrides testpaths entirely; no step ever named `bench`. This is the
        # #1512 defect one directory over, found by the widened guard in
        # tests/test_ci_no_orphan_python_tests_1512.py.
        #
        # A DIRECTORY target, not a list of five filenames: naming files is what
        # produced the orphans in the first place, and the guard now requires a
        # step that covers the directory.
        #
        # `bench` is a namespace package (no __init__.py) imported as
        # `bench.manifold_zoo_geometry`, so the repo root must be importable —
        # but putting the repo root itself on sys.path would shadow the
        # installed wheel with the source `./gamfit`, which has no compiled
        # `_rust` (two of these modules import gamfit). A directory holding only
        # a symlink to `bench/` gives the package without the shadow.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p benchpath
          ln -sfn "$GITHUB_WORKSPACE/bench" benchpath/bench
          PYTHONPATH="$PWD/benchpath" python -m pytest "$GITHUB_WORKSPACE/bench" \
            -p no:cacheprovider -v --tb=short

      - name: Install full-suite test runners (xdist + timeout)
        id: test-runners
        if: ${{ !cancelled() && steps.extension.outcome == 'success' && steps.test-extras.outcome == 'success' }}
        # The full tests/ triage below fits hundreds of real models; xdist
        # parallelizes across the runner's cores and pytest-timeout bounds any
        # single hang so one stuck fit cannot wedge the whole job — but only with
        # --timeout-method=thread, see the timeout-minutes note above. Under the
        # default SIGALRM method 12 of 26 timed-out tests overran the 300 s bound,
        # one by 3.2x, because the handler cannot run while the interpreter is
        # inside a Rust call.
        #
        # Why the thread method CAN fire where SIGALRM cannot, since it is not
        # obvious: a Python signal handler only runs in the MAIN thread at a
        # bytecode boundary, and the main thread is blocked inside the extension,
        # so releasing the GIL does not help it. pytest-timeout's thread method
        # instead arms a separate Python thread, and gam-pyffi DOES release the
        # GIL around the solver (29 `py.detach(...)` sites; `fit_table` is
        # explicit about it), so that thread is schedulable while Rust runs and
        # can terminate the worker on time.
        #
        # MEASURED COUNTEREXAMPLE -- the paragraph above is true of the paths it
        # names and NOT true of every path. In run 30503262222 the Python job
        # reported 36 `Failed: Timeout (>300.0s)` entries, which is the mechanism
        # working; but at least one SAE manifold fixture logged an elapsed time of
        # `[1h 31m]` INSIDE that same 300s cap. A watchdog thread that cannot
        # preempt for 91 minutes is a watchdog that did not fire, so some entry
        # point on that path holds the GIL across the solve rather than detaching
        # around it.
        #
        # Recorded rather than fixed because the fix is to find and detach that
        # site, not to change the timeout method -- SIGALRM still cannot work
        # here, for the reason given above. Until then, read a Python-suite
        # duration as a LOWER bound on the work done: the 3h 05m wall clock of
        # that run is not bounded by 300s x tests, and a test that reports as a
        # timeout may have run for arbitrarily longer than its cap says.
        #
        # DO NOT READ THE 36 AS A GENERAL PROPERTY -- it is a property of one run.
        # Two later runs recorded ZERO `Failed: Timeout` entries: 30513113487
        # (`3236fed05`, 35 errors) and a local 128-core run at `b8745892a`
        # (22 errors). In BOTH, every error was `worker 'gwN' crashed while
        # running ...` instead. That is not a different failure -- it is the same
        # one wearing a different label, and the label is the point:
        #
        #   `--timeout-method=thread` KILLS THE WORKER rather than raising in it,
        #   so a thread-method timeout surfaces as a worker crash and NEVER as a
        #   `Failed: Timeout` entry. The `Failed: Timeout` string is SIGALRM-only.
        #
        # Proven by rerunning one of them serially with no `--timeout` at all:
        # `test_structure_certificate_1058` does not crash, it runs 334.14s -- past
        # the 300s cap -- and fails with a typed engine error (`inner solve did not
        # converge at fixed rho; ||g||=3.667789e0 vs tolerance 1.221293e-2 after 990
        # inner iterations`). Under the cap that same test is a "crash".
        #
        # Two consequences for anyone reading this artifact. A zero
        # `Failed: Timeout` count is NOT evidence that nothing timed out -- count
        # `crashed while running` instead. And the crash count is a function of
        # MACHINE SPEED, not of the tests: a slow hosted runner pushes more tests
        # past 300s than a fast box does, which is exactly why 36, 35 and 22 all
        # describe the same suite. Quote any of these numbers with its run id AND
        # its machine, never on its own.
        run: python -m pip install 'pytest-xdist>=3' 'pytest-timeout>=2'

      - name: Build gam release binary for CLI contracts
        id: cli
        if: ${{ !cancelled() && steps.extension.outcome == 'success' }}
        # tests/ contains real CLI serialization and integration contracts. The
        # maturin wheel supplies only gamfit._rust, so without this build those
        # tests fail at capability discovery and never reach the boundary they
        # guard. This mirrors test.yml's full-suite prerequisite and reuses the
        # release artifacts already warmed by maturin above.
        run: cargo build --release -p gam-cli

      - name: Triage full Python suite on the fresh wheel (#1512)
        if: ${{ !cancelled() && steps.extension.outcome == 'success' && steps.test-extras.outcome == 'success' && steps.test-runners.outcome == 'success' && steps.cli.outcome == 'success' }}
        # #1512 authoritative full-suite triage. test.yml already runs
        # `pytest tests/` but only AFTER the multi-hour Rust nextest suite, so a
        # fresh-build pass/fail inventory of the 240 test files is hours away.
        # This step runs the SAME directory-level invocation here, against the
        # maturin wheel just built+installed above, so the inventory lands in
        # ~30 min. It is the instrument for classifying the orphaned repros
        # (real-bug vs stale-test) without a stale local extension.
        #
        # Run from runner.temp so the INSTALLED wheel's gamfit._rust wins over
        # the source-tree ./gamfit (same reason as the contract steps above).
        # SPEC 16 (no XFAIL): the job reports red when the suite is red, and
        # collection errors abort loudly instead of being skipped past. The
        # JUnit artifact (uploaded with `if: always()`) stays the durable
        # per-file record; nothing gates pushes to main on this status.
        #
        # --max-worker-restart is EXPLICIT because --timeout-method=thread kills
        # the xdist worker rather than raising in it, and the last completed run
        # had 26 timeouts — so this job now expects ~26 worker deaths as normal
        # operation. Whatever xdist's unconfigured default does on the Nth crash,
        # an unattended 12-hourly job must not be one version bump away from
        # aborting the suite partway and publishing a truncated inventory. 200 is
        # far above any plausible count while still bounding a true crash loop.
        #
        # faulthandler_timeout=240 is what makes those worker deaths DIAGNOSABLE,
        # and without it every one of them is reason-free. pytest-timeout's thread
        # method does produce a diagnosis -- `timeout_timer` calls
        # `dump_stacks(terminal)` naming the exact hung frame -- and then calls
        # `os._exit(1)` on the very next line. Under xdist that terminal is a
        # buffered execnet channel, and `os._exit` skips every flush, so the dump
        # is written and discarded microseconds later. That is the whole reason a
        # timed-out test reports only `worker 'gwN' crashed while running ...`
        # with no stack: the stack existed and was thrown away.
        #
        # pytest's own faulthandler plugin re-arms `dump_traceback_later` per test
        # item and writes from C straight to fd 2, which is neither buffered by
        # execnet nor dependent on a Python flush, so its dump survives the
        # `os._exit` that eats pytest-timeout's. 240 < 300 is load-bearing: the
        # dump must fire BEFORE pytest-timeout kills the worker, and 60s of margin
        # covers a badly contended runner. `faulthandler_exit_on_timeout` stays at
        # its default false so pytest-timeout still owns the kill and the 300s
        # verdict is unchanged -- this adds evidence, it does not change any
        # pass/fail outcome or any count in the JUnit artifact.
        #
        # MEASURED, not assumed: verified on a `time.sleep` fixture under
        # `-n 2 --timeout=20 --timeout-method=thread`. Without it, the run emits
        # `[gw1] node down: Not properly terminated` + `worker 'gw1' crashed while
        # running ...` and no stack. With it, the controller log names the hung
        # test function and its callers. Caveat worth knowing when reading the
        # log: concurrent workers write their dumps to the same fd 2 with no
        # locking, so simultaneous dumps interleave character-wise and need
        # picking apart by hand. Interleaved evidence still beats none.
        working-directory: ${{ runner.temp }}
        # The faulthandler dumps described above are written to fd 2 and are the
        # ONLY surviving record of why a killed worker was killed, so they are
        # teed to a file rather than left to the step log: the summary step below
        # is what turns them back into per-test evidence, and it needs them as a
        # file it can parse in-job.
        #
        # The exit code is taken from PIPESTATUS, not from the pipeline. A
        # pipeline reports `tee`'s status, and `tee` always succeeds — piping
        # this step without that would turn every red suite green.
        run: |
          set -uo pipefail
          python -m pytest "$GITHUB_WORKSPACE/tests/" \
            -m "not slow" \
            -p no:cacheprovider \
            -n auto --timeout=300 --timeout-method=thread \
            --max-worker-restart=200 \
            -o faulthandler_timeout=240 \
            -o addopts="--import-mode=importlib" \
            --junitxml="$RUNNER_TEMP/py1512_junit.xml" \
            -q --tb=line 2>&1 | tee "$RUNNER_TEMP/py1512_output.log"
          status=${PIPESTATUS[0]}
          echo "pytest exit status: $status"
          exit "$status"

      - name: Recover the censored tests into py1512_summary.txt (#2599)
        if: always()
        # A per-test timeout kill erases the test from the inventory as a
        # REASON: `--timeout-method=thread` terminates the worker, so the JUnit
        # gets `worker 'gwN' crashed` with `time="0.000"` and no message. On run
        # 30637393388 that was 34 of the 137 red tests — a quarter of the red
        # population published as unexplained, indistinguishable from a crashed
        # interpreter, and with the wall clock they consumed recorded as zero.
        #
        # The evidence already exists: `faulthandler_timeout=240` fires before
        # the 300 s kill and every one of those 34 workers printed a full stack.
        # It was simply five figures of build log that nothing read. This step
        # joins the JUnit's list of censored tests to those stacks and writes the
        # `py1512_summary.txt` that the publish step below has always named and
        # that nothing has ever produced (missing files are skipped silently, so
        # the gap never surfaced).
        #
        # Verified against this run's own artifacts before landing: 34/34
        # censored tests matched to a stack, 0 unrecovered.
        #
        # `always()` and a tolerated failure: this step only ADDS evidence, and
        # a summary that cannot be built must not change the suite's verdict.
        continue-on-error: true
        run: |
          if [ ! -f "$RUNNER_TEMP/py1512_junit.xml" ]; then
            echo 'Python suite: NOT MEASURED; no JUnit inventory was produced.' | tee "$RUNNER_TEMP/py1512_summary.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python "$GITHUB_WORKSPACE/.github/scripts/py1512_summary.py" \
            "$RUNNER_TEMP/py1512_junit.xml" \
            "$RUNNER_TEMP/py1512_output.log" \
            "$RUNNER_TEMP/py1512_summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full-suite JUnit inventory (#1512)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py1512-junit
          path: |
            ${{ runner.temp }}/py1512_junit.xml
            ${{ runner.temp }}/py1512_summary.txt
          if-no-files-found: warn


      # Track this run's uncompressed numbers in-tree (bench/gha_results/python-contracts).
      # always() so a failed or timed-out run still publishes what it measured -
      # those numbers are usually the interesting ones. Publishes nothing when the
      # run produced no results, so a bad run never blanks the last good one.
      - name: Publish results to bench/gha_results
        if: always()
        uses: ./.github/actions/publish-gha-results
        with:
          name: python-contracts
          files: |
            ${{ runner.temp }}/py1512_junit.xml
            ${{ runner.temp }}/py1512_summary.txt
