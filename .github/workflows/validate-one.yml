name: Validate One

# Minimal, single-job, on-demand validation for the issue-fixer agents.
#
# WHY THIS EXISTS
# ---------------
# The full `Rust CI` (test.yml) is an 11+-job fan-out (build archive + N test
# shards + pyffi + aggregate + python-tests). When the runner pool is saturated
# by matrix jobs (Publish wheels, Build and Release All, the 6h Claude Fixer),
# that whole graph sits QUEUED for a long time, so a fixer waiting to confirm a
# one-line fix gets no feedback. This workflow is ONE ubuntu-latest job with a
# tiny footprint that schedules into any small runner gap and fails fast. Rust
# filters consume the exact-SHA nextest archive produced by test.yml: Validate
# One NEVER rebuilds or relinks Rust tests. If no exact archive exists, it fails
# immediately and tells the caller to dispatch Rust CI.
#
# Python and torch filters consume an exact-SHA manylinux wheel from
# wheel-nightly.yml. If that immutable artifact does not exist, Validate One
# commissions precisely that commit and waits only for the synchronously returned
# run ID. Tests run from runner.temp so the checked-out source package cannot
# shadow the installed wheel. Validate One itself therefore compiles nothing:
# Rust uses a nextest archive; Python uses the exact commissioned runtime.
#
# TORCH PATH (opt-in): torch is NOT installed by any CI workflow, so the
# tests/torch/ suite (#1890/#1891/#1893/#1939/#1942/#2011/#2015/#2021/#2022/#2023
# cluster) has no validation path. Set `torch_filter` to pip-install the CPU
# torch wheel and run tests/torch. It is OFF by default (the wheel is a heavy
# ~200MB download) so the normal fast path stays lean — only torch-cluster
# validations pay the cost.

on:
  workflow_dispatch:
    inputs:
      evidence_sha:
        description: "Exact 40-character commit whose prebuilt artifacts should be tested. Empty = dispatch SHA."
        default: ""
        required: false
      rust_filter:
        description: "Rust test-name substring(s), whitespace-separated. Empty = skip Rust."
        default: ""
        required: false
      rust_package:
        description: "Optional Cargo package for focused Rust tests. Empty = archived workspace."
        default: ""
        required: false
      py_filter:
        description: "pytest -k expression. Empty = skip Python."
        default: ""
        required: false
      py_path:
        description: "Repository-relative Python test file or directory to collect."
        default: "tests"
        required: false
      py_timeout_seconds:
        description: "Execution-only Python test budget; excludes runtime build/install."
        default: "600"
        required: false
      torch_filter:
        description: "pytest -k expr over tests/torch (pip-installs CPU torch). Empty = skip torch."
        default: ""
        required: false
      issue:
        description: "Issue number, for labeling / concurrency keying only."
        default: ""
        required: false
      source_base:
        description: "Optional exact base SHA for a read-only source retirement report."
        default: ""
        required: false

# Key concurrency on the issue so two DIFFERENT issues validating at once do not
# cancel each other; a newer dispatch for the SAME issue supersedes the older.
concurrency:
  group: validate-one-${{ github.event.inputs.issue }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate one (issue ${{ github.event.inputs.issue }})
    runs-on: ubuntu-latest
    # Leave room for the wheel commission's explicit 30-minute deadline and the
    # requested tests. The producer's measured maximum is under 15 minutes.
    timeout-minutes: 45
    steps:
      - name: Resolve immutable evidence commit
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event.inputs.evidence_sha }}
        run: |
          set -euo pipefail
          evidence_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          if [[ ! "$evidence_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::evidence_sha must be one full lowercase 40-character commit SHA; got '${evidence_sha}'."
            exit 1
          fi
          resolved_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${evidence_sha}" --jq .sha)
          if [[ "$resolved_sha" != "$evidence_sha" ]]; then
            echo "::error::Requested evidence commit ${evidence_sha} resolved to ${resolved_sha}."
            exit 1
          fi
          printf 'sha=%s\n' "$evidence_sha" >> "$GITHUB_OUTPUT"
          printf 'TARGET_SHA=%s\n' "$evidence_sha" >> "$GITHUB_ENV"
          echo "Validate One will consume only artifacts recorded for ${evidence_sha}."

      - name: Checkout immutable evidence commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.evidence.outputs.sha }}

      - name: Install cargo-nextest
        if: ${{ github.event.inputs.rust_filter != '' }}
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The prebuilt gam-pyffi test binary embeds Python, and some tests exercise
      # the NumPy C API. Establish that runtime interpreter explicitly; the
      # Python/torch paths below reuse it.
      - name: Set up Python 3.11
        if: ${{ (github.event.inputs.rust_filter != '' && github.event.inputs.rust_package == 'gam-pyffi') || github.event.inputs.py_filter != '' || github.event.inputs.torch_filter != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Provide NumPy to embedded gam-pyffi tests
        if: ${{ github.event.inputs.rust_filter != '' && github.event.inputs.rust_package == 'gam-pyffi' }}
        run: |
          python -m pip install --upgrade "numpy<2"
          python -c "import numpy; print('numpy', numpy.__version__, numpy.get_include())"

      # ---- Python runtime: exact-SHA prebuilt wheel only ------------------
      - name: Download or commission exact-SHA runtime
        id: runtime
        if: ${{ github.event.inputs.py_filter != '' || github.event.inputs.torch_filter != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="gamfit-runtime-${TARGET_SHA}"
          run_id=""
          owned_run=false

          # A build_sha dispatch runs on main's tip, so its Actions headSha is
          # deliberately NOT the commit it builds. The exact artifact name is
          # the lookup identity; the sealed provenance below is the content
          # identity. Restrict candidates to this producer workflow before use.
          wheel_workflow_id=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/wheel-nightly.yml" \
            --jq .id)
          artifacts=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")
          while IFS=$'\t' read -r candidate artifact_id; do
            if [[ -z "$candidate" || -z "$artifact_id" ]]; then
              continue
            fi
            candidate_run=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}")
            if [[ "$(jq -r .workflow_id <<< "$candidate_run")" != "$wheel_workflow_id" \
              || "$(jq -r .status <<< "$candidate_run")" != "completed" \
              || "$(jq -r .conclusion <<< "$candidate_run")" != "success" ]]
            then
              continue
            fi
            candidate_artifacts=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" \
            )
            matching_count=$(jq --arg name "$artifact_name" \
              '[.artifacts[]
                | select(.name == $name and (.expired | not))]
               | length' <<< "$candidate_artifacts")
            matching_id=$(jq -r --arg name "$artifact_name" \
              '[.artifacts[]
                | select(.name == $name and (.expired | not))][0].id
               // empty' <<< "$candidate_artifacts")
            if [[ "$matching_count" -eq 1 && "$matching_id" == "$artifact_id" ]]
            then
              run_id="$candidate"
              break
            fi
          done < <(
            jq -r --arg name "$artifact_name" \
              '.artifacts[]
               | select(
                   .name == $name
                   and (.expired | not)
                   and .workflow_run != null
                 )
               | [.workflow_run.id, .id]
               | @tsv' <<< "$artifacts"
          )

          if [[ -z "$run_id" ]]; then
            # `return_run_details=true` changes this endpoint from 204 No Content
            # to a synchronous run-details response. That run ID is the ownership
            # proof: after dispatch this step polls and consumes ONLY this run,
            # and it never calls a cancellation endpoint.
            dispatch=$(gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/wheel-nightly.yml/dispatches" \
              -f ref=main \
              -f "inputs[build_sha]=${TARGET_SHA}" \
              -F return_run_details=true)
            run_id=$(jq -er '.workflow_run_id' <<< "$dispatch")
            run_url=$(jq -er '.html_url' <<< "$dispatch")
            owned_run=true
            {
              echo "### Commissioned exact-SHA runtime"
              echo
              echo "- commit: \`${TARGET_SHA}\`"
              echo "- artifact: \`${artifact_name}\`"
              echo "- owned run: [\`${run_id}\`](${run_url})"
              echo
              echo "The synchronous run ID is the ownership boundary; this step never cancels it."
            } >> "$GITHUB_STEP_SUMMARY"

            deadline=$(( $(date +%s) + 1800 ))
            while true; do
              owned=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
              if [[ "$(jq -r .workflow_id <<< "$owned")" != "$wheel_workflow_id" ]]; then
                echo "::error::Owned run ${run_id} does not belong to wheel-nightly.yml."
                exit 1
              fi
              run_status=$(jq -r .status <<< "$owned")
              if [[ "$run_status" == "completed" ]]; then
                run_conclusion=$(jq -r .conclusion <<< "$owned")
                if [[ "$run_conclusion" != "success" ]]; then
                  echo "::error::Owned wheel run ${run_id} completed with conclusion '${run_conclusion}'."
                  exit 1
                fi
                break
              fi
              if (( $(date +%s) >= deadline )); then
                echo "::error::Owned wheel run ${run_id} did not complete inside 30 minutes; it was left running."
                exit 1
              fi
              sleep 15
            done
          else
            {
              echo "### Reused exact-SHA runtime"
              echo
              echo "- commit: \`${TARGET_SHA}\`"
              echo "- artifact: \`${artifact_name}\`"
              echo "- producer run: \`${run_id}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Recheck the exact owned/reused run after any wait. There must be one
          # unexpired artifact of the requested name and no rolling fallback.
          final_artifacts=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")
          artifact_count=$(jq --arg name "$artifact_name" \
            '[.artifacts[]
              | select(.name == $name and (.expired | not))]
             | length' <<< "$final_artifacts")
          if [[ "$artifact_count" -ne 1 ]]; then
            echo "::error::Run ${run_id} has ${artifact_count} unexpired ${artifact_name} artifacts; expected exactly one."
            exit 1
          fi

          printf 'run_id=%s\nowned=%s\n' "$run_id" "$owned_run" >> "$GITHUB_OUTPUT"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir python-runtime
          test "$(grep -c '^commit=' python-runtime/RUNTIME_PROVENANCE.txt)" -eq 1
          grep -Fx "commit=${TARGET_SHA}" python-runtime/RUNTIME_PROVENANCE.txt
          (
            cd python-runtime
            tail -n +2 RUNTIME_PROVENANCE.txt | sha256sum -c -
          )
          mapfile -t wheels < <(
            find python-runtime -maxdepth 1 -type f -name 'gamfit-*.whl' -print
          )
          if [[ "${#wheels[@]}" -ne 1 || ! -s "${wheels[0]}" ]]; then
            echo "::error::Runtime artifact ${artifact_name} must contain exactly one non-empty gamfit wheel."
            exit 1
          fi
          python -m pip install --force-reinstall "${wheels[0]}"
          (
            cd "$RUNNER_TEMP"
            python -c "import gamfit, gamfit._rust; print('exact runtime import ok:', gamfit.__version__)"
          )

      # ---- Rust path: exact-SHA prebuilt archive only ----------------------
      - name: Download exact-SHA Rust test archive
        if: ${{ github.event.inputs.rust_filter != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_PACKAGE: ${{ github.event.inputs.rust_package }}
        run: |
          set -euo pipefail
          archive_name=nx-archive
          archive_file=nx.tar.zst
          if [[ "$RUST_PACKAGE" == "gam-pyffi" ]]; then
            archive_name=nx-pyffi-archive
            archive_file=nx-pyffi.tar.zst
          fi

          # Find an archive for THIS commit only, from either producer. A run may
          # still be going: the archive uploads before the long run shards finish.
          #
          # `rust-archive.yml` is tried FIRST because it is the purpose-built
          # producer and cannot be cancelled by another lane: its concurrency is
          # keyed on the SHA with `cancel-in-progress: false`, so an archive, once
          # started for a commit, always lands (#2429). `test.yml` remains a valid
          # source and is tried second — its archive is identical when it survives,
          # but its workflow-level `cancel-in-progress` on a REF-keyed group means
          # any other lane's dispatch destroys it mid-build, which is why relying
          # on it alone left active development with no fast path at all.
          #
          # The exact-SHA contract is unchanged: whichever producer supplies the
          # archive, its `headSha` must equal the commit under test, and there is
          # still NO source-build fallback.
          run_id=""
          archive_source=""
          for workflow_file in rust-archive.yml test.yml; do
            while IFS=$'\t' read -r candidate candidate_sha; do
              if [[ -z "$candidate" || "$candidate_sha" != "$TARGET_SHA" ]]; then
                continue
              fi
              artifact_count=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" \
                --jq ".artifacts | map(select(.name == \"${archive_name}\" and (.expired == false))) | length")
              if [[ "$artifact_count" -ne 1 ]]; then
                echo "${workflow_file} run ${candidate} has no unexpired ${archive_name}."
                continue
              fi
              if gh run download "$candidate" --repo "$GITHUB_REPOSITORY" \
                --name "$archive_name" --dir rust-archive; then
                run_id="$candidate"
                archive_source="$workflow_file"
                break
              fi
            done < <(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow_file" \
              --commit "$TARGET_SHA" \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv')
            if [[ -n "$run_id" ]]; then
              break
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::No exact-SHA ${archive_name} exists for ${TARGET_SHA} from rust-archive.yml or test.yml. Dispatch 'Rust Test Archive' for this SHA and wait for its archive step; Validate One never performs a source-build fallback."
            exit 1
          fi
          test -s "rust-archive/${archive_file}"
          printf 'run_id=%s\ncommit=%s\nartifact=%s\nsource_workflow=%s\n' \
            "$run_id" "$TARGET_SHA" "$archive_name" "$archive_source" \
            | tee rust-archive/PROVENANCE.txt

      - name: Run Rust tests from exact-SHA archive
        if: ${{ github.event.inputs.rust_filter != '' }}
        shell: bash
        env:
          RUST_FILTER: ${{ github.event.inputs.rust_filter }}
          RUST_PACKAGE: ${{ github.event.inputs.rust_package }}
        run: |
          set -euo pipefail
          archive_file=rust-archive/nx.tar.zst
          if [[ "$RUST_PACKAGE" == "gam-pyffi" ]]; then
            archive_file=rust-archive/nx-pyffi.tar.zst
          fi
          if [[ -n "$RUST_PACKAGE" && ! "$RUST_PACKAGE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::rust_package contains unsupported characters: ${RUST_PACKAGE}"
            exit 1
          fi

          # Treat the whitespace-separated input as independent literal
          # substrings. Restrict the alphabet before embedding each literal
          # into nextest's filter expression.
          read -r -a filters <<< "$RUST_FILTER"
          for filter in "${filters[@]}"; do
            if [[ ! "$filter" =~ ^[A-Za-z0-9_:.-]+$ ]]; then
              echo "::error::rust_filter '${filter}' is not a bare Rust test-name substring."
              exit 1
            fi
            expression="test(~${filter})"
            if [[ -n "$RUST_PACKAGE" ]]; then
              expression="package(=${RUST_PACKAGE}) and ${expression}"
            fi

            echo "Running archived tests selected by: ${expression}"
            cargo nextest run \
              --archive-file "$archive_file" \
              --workspace-remap . \
              --profile ci --config-file .config/nextest.toml \
              --test-threads 1 \
              --no-tests=fail \
              -E "$expression"
          done

      - name: Install Python test extras
        if: ${{ github.event.inputs.py_filter != '' || github.event.inputs.torch_filter != '' }}
        run: |
          python -m pip install \
            'pytest>=8' 'numpy>=1.26' 'pandas>=2.0' 'scipy>=1.11' \
            'pyarrow>=14' 'matplotlib>=3.8' 'scikit-learn>=1.4' requests

      - name: Run Python tests (filtered, fail-fast)
        if: ${{ github.event.inputs.py_filter != '' }}
        working-directory: ${{ runner.temp }}
        env:
          TEST_PATH: ${{ github.event.inputs.py_path || 'tests' }}
          TEST_FILTER: ${{ github.event.inputs.py_filter }}
          TEST_BUDGET: ${{ github.event.inputs.py_timeout_seconds || '600' }}
        run: |
          set -euo pipefail
          [[ "$TEST_PATH" == tests || "$TEST_PATH" == tests/* ]]
          [[ "$TEST_PATH" != *..* && "$TEST_BUDGET" =~ ^[1-9][0-9]*$ ]]
          timeout --signal=TERM --kill-after=5s "${TEST_BUDGET}s" \
            python -m pytest "$GITHUB_WORKSPACE/$TEST_PATH" -k "$TEST_FILTER" \
            -p no:cacheprovider -x -q --tb=short

      # ---- torch path (opt-in; only when a torch_filter was given) ----------
      - name: Install CPU torch wheel
        if: ${{ github.event.inputs.torch_filter != '' }}
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run torch tests (filtered, fail-fast)
        if: ${{ github.event.inputs.torch_filter != '' }}
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests/torch" -k "${{ github.event.inputs.torch_filter }}" -p no:cacheprovider -x -q --tb=short

      - name: Report source retirements for review
        if: ${{ github.event.inputs.source_base != '' }}
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.inputs.source_base }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import test_census as tests
          import public_api_census as api
          import source_removal_guard as source
          root = Path.cwd()
          base, head = os.environ['BASE_SHA'], os.environ['TARGET_SHA']
          before, after = tests.census(root, base, {}), tests.census(root, head, {})
          old, new, words = source.changed_inventory(root, base, head)
          result = {
              'base': base, 'head': head,
              'tests': tests.difference(before, after),
              'before_floor': tests.floor_from(before),
              'after_floor': tests.floor_from(after),
              'source': source.removals(old, new, words),
              'public_api': api.difference(api.census(root, base, {}), api.census(root, head, {})),
          }
          Path('source-change-report.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Upload read-only retirement report
        if: ${{ github.event.inputs.source_base != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: source-change-report
          path: source-change-report.json
          retention-days: 7

      - name: Guard against an empty request
        if: ${{ github.event.inputs.rust_filter == '' && github.event.inputs.py_filter == '' && github.event.inputs.torch_filter == '' && github.event.inputs.source_base == '' }}
        run: |
          echo "::error::None of rust_filter / py_filter / torch_filter was provided; nothing to validate."
          exit 1
