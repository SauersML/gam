name: Compile gate (native Linux + non-Linux cross)

# THE push gate on main: does this commit compile, everywhere, with the
# repository's own bans enforced? Two jobs, because "compiles" has two halves
# that no single `cargo check` covers.
#
# NATIVE LINUX (#2582). Before this job existed, the only push-triggered Rust
# gate compiled for `x86_64-pc-windows-gnu`, so every
# `cfg(target_os = "linux")` neighbourhood — including the crates that take
# `cudarc` only on Linux — was compiled by nothing on push. The dispatch-only
# `test.yml` archive build is the workspace's real native compile, and it runs
# on a schedule at best. Meanwhile `cargo check -p <member-crate>`, which is how
# a lane verifies its own work, never runs the ROOT crate's `build.rs` and so
# has zero coverage of the ban scanner: `cc4a72e0c` landed a banned `let _`
# that way and broke every root-crate target — the entire 455-test quality
# suite came back BUILDFAIL instead of reporting model quality, and a 3h15m run
# was lost. This job is the answer to "is THIS commit buildable on the platform
# everyone runs it on", and it is minutes, not hours.
#
# The ban scanner runs FIRST, and standalone. It is the root `build.rs`, which
# is std-only and reads the tree through `CARGO_MANIFEST_DIR`, so `scripts/
# ban_scanner.sh` compiles and runs THE SAME CODE cargo runs — not a
# re-implementation of its rules — in about four seconds. That matters for the
# third defect #2582 names: as a build-script side effect the report is
# attributed to "failed to run custom build command for `gam`" and buried
# several hundred `cargo:rerun-if-changed=` lines from the `file:line` it
# names. Run directly, the violation list IS the step output. It also gives
# every lane a four-second pre-land check that a per-crate `cargo check` cannot
# provide.
#
# NON-LINUX CROSS (#2377). Every wheel platform except Linux was silently
# broken for three releases because no CI job COMPILES a non-Linux target
# between releases — `-D warnings` breaks in `cfg(target_os = "linux")`
# neighbourhoods (unused imports/variables on the non-Linux side of the cfg)
# only surfaced inside the release wheel matrix, whose failure skipped the
# upload while the run looked green.
#
# windows-gnu is deliberate: it exercises the not-linux side of every
# `cfg(target_os = "linux")` split with a toolchain that cross-installs on the
# ubuntu runner in seconds. `cargo check` needs no linker for rlib targets, so
# mingw is only needed for build scripts — installed anyway for safety.
# gam-pyffi is included in the native deny-warnings check. Only the foreign
# target excludes it, because cross-checking PyO3 needs a target interpreter
# configuration. Native Python compilation must gate every push (#2821/#2824).

on:
  push:
    branches:
      - main
    # Results commits (bench/gha_results/**) are data, not code: they are
    # pushed by the publish-gha-results action and must not re-trigger the
    # compile gate, which is already starved for runners (#2582).
    paths-ignore:
      - 'bench/gha_results/**'
  workflow_dispatch:

concurrency:
  # A per-commit verdict must be keyed on the COMMIT, not the branch (#2443).
  # Keyed on the ref, every push to main cancelled the previous run's verdict:
  # 28 of the last 40 runs died that way, 10 failed, and NONE succeeded -- so the
  # only push gate on main was structurally incapable of reporting anything. It
  # even correctly failed the commit that broke every build in the workspace
  # (4ad2a6bda); nobody could act on that, because a gate whose completions are
  # almost all `cancelled` carries no information when it says `failure`.
  #
  # Ref-keying with cancellation is right for "give me the newest answer about
  # this branch". It is wrong for "is THIS commit good?", because the verdict's
  # subject is the commit and superseding it destroys the only record of it.
  group: cross-check-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux-native-check:
    name: Native Linux — ban scanner + workspace --all-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ban scanner (root build.rs, run standalone)
        run: |
          set +e
          scripts/ban_scanner.sh .
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=Ban scanner::This commit contains banned constructs; every offending file:line is printed above in this step. The same check aborts the root crate's build, which fails EVERY root-crate target including the whole quality suite."
          fi
          exit "$status"
      # Negative control: the step above proves the tree is clean, which is also
      # what a scanner that detects NOTHING reports. This plants a real violation
      # and requires the scanner to fail on it. Runs second so a genuine
      # violation is reported by the step above first.
      - name: Ban scanner negative control (planted violation must fail)
        run: |
          set +e
          scripts/ban_scanner_selftest.sh .
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=Ban scanner negative control::The ban scanner did not fail on a planted violation, or rejected the committed tree. A scanner that detects nothing passes every shape check in build.rs -- that is what this control exists to catch. Repair the rule; do not remove this step."
          fi
          exit "$status"
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Check workspace natively (deny warnings)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"
        run: |
          # `--locked` on the NATIVE arm, and this is the arm that catches
          # lockfile drift, not a style preference.
          #
          # A plain `cargo check` RESOLVES and silently rewrites Cargo.lock when a
          # manifest gains a dependency edge, so it passes. `--locked` refuses
          # instead. Until now `--locked` appeared ONLY in `publish.yml` and
          # `pypi-wheels.yml` -- the release paths -- so a drifted lockfile cleared
          # every gate on every push and first failed at PUBLISH time, on a
          # different day, to a different person, with no obvious link back to the
          # commit that caused it.
          #
          # Measured: `1fa453556` added `gam-test-support` to
          # `crates/gam-cli/Cargo.toml` without a lock entry. Its author ran
          # `cargo check -p gam-linalg -p gam-cli -p gam-test-support
          # --all-targets` and got a clean exit -- necessary but not sufficient,
          # exactly because a bare check repairs the lock on the way past. It took
          # a follow-up commit (`dad51929c`) to notice.
          #
          # Only the native arm carries it: the two arms share one checkout, so a
          # single `--locked` proves the lock is complete, and putting it on both
          # would fail the cross-compile arm for a reason that has nothing to do
          # with the target it exists to check.
          cargo check --locked --workspace --all-targets

  # Rustdoc had no CI job at all (#2711): nothing in `.github/` ran `cargo doc`
  # or `rustdoc`, so a surface that exits 101 was dark by omission while
  # `docs.yml` -- mkdocs, ~50s, nightly -- was green and said nothing about it.
  # It landed (#2711) as a RATCHET against a ledger of 15 known-red crates,
  # because zero was unreachable that day. #2753 measured the real tree -- 754
  # rustdoc errors across 15 crates, four times the 182 the issue quoted -- and
  # fixed every one, so the ledger is gone and the bar is ZERO for every crate.
  # A ratchet at N licenses the N+1'th; see scripts/rustdoc_gate.sh for the
  # coverage control that keeps a green from being a non-run now that there are
  # no known-failing crates left to act as the positive control.
  #
  # WHY ITS OWN JOB, AND NOT A STEP IN `linux-native-check`.
  # It was first added as a step there, on the reasoning that the workspace
  # check has already built every dependency's rmeta under sccache so the
  # marginal work is the rustdoc passes alone. That reasoning was right and the
  # conclusion drawn from it was not: the passes alone are ~6 minutes, on a job
  # whose baseline is ~5.2. Measured, step-level, on the two runs that carried
  # it (30691263775, 30691295632): everything BEFORE the rustdoc step still took
  # its baseline time -- 4m07s and 4m56s to reach it -- so queue contention is
  # not the explanation; the step itself was >=6m11s and >=4m26s when sampled,
  # against a standalone per-crate measurement of 5m54s. Three measurements, one
  # answer: ~6 minutes for 24 rustdoc passes.
  #
  # Doubling the latency of the compile verdict everyone waits on is too high a
  # price for a doc check, and the fix is not to drop the check. As its own job
  # it still GATES -- the workflow fails, under its own name, attributable to
  # whoever broke it -- while `linux-native-check` returns to answering "does
  # this commit compile" in ~5 minutes. It pays for its own dependency build,
  # which costs runner minutes but not verdict latency.
  rustdoc-gate:
    name: Rustdoc (cargo doc --no-deps, zero errors, every crate)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Rustdoc gate
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
        run: |
          set +e
          scripts/rustdoc_gate.sh
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error title=Rustdoc gate could not measure::The scan did not run to completion, so this run says nothing about the rustdoc surface. Treat it as a non-run, not as a pass."
          fi
          exit "$status"

  # `cargo test --doc` ran in NO CI job either (#2732) -- a second surface dark
  # by omission, and NOT covered by the rustdoc gate above. Different
  # command, different surface: `cargo doc --no-deps` GENERATES docs,
  # `cargo test --doc` COMPILES AND RUNS every doctest, and neither result
  # predicts the other. The rustdoc job's green must not be read as covering
  # this one, which is why they are two jobs with two names.
  #
  # It lands as a ZERO BAR rather than a ledger-ratchet because the debt it was
  # designed against is gone. The workspace census (run 30696464338, 24 crates,
  # 1h39m) measured 25 failing doctests across gam-solve (12), gam-terms (8),
  # gam-models (3) and gam-sae (2); every one was an indented ASCII-math block
  # in a `///` comment that rustdoc was compiling as Rust, and all 25 are fenced
  # as text now. A ledger with nothing in it is not a ratchet.
  #
  # WHY ITS OWN JOB. Same reasoning that split the rustdoc gate out
  # (`893cbc6aa`): `cargo test --doc` is the HEAVIER of the two, because it
  # codegens and links where a `--no-deps` doc pass does not. It gates under its
  # own name without adding latency to the compile verdict everyone waits on.
  #
  # The green here is a real verdict on a surface that today contains zero
  # doctests -- "no doc comment in this tree compiles as broken Rust" -- and
  # that is exactly why the script carries a per-crate coverage control. A scan
  # that built nothing would print the same `0 passed; 0 failed`.
  doctest-gate:
    name: Doctests (cargo test --doc, workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Doctest gate
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
        run: |
          set +e
          scripts/doctest_gate.sh
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error title=Doctest gate could not measure::The scan did not run to completion, so this run says nothing about the doctest surface. Treat it as a non-run, not as a pass."
          fi
          exit "$status"

  windows-gnu-check:
    name: Non-Linux cross (x86_64-pc-windows-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw + Windows target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cross-check workspace (deny warnings)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"
        run: |
          cargo check --workspace --exclude gam-pyffi --all-targets --target x86_64-pc-windows-gnu
