name: Rust CI

# REDESIGN (completeness + speed + total-failure visibility)
# ----------------------------------------------------------
# The previous version of this workflow had three structural defects:
#
#   1. INCOMPLETE. Its `cargo nextest run --lib --bins --examples` phase ran
#      WITHOUT `--workspace`/`-p`, so it only built/ran the root `gam` crate's
#      in-crate tests (it reported "1 test across 30 binaries"). The 23 member
#      crates under crates/* — ~4,587 `#[test]`s — were NEVER built or run, so
#      a crate whose `#[cfg(test)]` module failed to COMPILE (e.g. gam-terms,
#      607 errors) was completely invisible to CI. Its integration loop
#      `for test_file in tests/*.rs` also matched ONLY the flat `tests/*.rs`
#      files and silently skipped the ~26 DIRECTORY integration targets
#      (tests/quality/main.rs, tests/basis_smooth/main.rs, tests/manifolds/...
#      — ~2,154 more `#[test]`s). Net: ~197 tests actually executed out of a
#      real surface in the THOUSANDS.
#
#   2. SLOW. One job, one 4-vCPU runner, fully serial (`--build-jobs 1
#      --test-threads 1`), with a per-binary relink loop and a ~350-min budget.
#
#   3. FAILURES HIDDEN. A bulk SIGKILL at a wall-clock cap could drop the
#      per-test summary, so failures were scattered across a giant log.
#
# This redesign fixes all three with the nextest BUILD-ONCE / RUN-MANY model:
#
#   * `build`     — ONE job runs `cargo nextest archive --workspace
#                   --all-features` (root crate + every member crate's lib/bins/
#                   examples + ALL flat AND directory integration targets, all
#                   auto-discovered). This is the COMPLETENESS fix and it also
#                   surfaces every COMPILE failure across the workspace
#                   (CARGO_BUILD_KEEP_GOING=true => one pass reports them all).
#   * `rust-test` — a `strategy.matrix` of N run-shards on parallel runners, each
#                   `cargo nextest run --archive-file ... --partition
#                   count:i/N`. Run-shards DO NOT rebuild/relink (the archive
#                   holds pre-linked binaries), so the OOM/Bus-error guard, the
#                   disk-prune, and the serial relink loop are all gone from the
#                   run side. Parallelism is the speedup; bump `shards` to dial.
#   * `aggregate` — downloads every shard's output + the build log and writes a
#                   single MASTER_FAILURES.md artifact listing EVERY compile
#                   failure and EVERY runtime test failure (status + crate/binary
#                   + test name + captured error), plus the forbidden-runtime-
#                   pattern grep and the #1393 slow/timeout attribution.
#
# Preserved from the old workflow: the nextest `ci` profile + per-test
# slow-timeouts (.config/nextest.toml, untouched), the python-tests maturin/wheel
# flow, the gam-pyffi special handling (its unit tests run with
# --no-default-features; the `python_rust_ffi_parity_*` test runs only in
# python-tests against the installed wheel), the forbidden-runtime-pattern grep,
# and the build.rs human-author gate (fetch-depth: 0 on every building job).

on:
  # #2666: until this line existed, this workflow had NO automatic trigger, so
  # the ENTIRE Rust test surface — ~12,563 tests, every crate's unit tests, all
  # 217 integration targets — ran only when a human remembered to dispatch it.
  # The only automatic Rust signal on main was `cross-check.yml`, which is
  # `cargo check --all-targets`: it compiles test targets and executes none of
  # them. A regression could therefore land, be built successfully, and be
  # invisible until somebody thought to ask.
  #
  # The evidence that this is not hypothetical is in-tree. Every other lane
  # publishes into `bench/gha_results/`, and on 2026-07-31 the scheduled ones
  # (`python-contracts`, `reference-quality`, `benchmark`, `fuzz`) had all
  # refreshed that day while `rust-test-suite/MASTER_FAILURES.md` still carried
  # the 07-30 dispatch. `python-contracts.yml`'s own header states the general
  # form after it hit the same thing: "A surface nobody schedules is a surface
  # that goes dark without anything turning red." Somebody fixed that for the
  # Python half by adding a schedule and nobody did it for Rust.
  #
  # SCHEDULE, NOT PUSH, and deliberately so. This is a ten-shard suite behind a
  # multi-hour archive build, and `cross-check.yml` records that the compile
  # gate is "already starved for runners (#2582)" against a main that takes
  # several commits an hour. Per-push would queue runs faster than they finish
  # and starve the push gate that everyone actually reads.
  #
  # Twice daily, matching `python-contracts.yml`'s 12-hourly precedent for a
  # full-suite lane rather than inventing a new policy: `build` is capped at 330
  # minutes and `rust-test` at 360, so a 12-hour period cannot overlap itself
  # even in the worst case, while 6-hourly could. 01:00/13:00 UTC are chosen to
  # miss every other builder — `rust-archive` 02:00, `fuzz` 03:00, `benchmark`
  # 04:00, `docs` 05:00, `wheel-nightly` every 4h from 00:00, `python-contracts`
  # and `reference-quality` at 00:00/12:00 — so the two heaviest cargo lanes
  # never contend for the same cache or the same runners.
  #
  # Nothing else needs to change for a scheduled run: `github.event.inputs.shards`
  # evaluates to the empty string on a `schedule` event, and the `setup` job's
  # planner already falls back to 10 when it is not a positive integer.
  schedule:
    - cron: "0 1,13 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of parallel test run-shards (matrix size)."
        default: "10"
        required: false

concurrency:
  group: rust-ci-${{ github.ref }}
  # NEVER cancel a run on `main`.
  #
  # The `aggregate` job is `if: always()` and ends by publishing this run's
  # numbers to `bench/gha_results/rust-test-suite` -- deliberately, so that a
  # failed or timed-out run still records what it measured, because those are
  # usually the interesting numbers. But a CANCELLED workflow does not finish
  # its `always()` jobs either, so cancellation skips the publish entirely.
  #
  # On a fast-moving `main` every push cancelled the run before it, and the
  # ledger silently froze: `rust-test-suite` sat at 2026-07-26 for three days
  # while every other lane stayed current, and multiple investigations were
  # run against that stale snapshot before anyone noticed. The sibling lanes
  # that stayed fresh (`reference-quality`) are exactly the ones that do not
  # cancel.
  #
  # Branches and PRs keep cancelling -- there the newest push is the only one
  # anybody wants, and no ledger is written for them.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # See the long note in the old workflow (#1072): incremental corrupted the
  # fingerprint and forced full rebuilds. The archive build links every test
  # binary exactly once, so incremental buys nothing here and only adds a
  # corruption surface — keep it off.
  CARGO_INCREMENTAL: "0"
  # Content-addressed compiler cache shared across CI runs (GitHub Actions
  # backend). Enabled per-job only after a backend reachability probe inside
  # setup-rust-ci, so a cache outage degrades to a cold-but-green build instead
  # of a hard failure.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Plan the run-shard matrix. `shards` (workflow_dispatch input, default 10)
  # becomes a JSON array [1..N] consumed by the rust-test matrix, and `total`
  # feeds the `count:i/N` partition denominator.
  # ---------------------------------------------------------------------------
  setup:
    name: Plan run shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -uo pipefail
          N="${{ github.event.inputs.shards }}"
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ]; then N=10; fi
          echo "total=$N" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 1 "$N" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "Planned ${N} parallel run shards."

  # ---------------------------------------------------------------------------
  # BUILD ONCE. Archive the ENTIRE workspace's test binaries with --all-features.
  # This is the completeness fix and the single compile gate; it surfaces every
  # compile failure across the workspace in one pass (keep-going). The archive is
  # uploaded as an artifact for the run-shards to download and execute.
  # ---------------------------------------------------------------------------
  build:
    name: Build & archive workspace tests
    runs-on: ubuntu-latest
    # The archive build is the long pole (it compiles + links every test binary
    # once). Keep a generous backstop under GitHub's 6-hour ceiling.
    timeout-minutes: 330
    outputs:
      archived: ${{ steps.archive.outputs.archived }}
    env:
      # Pin lld to one worker and link test binaries serially: each `gam` test
      # binary pulls the full dep closure (faer, burn, bevy_reflect, ndarray,
      # nalgebra, arrow, parquet, ad_trait, num-dual, statrs, …) and two large
      # links at once overflowed the 16-GB runner ("collect2: ld terminated with
      # signal 7 [Bus error]"). The run-shards no longer link, so this guard is
      # only needed here.
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
      # Build EVERY test target in one pass and report ALL compile errors,
      # instead of aborting at the first crate that fails to compile. This is
      # what makes the 607-class member-crate test-compile failures show up
      # together rather than one-at-a-time.
      CARGO_BUILD_KEEP_GOING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.rs human-author gate needs the real last build.rs editor; a depth-1 clone makes git log return HEAD, false-failing every Claude-authored HEAD (#1458)

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          free-disk-space: 'true'
          cache-targets: 'false'

      # The archive step died at 48 MB free in run 30161941229: the full
      # optimized+debuginfo target dir and the compressed archive coexist at
      # peak, and setup-rust-ci's standard reclaim no longer clears enough
      # headroom for 226 test binaries. Purge the large runner payloads the
      # standard reclaim leaves behind (~8-12 GB) before the build starts.
      - name: Purge unused runner payloads (archive headroom)
        shell: bash
        run: |
          set -uo pipefail
          df -h /
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/swift /usr/local/julia* /usr/lib/jvm             /usr/local/share/powershell /usr/share/miniconda || true
          df -h /

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # #871: gam-pyffi imports many `pub` items from `gam`; the root crate's own
      # dead-code lint cannot see that cross-crate use, so a `pub`-item removal
      # that breaks the wheel must fast-fail here in normal CI rather than ~12 min
      # into the release wheel build. `cargo check` does not link, so enabling
      # `extension-module` via --all-features is fine for a check.
      - name: Check gam-pyffi cross-crate reachability (#871)
        shell: bash
        run: cargo check -p gam-pyffi --all-targets --all-features

      # THE COMPLETENESS FIX. `--workspace --all-features` builds the root crate
      # AND every member crate's lib/bins/examples AND every integration target —
      # both the flat tests/*.rs and the directory tests/<dir>/main.rs targets,
      # all auto-discovered by cargo. `--exclude gam-pyffi`: with --all-features,
      # gam-pyffi's default-on `extension-module` feature is enabled, which tells
      # PyO3 NOT to link libpython, so a standalone test binary fails to LINK.
      # gam-pyffi is archived separately below with --no-default-features.
      #
      # `--config profile.test.debug=0` drops DWARF (the largest non-executable
      # payload) to keep the archive small and the links practical on a standard
      # runner.
      #
      # IT MUST NAME THE `test` PROFILE, NOT `dev`. `cargo nextest archive`
      # builds the `test` profile, and Cargo.toml pins `[profile.test] debug =
      # "line-tables-only"`, which overrides the file-level default this flag
      # used to target. Spelled `profile.dev.debug=0` the flag was INERT: the
      # build reported `Finished `test` profile [optimized + debuginfo]` and
      # all 231 archived binaries still carried their debuginfo. That is what
      # exhausted the runner's 145 GB volume mid-archive with `No space left
      # on device`, and it is why the 2026-07-29 nightly ledger recorded the
      # ENTIRE Rust runtime surface as NOT MEASURED. Established as a paired
      # A/B on one box, not inferred: `profile.dev.debug=0` ->
      # `[optimized + debuginfo]`, `profile.test.debug=0` -> `[optimized]`.
      #
      # The step still exits 0 so the archive (if any), the build log, and the
      # gam-pyffi archive below all upload and the downstream jobs proceed.
      # A COMPILE failure is a result about the code, and the aggregate job
      # reports it. An ARCHIVER failure -- every crate built, but the archive
      # could not be written -- is not a result at all: it measures nothing,
      # and calling it "compile errors" sends the next reader hunting a broken
      # crate that does not exist. It is recorded here and fails the job at the
      # end (see "Gate: the archive step measured something"), which is after
      # every upload, so nothing that COULD be measured is lost.
      - name: Build nextest archive (whole workspace, all features)
        id: archive
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo nextest archive \
            --workspace --all-features --exclude gam-pyffi \
            --config 'profile.test.debug=0' \
            --archive-file nx.tar.zst 2>&1 | tee archive-build.log || status="${PIPESTATUS[0]}"
          echo "nextest archive exit status: ${status}"
          if [ -f nx.tar.zst ]; then
            echo "archived=true" >> "$GITHUB_OUTPUT"
            echo "Archive built: $(du -h nx.tar.zst | cut -f1)"
          else
            echo "archived=false" >> "$GITHUB_OUTPUT"
            # Name WHICH failure this was. `Finished ... profile` is cargo's
            # own statement that every crate compiled, so if it is present and
            # the archive is still missing, the compiler is not what failed.
            df -h . || true
            if grep -qE '^ *Finished .*(test|dev) profile' archive-build.log; then
              echo "archiver_failed=true" >> "$GITHUB_OUTPUT"
              echo "::error::The workspace COMPILED but the archive could not be written, so this run measured NOTHING of the Rust runtime surface. This is an archiver/disk failure, not a compile failure. Archiver error and free space follow."
              grep -B2 -A6 -iE '^error' archive-build.log | tail -30 || true
            else
              echo "::error::Workspace test build FAILED to produce an archive (compile errors). See the MASTER_FAILURES.md artifact / aggregate job for every compile failure."
            fi
          fi

      # gam-pyffi unit tests need extension-module OFF so the harness links
      # libpython (host interpreter only present at import time for the real
      # extension). Archive it on its own so its tests still run; covers the
      # survival-surface (#964/#965/#966) and latent-stationarity (#954) tests.
      - name: Build nextest archive (gam-pyffi, no default features)
        shell: bash
        run: |
          set -uo pipefail
          cargo nextest archive \
            -p gam-pyffi --no-default-features \
            --config 'profile.test.debug=0' \
            --archive-file nx-pyffi.tar.zst 2>&1 | tee -a archive-build.log || true
          if [ -f nx-pyffi.tar.zst ]; then echo "gam-pyffi archive built."; fi
          exit 0

      # The prebuilt archive is the critical artifact of this build-once/run-many
      # design: the run-shards have nothing to execute without it. Upload it
      # whenever it was produced, regardless of any earlier evidence/metadata
      # step's outcome (`always()`), so a non-gating step can never strand the
      # whole test matrix with no binaries to download.
      - name: Upload workspace test archive
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.archive.outputs.archived == 'true' }}
        with:
          name: nx-archive
          path: nx.tar.zst
          retention-days: 3
          if-no-files-found: warn

      - name: Upload gam-pyffi test archive
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nx-pyffi-archive
          path: nx-pyffi.tar.zst
          retention-days: 3
          if-no-files-found: warn

      - name: Upload build logs (compile-failure surface)
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: build-logs
          path: |
            archive-build.log
          retention-days: 7
          if-no-files-found: warn

      # A job that compiled everything, wrote no archive, and reported `success`
      # is the worst of the three outcomes: `rust-test` then runs ten shards
      # against a missing archive, every one reports ARCHIVE_MISSING, and the
      # ledger's runtime counters read 0 -- indistinguishable at a glance from
      # a clean run. That is exactly what happened on 2026-07-29 (run
      # 30427042552: build `success`, archive step `No space left on device`,
      # all ten shard logs empty). This gate runs LAST and with `always()`, so
      # every artifact above is already uploaded and the gam-pyffi surface --
      # which does not depend on nx.tar.zst -- still runs and still reports.
      - name: Gate — the archive step measured something
        if: ${{ always() && steps.archive.outputs.archiver_failed == 'true' }}
        shell: bash
        run: |
          echo "::error::Failing this job on purpose: the workspace compiled but produced no test archive, so no shard could measure anything. A green build job here would report 'no test failures' for a surface that was never run."
          exit 1

  # ---------------------------------------------------------------------------
  # RUN MANY. N parallel shards, each running 1/N of the test surface from the
  # prebuilt archive. No rebuild, no link, no OOM/disk machinery. --no-fail-fast
  # + fail-fast:false means every failure in the run is collected.
  # ---------------------------------------------------------------------------
  rust-test:
    name: Test shard ${{ matrix.shard }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - name: Checkout
        # Needed for .config/nextest.toml (per-test slow-timeouts) and
        # --workspace-remap. No build happens here, so depth 1 is fine (the
        # build.rs human-author gate ran in the build job).
        uses: actions/checkout@v5

      - name: Install Rust 1.97.1
        # Run-shards execute prebuilt binaries; they only need `cargo` on PATH to
        # drive nextest. No sccache / target cache needed on the run side.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The whole-workspace test surface now includes the reference-quality
      # tests under tests/quality/** (the completeness fix, #1624). Those tests
      # shell out to Rscript / python3 and the reference harness
      # (crates/gam-test-support/src/reference.rs) treats a missing interpreter
      # or package as a HARD failure — never a silent skip — so without this
      # stack every quality_vs_* / manifold / survival reference test in the
      # shard panics with "spawn Rscript ... NotFound" or "No module named
      # 'numpy'" (hundreds of spurious FAILs, not real gam bugs). Provision the
      # same mature-tool stack the reference-quality dashboard uses (shared
      # composite action, so the two cannot drift).
      - name: Free disk space for the reference stack
        shell: bash
        run: |
          set -uo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Install reference tool stack (R + Python mature comparators)
        uses: ./.github/actions/install-reference-tools

      - name: Download workspace test archive
        uses: actions/download-artifact@v4
        continue-on-error: true # archive may be absent if the workspace failed to compile
        with:
          name: nx-archive

      - name: Run shard ${{ matrix.shard }}/${{ needs.setup.outputs.total }}
        shell: bash
        run: |
          set -uo pipefail
          log="shard-${{ matrix.shard }}.log"
          if [ ! -f nx.tar.zst ]; then
            echo "::warning::No nextest archive (workspace test build failed to compile upstream). Compile failures are surfaced in MASTER_FAILURES.md; nothing to run in this shard."
            echo "ARCHIVE_MISSING shard ${{ matrix.shard }}/${{ needs.setup.outputs.total }}" | tee "$log"
            exit 0
          fi
          status=0
          # `-E 'not ...'` filters two families the Rust-only shard cannot run:
          #
          #  * `test(python_rust_ffi_parity_gaussian)` — the root-crate `pyffi`
          #    integration binary holds the parity CASES that shell out to
          #    `python3 -c "import gamfit"` and need the maturin-built extension,
          #    which this Rust-only shard does not install. They run in the
          #    python-tests job instead (#1251). The filter matches the family
          #    rather than one case name: the exact-fit companion case added for
          #    #2595 would otherwise have run HERE, where gamfit is absent, and
          #    not there, where it is.
          #
          #  * `binary(=quality)` — the grouped `tests/quality.rs` integration
          #    target (the `quality_vs_*` reference-comparison suite). Every test
          #    in it benchmarks gam against a MATURE reference tool (mgcv, gamlss,
          #    statsmodels, lifelines, …) via the reference harness
          #    (crates/gam-test-support/src/reference.rs), which shells out to
          #    Rscript / python3 and — by explicit design — treats a MISSING
          #    interpreter as a HARD failure, never a silent skip. These shard
          #    runners install neither R nor the Python reference stack, so the
          #    entire target could only ever hard-fail with `spawn Rscript
          #    NotFound` (~200+ guaranteed failures per run) that drown the real
          #    Rust-side signal this workflow exists to surface. That target is the
          #    sole, dedicated province of the `Reference Quality Suite` workflow
          #    (.github/workflows/reference-quality.yml), which provisions the full
          #    R+Python stack, RUNS every quality test, and classifies a lost
          #    reference as REF_ERROR — reported but NOT gated, because a missing
          #    reference environment is not a gam defect. Excluding the target from
          #    the fast Rust CI RUN keeps that same classification consistent here.
          #    It is still BUILT in the archive job above, so its compile surface
          #    is fully gated; only its execution moves to the suite that can
          #    satisfy it.
          #
          # `--partition count:i/N` is a pure run-time FILTER over the prebuilt
          # binaries; `--profile ci --config-file` applies the per-test
          # slow-timeouts; `--no-fail-fast` collects every failure in this shard.
          cargo nextest run \
            --archive-file nx.tar.zst \
            --workspace-remap . \
            --profile ci --config-file .config/nextest.toml \
            --partition "count:${{ matrix.shard }}/${{ needs.setup.outputs.total }}" \
            --no-fail-fast \
            --test-threads 1 \
            -E 'not test(python_rust_ffi_parity_gaussian) and not binary(=quality)' \
            2>&1 | tee "$log" || status="${PIPESTATUS[0]}"
          echo "nextest exit status: ${status}"
          # Surface this shard's own pass/fail in the matrix UI; the aggregate
          # job (if: always()) is the single place that lists EVERY failure.
          exit "$status"

      - name: Upload shard log
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: shard-logs-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # gam-pyffi unit tests (separate feature config). Runs regardless of the
  # rust-test shards' outcome so its failures always surface.
  # ---------------------------------------------------------------------------
  pyffi-test:
    name: gam-pyffi unit tests
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Download gam-pyffi test archive
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nx-pyffi-archive

      # The gam-pyffi unit tests are archived with `--no-default-features`, so
      # PyO3's `extension-module` is OFF and the harness LINKS libpython. With
      # the crate's default-off-here `auto-initialize` feature, `Python::attach`
      # initializes that SAME system `python3` the `build` job linked the archive
      # against (nothing sets PYO3_PYTHON, so both jobs resolve `/usr/bin/python3`
      # on the identical ubuntu-latest image). Two tests drive the NumPy C-API
      # via `numpy::IntoPyArray::into_pyarray`
      # (audit_sae_round_trip_surfaces_external_dictionary_diagnostics,
      # topology_persistence_ffi), which fetches the NumPy array-API capsule by
      # IMPORTING numpy at runtime. The runner's system interpreter ships no
      # numpy, so without this those tests fail with "Failed to access NumPy
      # array API capsule: ModuleNotFoundError: No module named 'numpy'". This is
      # a genuine missing test dependency (the same reason the rust-test shards
      # provision the reference tool stack), NOT an interpreter-init defect — a
      # raw `Py_InitializeEx`/`prepare_freethreaded_python` would initialize the
      # very same numpy-less interpreter. Install numpy into that system
      # interpreter (its dist-packages sit on the linked interpreter's sys.path)
      # so the capsule import succeeds.
      - name: Provide NumPy to the linked system interpreter
        shell: bash
        run: |
          set -uo pipefail
          if python3 -m pip install --break-system-packages --upgrade "numpy<2"; then
            :
          else
            sudo apt-get update && sudo apt-get install -y python3-numpy
          fi
          # Hard-fail here (not deep inside a test) if numpy is still not
          # importable by the interpreter the archive is linked against.
          python3 -c "import numpy; print('numpy', numpy.__version__, numpy.get_include())"

      - name: Run gam-pyffi unit tests
        shell: bash
        run: |
          set -uo pipefail
          log="shard-logs-pyffi.log"
          if [ ! -f nx-pyffi.tar.zst ]; then
            echo "::warning::No gam-pyffi archive (failed to compile upstream); see MASTER_FAILURES.md."
            echo "ARCHIVE_MISSING gam-pyffi" | tee "$log"
            exit 0
          fi
          status=0
          cargo nextest run \
            --archive-file nx-pyffi.tar.zst \
            --workspace-remap . \
            --profile ci --config-file .config/nextest.toml \
            --no-fail-fast \
            --test-threads 1 \
            2>&1 | tee "$log" || status="${PIPESTATUS[0]}"
          echo "nextest exit status: ${status}"
          exit "$status"

      - name: Upload gam-pyffi log
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: shard-logs-pyffi
          path: shard-logs-pyffi.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # AGGREGATE. The single place that lists EVERYTHING: every compile failure
  # (from the build log) and every runtime test failure (from every shard log),
  # plus the forbidden-runtime-pattern grep and the #1393 slow/timeout
  # attribution. Writes MASTER_FAILURES.md and fails the workflow if anything is
  # red — so the owner gets one artifact with every failure.
  # ---------------------------------------------------------------------------
  aggregate:
    permissions:
      contents: write
      actions: read
    name: Aggregate failures (MASTER_FAILURES.md)
    needs: [setup, build, rust-test, pyffi-test, python-tests, python-populations]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # The publisher below is a repository-local composite action. Aggregate
      # previously downloaded only result artifacts, so the workspace contained
      # MASTER_FAILURES.md but not `.github/actions/publish-gha-results/action.yml`;
      # every completed suite then failed at the publish step and left the
      # in-tree ledger stale. Check out the exact workflow SHA before using any
      # local action.
      - name: Checkout publisher
        uses: actions/checkout@v5

      - name: Download build logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-logs
          path: agg/build

      - name: Download all shard logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-logs-*
          path: agg/shards
          merge-multiple: true

      # Kept OUT of `agg/shards` on purpose: `shard_logs` being non-empty is the
      # aggregate's evidence that the Rust shard matrix ran, and a Python log
      # mixed into that set would mask a skipped matrix.
      - name: Download Python test logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: python-logs
          path: agg/python

      # Same directory as the step above, so the `agg/python/**/*.log` glob that
      # builds the Python failure list picks both up with no change to the
      # parser. A separate step rather than a `pattern:` on the one above: this
      # cannot alter what the existing download resolves, and the two jobs write
      # distinctly named logs (pytest.log vs populations.log) so nothing is
      # overwritten on merge. `continue-on-error` because a job that died before
      # uploading must not take the whole aggregate down (#2666).
      - name: Download Python population logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: python-logs-populations
          path: agg/python

      - name: Build MASTER_FAILURES.md
        id: master
        shell: bash
        env:
          # Authoritative upstream results. `ARCHIVE_MISSING` is a marker a
          # SHARD writes, so it cannot exist when the shards were skipped —
          # which is exactly what happens when the archive build fails
          # (build FAILED -> shards SKIPPED -> this job succeeded, reporting
          # 0 compile / 0 runtime; five of the fourteen runs 12-24 Jul 2026
          # looked like clean runs that way). Read the job results directly so
          # the not-measured signal does not depend on a log line that a
          # skipped job could never emit.
          BUILD_RESULT: ${{ needs.build.result }}
          RUST_TEST_RESULT: ${{ needs.rust-test.result }}
          # How many shards were PLANNED. A complete red inventory has one log
          # per planned shard; a cancelled or mid-flight matrix has fewer, and
          # that count is what separates the two -- not the matrix conclusion.
          EXPECTED_SHARDS: ${{ needs.setup.outputs.total }}
          # The gam-pyffi unit job writes its own ARCHIVE_MISSING marker, but a
          # job that never ran cannot write one — same hole, same fix.
          PYFFI_TEST_RESULT: ${{ needs.pyffi-test.result }}
          # The Python surface has no archive to be missing; its not-measured
          # signal is "the job went red but produced no failure identity", which
          # is what a failed wheel build or a step that died before pytest wrote
          # a report looks like from here.
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          # #2666: the slow + torch populations are a fourth, disjoint surface.
          PYTHON_POPULATIONS_RESULT: ${{ needs.python-populations.result }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import os, re, glob, sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from nextest_summary import (
              CoverageError,
              MIN_WORKSPACE_TESTS,
              measure_workspace_test_population,
          )

          ANSI = re.compile(r'\x1b\[[0-9;]*m')
          def strip(s): return ANSI.sub('', s)

          # ---- compile failures (from the archive build log) -----------------
          compile_errs = []
          build_logs = set(glob.glob('agg/build/**/archive-build.log', recursive=True))
          build_logs.update(glob.glob('agg/build/archive-build.log'))
          for path in sorted(build_logs):
              try:
                  lines = [strip(l.rstrip('\n')) for l in open(path, errors='replace')]
              except OSError:
                  continue
              for i, l in enumerate(lines):
                  m = re.match(r'^error(\[[A-Z0-9]+\])?: (.*)$', l)
                  if not m:
                      continue
                  code = (m.group(1) or '').strip('[]')
                  msg = m.group(2).strip()
                  loc = ''
                  for j in range(i + 1, min(i + 8, len(lines))):
                      lm = re.match(r'^\s*-->\s+(.*)$', lines[j])
                      if lm:
                          loc = lm.group(1).strip(); break
                  compile_errs.append((loc, code, msg))
          seen = set()
          compile_errs = [e for e in compile_errs if not (e in seen or seen.add(e))]

          # ---- runtime failures (from every shard log) -----------------------
          # nextest prints, e.g. `FAIL [ 0.0s] (1/1) gam::quality the_test`; the
          # `(n/m)` try-counter is optional (absent when retries are off), so
          # consume it non-capturing if present before the package::binary id.
          # nextest RIGHT-PADS that counter to a fixed width once the run has
          # more than nine tests ('(  1/119)'), so the inner \s* is
          # load-bearing: without it the counter group falls through and '(' is
          # captured as the binary id with the counter tail glued onto the test
          # name - which is what every counted row in this ledger looked like.
          FAILRE = re.compile(r'^\s*(FAIL|TIMEOUT|TERMINATING|LEAK|SIGSEGV|ABORT)\s*\[[^\]]*\]\s+(?:\(\s*\d+/\d+\)\s+)?(\S+)\s+(.+?)\s*$')
          SLOWRE = re.compile(r'^\s*(SLOW|TIMEOUT|TERMINATING)\s*\[[^\]]*\]\s+(?:\(\s*\d+/\d+\)\s+)?(\S+)\s+(.+?)\s*$')
          run_fails = []; slow = []
          shard_logs = sorted(set(glob.glob('agg/shards/**/*.log', recursive=True) +
                                  glob.glob('agg/shards/*.log')))
          # Numbered workspace shards write shard-<n>.log; the pyffi job's
          # shard-logs-pyffi.log shares the shard-logs-* artifact namespace
          # (inherited layout) but is NOT evidence the workspace matrix ran:
          # in run 30161941229 a late cancellation killed every numbered shard
          # before upload and the pyffi log alone made the workspace surface
          # read as MEASURED. Failure PARSING still spans all logs; only the
          # ran-at-all evidence is scoped to the numbered shards.
          workspace_shard_logs = [p for p in shard_logs
                                  if re.search(r'(^|/)shard-\d+\.log$', p)]
          all_text = []
          for path in shard_logs:
              try:
                  txt = open(path, errors='replace').read()
              except OSError:
                  continue
              all_text.append(txt)
              for raw in txt.splitlines():
                  l = strip(raw)
                  m = FAILRE.match(l)
                  if m and m.group(1) != 'SLOW':
                      run_fails.append((m.group(1), m.group(2), m.group(3)))
                  sm = SLOWRE.match(l)
                  if sm:
                      slow.append((sm.group(1), sm.group(2), sm.group(3)))
          def dedup(xs):
              s = set(); return [x for x in xs if not (x in s or s.add(x))]
          run_fails = dedup(run_fails); slow = dedup(slow)

          # ---- Python API failures (from the python-tests job) ---------------
          # Same row grammar as a nextest shard, so one regex serves both. Held
          # in its own list because the two surfaces are measured independently:
          # the Rust archive can be missing while Python ran fine, and vice
          # versa, so one shared NOT MEASURED qualifier would lie about one of
          # them.
          python_fails = []
          python_logs = sorted(set(glob.glob('agg/python/**/*.log', recursive=True) +
                                   glob.glob('agg/python/*.log')))
          python_text = []
          for path in python_logs:
              try:
                  txt = open(path, errors='replace').read()
              except OSError:
                  continue
              python_text.append(txt)
              for raw in txt.splitlines():
                  m = FAILRE.match(strip(raw))
                  if m and m.group(1) != 'SLOW':
                      python_fails.append((m.group(1), m.group(2), m.group(3)))
          python_fails = dedup(python_fails)

          # ---- forbidden runtime-error signatures (preserved grep) -----------
          forbidden = [
              'P-IRLS INNER LOOP FAILED',
              'P-IRLS could not certify a valid minimum',
              'P-IRLS separation/non-convergence at current rho',
              'Perfect or quasi-perfect separation detected',
              'seed candidates failed',
              'no candidate seeds passed outer startup validation',
          ]
          # The forbidden-signature grep covers BOTH surfaces — these are engine
          # errors and the Python suite drives the same engine. The
          # ARCHIVE_MISSING marker check stays scoped to shard text, since that
          # marker is a shard-authored token.
          joined = '\n'.join(all_text)
          forbidden_hits = [p for p in forbidden if p in '\n'.join(all_text + python_text)]
          shard_marker_missing = 'ARCHIVE_MISSING' in joined
          # A skipped or failed archive build means the runtime surface was not
          # exercised, whether or not any shard lived long enough to say so.
          build_result = os.environ.get('BUILD_RESULT', '')
          rust_test_result = os.environ.get('RUST_TEST_RESULT', '')
          pyffi_test_result = os.environ.get('PYFFI_TEST_RESULT', '')
          python_tests_result = os.environ.get('PYTHON_TESTS_RESULT', '')
          python_populations_result = os.environ.get('PYTHON_POPULATIONS_RESULT', '')

          # ---- the ONLY input to MEASURED / NOT MEASURED ---------------------
          # A job's terminal conclusion decides whether its surface was measured
          # — nothing else, and identically for every surface. `success` and
          # `failure` are VERDICTS: the job ran to completion and reported what
          # it found (a red suite is a measurement, see #2437). `cancelled`,
          # `timed_out`, `skipped` and an empty result are ABSENCES: the job
          # stopped on someone else's clock, so whatever it managed to emit is a
          # lower bound on what it would have emitted, never a count.
          #
          # #2743: this predicate used to be spelled out per surface. The
          # populations row named `cancelled` explicitly and the API row did not,
          # so run 30683558735 — where BOTH Python jobs concluded `cancelled` —
          # published `Python API tests: MEASURED (job cancelled)` beside
          # `Python populations: NOT MEASURED (job cancelled)`, and the `6` read
          # off the cancelled job went out as a total. One predicate, one call
          # site per surface, so two identical conclusions cannot diverge again.
          MEASURED_CONCLUSIONS = ('success', 'failure')
          def conclusion_is_measured(result):
              return result in MEASURED_CONCLUSIONS

          build_did_not_succeed = build_result not in ('', 'success')
          # 'skipped' is absence, but so is any other non-success: a cancelled or
          # failed matrix may have died mid-flight with partial logs, and a
          # partial inventory read as complete is exactly the false green this
          # ledger exists to kill.
          # A matrix conclusion of `failure` means TESTS failed. That is the
          # normal, expected state of a red ledger -- it is not evidence that
          # the shards did not run, and treating it as such made the MEASURED
          # verdict unreachable for any run containing a single failing test,
          # i.e. always (#2437). Run 30209439994 is the exhibit: build
          # `success`, all ten shard logs uploaded, a 10.3 GB nx-archive, 490
          # real failures parsed out of them -- and `workspace shards: NOT
          # MEASURED`, because nine shards concluded `failure`.
          #
          # What actually distinguishes a partial inventory from a complete red
          # one is whether every PLANNED shard uploaded its log. A cancelled or
          # mid-flight matrix leaves fewer than `total` (run 30195751223: seven
          # of ten killed), and that shortfall is the false green this ledger
          # exists to kill. `cancelled` stays a hard signal in its own right,
          # because a matrix cancelled after all uploads is still not a run
          # anyone should read as a verdict.
          expected_shards = int(os.environ.get('EXPECTED_SHARDS') or 0)
          try:
              workspace_population = measure_workspace_test_population(
                  workspace_shard_logs,
                  expected_shards=expected_shards,
              )
              workspace_population_error = ''
          except CoverageError as exc:
              workspace_population = None
              workspace_population_error = str(exc)
          shards_incomplete = (
              expected_shards > 0 and len(workspace_shard_logs) < expected_shards
          )
          shards_never_ran = (not conclusion_is_measured(rust_test_result)
                              or not workspace_shard_logs
                              or shards_incomplete
                              or bool(workspace_population_error))
          pyffi_never_ran = not conclusion_is_measured(pyffi_test_result)
          archive_missing = (
              shard_marker_missing or build_did_not_succeed
              or shards_never_ran or pyffi_never_ran
          )
          not_measured_reasons = [
              label
              for label, fired in (
                  (f'the archive build reported `{build_result}`', build_did_not_succeed),
                  (f'the shard matrix reported `{rust_test_result or "?"}`',
                   not conclusion_is_measured(rust_test_result)),
                  (f'only {len(workspace_shard_logs)} of {expected_shards} planned shard logs were collected', shards_incomplete),
                  ('no workspace shard log was collected at all', not workspace_shard_logs),
                  (f'the workspace test population was not certified: {workspace_population_error}',
                   bool(workspace_population_error)),
                  ('a shard reported ARCHIVE_MISSING', shard_marker_missing),
                  (f'the gam-pyffi unit job reported `{pyffi_test_result or "?"}`', pyffi_never_ran),
              )
              if fired
          ]

          # The Python surface cannot report a missing archive — it builds its
          # own wheel. Its false-green shape is different: the wheel step (or a
          # bare `python tests/integration_*.py` step) fails, every later step is
          # skipped, no report is ever written, and a naive reader sees zero
          # Python failures. So: a red job that produced no identity means we
          # know something broke and cannot say what. That is NOT MEASURED, not
          # zero. A red job WITH identities is a genuine measurement.
          python_ran = conclusion_is_measured(python_tests_result)
          python_not_measured = (
              not python_ran
              or (python_tests_result != 'success' and not python_fails)
          )
          python_not_measured_reasons = [
              label
              for label, fired in (
                  (f'the Python job reported `{python_tests_result or "?"}`', not python_ran),
                  ('the Python job went red without recording a single failing test — '
                   'a step before pytest (wheel build, CLI integration script) most '
                   'likely died; read the job log',
                   python_ran and python_tests_result != 'success' and not python_fails),
                  ('no Python log was collected at all', python_ran and not python_logs),
              )
              if fired
          ]
          populations_measured = conclusion_is_measured(python_populations_result)

          # The populations job (#2666) uploads its log into the SAME
          # `agg/python` directory the API job does, so `python_fails` SUMS OVER
          # BOTH jobs. A sum is a total only when every contributing job is
          # measured; if any contributor stopped early the sum is a lower bound
          # and has to be printed as one, with the unmeasured contributors named
          # — otherwise the reader cannot tell an undercount from a count.
          python_count_unmeasured_contributors = [
              name
              for name, ok in (
                  (f'Python API tests (job `{python_tests_result or "?"}`)',
                   not python_not_measured),
                  (f'Python populations, slow + torch (job '
                   f'`{python_populations_result or "?"}`)', populations_measured),
              )
              if not ok
          ]
          python_count_is_lower_bound = bool(python_count_unmeasured_contributors)

          # ---- write MASTER_FAILURES.md --------------------------------------
          out = []
          out.append('# MASTER_FAILURES')
          out.append('')
          # When a shard never got an archive, the runtime counters below are
          # not "how many tests failed" — they are "how many failed among the
          # tests that ran", and some targets ran none. Emitting a bare number
          # there produces a false green: five of the fourteen runs in
          # 12–24 Jul 2026 published `Compile failures: 0` AND `Runtime test
          # failures: 0` for a workspace that never built, and the only thing
          # distinguishing them from an actually-clean run was a prose note
          # under the numbers. Say NOT MEASURED in the counter itself, so the
          # headline cannot be read as a result.
          measured = 'NOT MEASURED' if archive_missing else None
          def counter(label, n, affected_by_archive):
              if affected_by_archive and measured:
                  return f'- {label}: **{measured}** ({n} seen in the shards that did run)'
              return f'- {label}: **{n}**'
          out.append(counter('Compile failures', len(compile_errs), False))
          if workspace_population is None:
              out.append('- Workspace tests run: **NOT MEASURED** '
                         f'(required floor: {MIN_WORKSPACE_TESTS})')
          else:
              out.append(f'- Workspace tests run: **{workspace_population.total}** '
                         f'(required floor: {MIN_WORKSPACE_TESTS})')
          out.append(counter('Runtime test failures (FAIL/TIMEOUT/TERMINATING/LEAK)',
                             len(run_fails), True))
          if python_count_is_lower_bound:
              out.append(f'- Python test failures: **NOT MEASURED — at least '
                         f'{len(python_fails)}** (LOWER BOUND, not a count: '
                         + '; '.join(python_count_unmeasured_contributors)
                         + ' did not run to completion, so the tests they never '
                           'reached are unmeasured, not passing)')
          else:
              out.append(f'- Python test failures: **{len(python_fails)}**')
          out.append(counter('Forbidden runtime signatures seen', len(forbidden_hits), True))
          out.append(counter('Slow/timeout notices (#1393)', len(slow), True))
          out.append('')
          # Per-surface coverage. Three jobs measure three disjoint surfaces and
          # any one of them can go dark independently; a single headline number
          # cannot say which. The Python row existed as a job status for months
          # while its failures never reached this ledger — that is how the #1251
          # FFI parity test stayed red and invisible from 2026-07-09 to 07-24.
          def coverage(label, ok, detail):
              return f'- {label}: **{"MEASURED" if ok else "NOT MEASURED"}** ({detail})'
          out.append('Coverage:')
          population_detail = (
              f'{workspace_population.total} tests, floor {MIN_WORKSPACE_TESTS}'
              if workspace_population is not None
              else workspace_population_error or 'no certified population'
          )
          out.append(coverage('workspace shards', not archive_missing,
                              f'build `{build_result or "?"}`, matrix `{rust_test_result or "?"}`, '
                              + population_detail))
          out.append(coverage('gam-pyffi unit tests', not pyffi_never_ran,
                              f'job `{pyffi_test_result or "?"}`'))
          out.append(coverage('Python API tests', not python_not_measured,
                              f'job `{python_tests_result or "?"}`'))
          # Fourth surface (#2666): `-m slow` and tests/torch, which every other
          # lane reaches and then filters out before anything runs. MEASURED
          # means the job executed, not that it was green — that job carries its
          # own assert step which fails when a population collects nothing or
          # skips everything, so a red result there is either real failures or a
          # named collection hole, never a silent zero.
          out.append(coverage('Python populations (slow + torch)',
                              populations_measured,
                              f'job `{python_populations_result or "?"}`'))
          if python_count_is_lower_bound:
              out.append('')
              out.append('> NOTE: the Python failure count above is a LOWER BOUND, '
                         'not a total — it sums over jobs and these did not run to '
                         'completion: '
                         + '; '.join(python_count_unmeasured_contributors)
                         + '. Everything those jobs had not reached when they '
                           'stopped is unmeasured; do not read the number as '
                           '"that is how many Python tests are red".')
          if python_not_measured:
              out.append('')
              out.append('> NOTE: the Python surface was NOT measured — '
                         + '; '.join(python_not_measured_reasons)
                         + '. The Python counter above is not a result.')
          if archive_missing:
              out.append('')
              out.append('> NOTE: the runtime surface was NOT measured — '
                         + '; '.join(not_measured_reasons)
                         + '. Runtime counters above are not results. Fix the build '
                           'first; the runtime surface will then be exercised.')
              if not compile_errs:
                  out.append('>')
                  out.append('> The archive is missing and NO compile error was captured '
                             'either, so this run reports nothing at all about the '
                             'workspace — neither that it builds nor that it passes. '
                             'Read the build-logs artifact.')
          out.append('')

          out.append('## Compile failures')
          out.append('')
          if compile_errs:
              for loc, code, msg in compile_errs:
                  tag = f'[{code}] ' if code else ''
                  out.append(f'- `{loc or "?"}` — {tag}{msg}')
          else:
              out.append('_None._')
          out.append('')

          out.append('## Runtime test failures')
          out.append('')
          if run_fails:
              for status, binid, test in run_fails:
                  out.append(f'- **{status}** `{binid}` :: `{test}`')
          else:
              out.append('_None._')
          out.append('')

          out.append('## Python test failures')
          out.append('')
          if python_count_is_lower_bound:
              out.append(f'_Lower bound: {len(python_fails)} recorded before the '
                         f'run stopped. Unmeasured: '
                         + '; '.join(python_count_unmeasured_contributors) + '._')
              out.append('')
          if python_fails:
              for status, binid, test in python_fails:
                  out.append(f'- **{status}** `{binid}` :: `{test}`')
          elif python_not_measured:
              out.append('_Not measured — see the note above._')
          else:
              out.append('_None._')
          out.append('')

          out.append('## Forbidden runtime-error signatures')
          out.append('')
          if forbidden_hits:
              for p in forbidden_hits:
                  out.append(f'- {p}')
          else:
              out.append('_None._')
          out.append('')

          out.append('## Slow / timeout attribution (#1393)')
          out.append('')
          if slow:
              for status, binid, test in slow:
                  out.append(f'- {status} `{binid}` :: `{test}`')
          else:
              out.append('_No test crossed the 300s slow period._')
          out.append('')

          md = '\n'.join(out) + '\n'
          open('MASTER_FAILURES.md', 'w').write(md)
          print(md)

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              open(summary, 'a').write(md)

          ghout = os.environ.get('GITHUB_OUTPUT')
          total_fail = len(compile_errs) + len(run_fails) + len(python_fails)
          if ghout:
              open(ghout, 'a').write(f'failures={total_fail}\n')
              # A missing archive with no captured compile error scores zero on
              # both counters, so this job would report "No failures collected"
              # for a workspace that never built and never ran. An absent
              # measurement is not a passing one — fail on it explicitly.
              open(ghout, 'a').write(f'archive_missing={"1" if archive_missing else "0"}\n')
              open(ghout, 'a').write(
                  f'python_not_measured={"1" if python_not_measured else "0"}\n')
              # A sum over jobs where one job stopped early is a lower bound, and
              # a lower bound must never be published as a green total (#2743).
              open(ghout, 'a').write(
                  f'python_count_lower_bound={"1" if python_count_is_lower_bound else "0"}\n')
          PY

      - name: Upload MASTER_FAILURES.md
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: MASTER_FAILURES
          path: MASTER_FAILURES.md
          retention-days: 30
          if-no-files-found: warn


      - name: Fail the run if any failure was collected
        shell: bash
        run: |
          set -uo pipefail
          n="${{ steps.master.outputs.failures }}"
          n="${n:-0}"
          missing="${{ steps.master.outputs.archive_missing }}"
          missing="${missing:-0}"
          py_missing="${{ steps.master.outputs.python_not_measured }}"
          py_missing="${py_missing:-0}"
          py_lower_bound="${{ steps.master.outputs.python_count_lower_bound }}"
          py_lower_bound="${py_lower_bound:-0}"
          if [ "$n" -gt 0 ]; then
            echo "::error::${n} total failures (compile + runtime + Python). See the MASTER_FAILURES.md artifact."
            exit 1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::The runtime surface was not measured. Zero collected failures here means 'not measured', not 'green'. MASTER_FAILURES.md lists which condition fired (archive build, shard matrix, a shard's ARCHIVE_MISSING marker, or the gam-pyffi job); see it and the build-logs artifact."
            exit 1
          fi
          if [ "$py_missing" = "1" ]; then
            echo "::error::The Python surface was not measured (the python-tests job did not run, or went red without recording a failing test). Zero Python failures here means 'not measured', not 'green'. See MASTER_FAILURES.md and the python-tests job log."
            exit 1
          fi
          if [ "$py_lower_bound" = "1" ]; then
            echo "::error::The Python failure count is a LOWER BOUND, not a total: it sums over the python-tests and python-populations jobs and at least one of them did not run to completion (cancelled/timed out/skipped). MASTER_FAILURES.md names which. A lower bound is not a green result."
            exit 1
          fi
          echo "No failures collected."

      # Track this run's uncompressed ledger in-tree after the gate has assigned
      # the job's honest status. `always()` preserves publication for red suites;
      # the publisher itself keeps the previous ledger when no report exists.
      - name: Publish results to bench/gha_results
        if: always()
        uses: ./.github/actions/publish-gha-results
        with:
          name: rust-test-suite
          files: |
            MASTER_FAILURES.md

  # ---------------------------------------------------------------------------
  # Python API + maturin/wheel flow. PRESERVED verbatim from the old workflow,
  # except it is no longer gated behind the Rust suite passing (`needs: test`):
  # the Rust suite is frequently red on purpose (committed bug-repro tests), and
  # the "see ALL failures" goal requires the Python suite + the Rust<->Python FFI
  # parity test to run regardless. It builds its own wheel, so it is independent.
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.rs human-author gate needs the real last build.rs editor; a depth-1 clone makes git log return HEAD, false-failing every Claude-authored HEAD (#1458)

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install maturin
        run: python -m pip install --upgrade pip "maturin>=1.7,<2"

      - name: Build and install gam extension (maturin build + wheel install)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          maturin build --release -i python3 -o dist
          python -m pip install --force-reinstall dist/*.whl
          # The pyffi parity test and the pytest steps run from the repo ROOT,
          # where the source ./gamfit/ package shadows the installed wheel on
          # sys.path (cwd is searched first). The source tree has no compiled
          # extension, so `import gamfit._rust` fails (ModuleNotFoundError). Copy
          # the just-built extension from the installed wheel into the source tree
          # so the cwd-shadowed import resolves the real module.
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          cp "$SITE"/gamfit/_rust*.so gamfit/ 2>/dev/null || true
          ls -la gamfit/_rust*.so || { echo "::error::compiled gamfit._rust extension not found in $SITE/gamfit after wheel install"; exit 1; }

      - name: Install Python test extras
        run: |
          python -m pip install \
            'pytest>=8' 'pytest-xdist>=3' 'pytest-timeout>=2' \
            'numpy>=1.26' 'pandas>=2.0' \
            'pyarrow>=14' 'matplotlib>=3.8' 'scikit-learn>=1.4' \
            'lifelines>=0.28'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run Rust↔Python FFI parity test (needs installed gamfit wheel)
        # This `pyffi` integration test shells out to `python3 -c "import
        # gamfit"` and compares Rust-engine vs Python-binding fit output. It
        # requires the maturin-built `gamfit._rust` extension installed above,
        # so it is excluded from the Rust-only shards and run here (#1251).
        #
        # `tee`d into python-logs/ so the aggregate job can list this test's
        # failure identity like any other. `set -o pipefail` is REQUIRED: the
        # default shell is `bash -e` with no pipefail, so a bare `cmd | tee`
        # would report tee's status and turn a red parity test green — the exact
        # false-green class this instrumentation exists to remove.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p python-logs
          status=0
          cargo nextest run --all-features \
            --test pyffi \
            -E 'test(python_rust_ffi_parity_gaussian)' \
            2>&1 | tee python-logs/parity.log || status="${PIPESTATUS[0]}"
          exit "$status"

      # ── every measurement below runs, even after one above it fails ──────
      #
      # Each step here MEASURES a different suite; none is a precondition for
      # the next. Left unguarded they inherit step-sequential semantics, so the
      # FIRST red step silently cancels every measurement after it and the job
      # reports one failure where it could have reported the true set. That is
      # not hypothetical: the `python_rust_ffi_parity_gaussian_linear` case
      # above went red on 07-23 and again on 07-28 (#2595, `raw_reml_score`
      # returning 0), and both times it took `tests/test_python_api.py` down
      # with it — unrun, unreported, and indistinguishable from passing. #2432
      # was filed on the day that suite next executed, and its own title records
      # the consequence: "first visible run of this suite in a week". Eight
      # user-facing API tests had been failing into a void.
      #
      # `!cancelled()` (not `always()`): a real cancellation still stops the
      # job, but a FAILURE upstream no longer decides what gets measured. The
      # job conclusion is unaffected — a failed step fails the job whether or
      # not later steps run — so this only ever ADDS evidence. That is the same
      # reason the aggregate step at the end already carries `always()`; the
      # steps that produce its input should never have been the exception.
      #
      # Every pytest step below writes a JUnit report. This is purely additive
      # (no pipe, so no exit-status change) and gives the aggregate per-test
      # identities instead of a job-level pass/fail bit.
      - name: Run Python API + pipeline smoke tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_python_api.py -v --tb=short --junitxml=python-reports/api.xml

      - name: Run Python tables tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_tables.py -v --tb=short --junitxml=python-reports/tables.xml

      - name: Run numeric by-variable predict-clip contract
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_bug_hunt_numeric_by_variable_clamped_to_training_range_at_predict.py -v --tb=short --junitxml=python-reports/predict_clip.xml

      - name: Run curv() constant-curvature sign-recovery contract (#1464)
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_bug_hunt_curv_smooth_hyperbolic_recovered_as_spherical.py -v --tb=short --junitxml=python-reports/curv.xml

      - name: Run weighted sample_replicates weight-column contract (#2033)
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_bug_hunt_2033_sample_replicates_weighted_model_drops_weight_column.py -v --tb=short --junitxml=python-reports/sample_replicates.xml

      - name: Run Tweedie estimated-power conditional coverage contract (#2026)
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_bug_hunt_2026_tweedie_estimated_power_conditional_coverage.py -v --tb=short --junitxml=python-reports/tweedie.xml

      - name: Run survival API regression + save/load roundtrip tests
        if: ${{ !cancelled() }}
        run: |
          python -m pytest \
            tests/test_survival_api_regressions.py \
            tests/test_survival_save_load_roundtrip.py \
            -v --tb=short --junitxml=python-reports/survival.xml

      - name: Run benchmark configuration / mapping tests
        if: ${{ !cancelled() }}
        run: |
          python -m pytest \
            tests/bench_run_suite_mapping_test.py \
            tests/bench_run_suite_optional_imports_test.py \
            tests/bench_fuzz_vs_mgcv_test.py \
            tests/bench_large_scale_runner_test.py \
            tests/workflow_tasks_2623_test.py \
            tests/test_benchmark_build_matrix.py \
            -v --tb=short --junitxml=python-reports/bench.xml

      - name: Guard against orphaned Python tests (#1512)
        if: ${{ !cancelled() }}
        run: |
          python -m pytest tests/test_ci_no_orphan_python_tests_1512.py -v --tb=short --junitxml=python-reports/orphan_guard.xml

      - name: Build gam release binary
        if: ${{ !cancelled() }}
        run: cargo build --release -p gam-cli

      - name: Run CLI integration scripts (numeric contract checks)
        if: ${{ !cancelled() }}
        run: |
          python tests/integration_marginal_slope.py
          python tests/integration_pit_pipeline.py

      - name: Run full Python test suite (all Python tests in tests/)
        if: ${{ !cancelled() }}
        # SPEC 16 (no XFAIL): red is red. Files documenting still-open engine
        # bugs stand red here and the JOB reports red with them — a green job
        # over failing tests is the workflow-level XFAIL pattern SPEC 16
        # forbids. Collection errors abort loudly for the same reason: a file
        # that cannot even import is the loudest failure, not one to skip
        # past. Nothing gates pushes to main; this status is pure signal.
        # Runs LAST (after the release-CLI build) so the CLI-driven
        # `*_test.py` repros actually execute instead of capability-skipping
        # on the missing binary, and so its failure hides no other step.
        # `--timeout=300`: without a per-test bound this step can wedge the
        # whole job indefinitely, and one test doing so costs every measurement
        # after it plus the JUnit upload the aggregate reads. Observed directly
        # on run 30339488124, which sat in THIS step for over 3.5 hours; the
        # steps above it had already finished in ~40 minutes. It had never been
        # noticed because the job used to die at the FFI parity step and never
        # reached here at all (the sequencing bug fixed in 414888eb3) — removing
        # that blindfold is what exposed this.
        #
        # 300 s and `-n auto` are copied deliberately from `python-contracts.yml`'s
        # #1512 triage step, which runs the SAME `pytest tests/` on the same
        # wheel and completes in 20-30 minutes. Two workflows running one command
        # should not disagree about whether it is allowed to hang.
        run: |
          python -m pytest tests/ \
            -m "not slow" \
            -n auto --timeout=300 \
            --tb=short -q --junitxml=python-reports/full_suite.xml

      # Turn this job's measurements into ONE log in the same row format the
      # aggregate already parses for nextest shards, so Python failures become
      # first-class entries in MASTER_FAILURES.md instead of a job status nobody
      # reads. `always()`: a job that died mid-suite still publishes whatever it
      # managed to measure, and the aggregate distinguishes "measured, N red"
      # from "nothing measured" by whether this log carries any row at all.
      - name: Collect Python failure identities
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p python-logs
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          rows = []
          for path in sorted(glob.glob('python-reports/*.xml')):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  # Deliberately broad: this step exists so measurements are
                  # never lost, so ONE odd report must not take the rest of the
                  # ledger down with it (a truncated write, an unreadable file,
                  # a parser that cannot load its C extension). A report we
                  # cannot read is a measurement we do not have — say so as a
                  # row rather than dropping it silently.
                  rows.append(f'        FAIL [   0.000s] python::{path} report-unreadable')
                  continue
              for case in root.iter('testcase'):
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if not bad:
                      continue
                  # `file` is pytest's source path; `classname` is the dotted
                  # fallback for reports that omit it.
                  binid = case.get('file') or (case.get('classname') or '?').replace('.', '/')
                  name = case.get('name') or '?'
                  status = 'FAIL' if bad[0].tag == 'failure' else 'ABORT'
                  seconds = case.get('time') or '0'
                  try:
                      stamp = f'{float(seconds):8.3f}s'
                  except ValueError:
                      stamp = '   0.000s'
                  rows.append(f'        {status} [{stamp}] python::{binid} {name}')

          with open('python-logs/pytest.log', 'w') as fh:
              fh.write('\n'.join(rows) + ('\n' if rows else ''))
          print(f'collected {len(rows)} Python failure row(s)')
          PY

      - name: Upload Python test logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          # Deliberately NOT named `shard-logs-*`: the aggregate treats the
          # presence of a shard log as evidence the Rust shard matrix ran, and
          # a Python log landing in that set would mask a skipped matrix.
          name: python-logs
          path: python-logs/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The two Python populations the ordinary lanes structurally cannot measure
  # (#2666). Both are reached by `pytest tests/` and then removed before
  # anything runs, so neither ever produced a verdict:
  #
  #   * `-m slow` — both directory-level steps (here and in
  #     python-contracts.yml) pass `-m "not slow"`, and no lane passes `-m slow`.
  #     18 files, 46 test functions.
  #   * `tests/torch/` — its conftest.py `collect_ignore_glob`s the whole
  #     directory when torch is absent, and no job installed torch. 29 files.
  #
  # A SEPARATE JOB, not extra steps on `python-tests`. These are the expensive
  # populations by construction: one SAE manifold fixture was measured at
  # `[1h 31m]` inside a 300 s cap (the watchdog thread cannot preempt a Rust
  # call that holds the GIL). Hanging them off the existing job would risk its
  # 6-hour default cap and destroy the measurements that already work; here a
  # wedged fixture costs only this job.
  #
  # It rebuilds the wheel rather than resolving a sealed artifact from another
  # workflow. That indirection is what the previous attempt at this lane used,
  # and all three of its population jobs failed on their last scheduled run
  # before it was removed; ~25 min of runner time twice a day buys a lane with
  # no cross-workflow dependency to go wrong.
  # ---------------------------------------------------------------------------
  python-populations:
    name: Python populations (slow + torch)
    runs-on: ubuntu-latest
    # Below `python-tests`' 360-minute default on purpose: this job exists to
    # produce a verdict, and a verdict at 300 minutes with the collection step
    # still able to publish beats a job cancelled at the cap with nothing.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.rs human-author gate, same reason as python-tests

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install maturin
        run: python -m pip install --upgrade pip "maturin>=1.7,<2"

      - name: Build and install gam extension (maturin build + wheel install)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          maturin build --release -i python3 -o dist
          python -m pip install --force-reinstall dist/*.whl
          # Both populations run from the repo ROOT, not runner.temp: the torch
          # suite imports `gamfit.torch`, which lives in the SOURCE package, and
          # the source ./gamfit shadows the installed wheel from cwd. Copying the
          # compiled extension into the source tree is what makes that shadowed
          # import resolve — identical to the python-tests job above.
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          cp "$SITE"/gamfit/_rust*.so gamfit/ 2>/dev/null || true
          ls -la gamfit/_rust*.so || { echo "::error::compiled gamfit._rust extension not found in $SITE/gamfit after wheel install"; exit 1; }

      - name: Install Python test extras
        run: |
          python -m pip install \
            'pytest>=8' 'pytest-xdist>=3' 'pytest-timeout>=2' \
            'numpy>=1.26' 'pandas>=2.0' \
            'pyarrow>=14' 'matplotlib>=3.8' 'scikit-learn>=1.4' \
            'lifelines>=0.28'

      - name: Install CPU torch wheel
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # THE POINT OF THIS STEP. tests/torch/conftest.py drops the entire
      # directory when torch is missing, and the modules themselves sit behind
      # `pytest.importorskip("torch")` / `importorskip("gamfit.torch")`. Both
      # mechanisms are correct locally and catastrophic in CI: a failed torch
      # install would produce a GREEN job over 29 unrun files, which is the exact
      # "counted as passes" outcome this lane exists to prevent. Import both
      # explicitly first, so an environment problem is an environment failure and
      # never a silent pass.
      - name: Prove the torch runtime is real (never let a skip read as a pass)
        run: |
          set -euo pipefail
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import gamfit.torch; print('gamfit.torch imported from', gamfit.torch.__file__)"

      # ── both measurements run, even after one above fails ────────────────
      - name: Run the slow-marked population (-m slow)
        if: ${{ !cancelled() }}
        shell: bash
        # `--timeout=1800`, not the 300 s the ordinary lane uses: these tests are
        # marked slow precisely because they legitimately exceed it, and reusing
        # 300 here would report the population as timeouts rather than measuring
        # it. The bound still exists because an unbounded step can consume the
        # whole job.
        #
        # The target is `tests/`, not the 18 files that carry the marker: naming
        # files is the #1512 defect, and a slow test added tomorrow must land in
        # this lane without anyone editing it. The cost is that `-m` filters
        # AFTER collection, so this step imports every module under tests/ and a
        # module that cannot import fails here too. That is the right direction —
        # a collection error is the loudest failure available, not a skip.
        run: |
          set -uo pipefail
          mkdir -p python-reports
          # `|| status=$?`, not a bare call followed by `$?`: GitHub runs an
          # explicit `shell: bash` step under `-e`, so a red pytest would abort
          # the script before the exit code could be read and the exit-5 check
          # below would never execute. `set -uo pipefail` does not clear -e.
          status=0
          python -m pytest tests/ \
            -m "slow" \
            -n auto --timeout=1800 --timeout-method=thread \
            --max-worker-restart=200 \
            -rs --tb=short -q --junitxml=python-reports/slow.xml || status=$?
          echo "pytest (-m slow) exit status: $status"
          # Exit 5 is pytest's "no tests collected". For a population lane that
          # is the worst outcome available: it is indistinguishable from a green
          # run at the job level while measuring nothing at all.
          if [ "$status" -eq 5 ]; then
            echo "::error::the slow marker collected NOTHING. The population this lane exists to measure is gone, or the marker was renamed (#2666)."
            exit 1
          fi
          exit "$status"

      - name: Run the torch population (tests/torch)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p python-reports
          status=0
          python -m pytest tests/torch \
            --timeout=1800 --timeout-method=thread \
            -rs --tb=short -q --junitxml=python-reports/torch.xml || status=$?
          echo "pytest (tests/torch) exit status: $status"
          if [ "$status" -eq 5 ]; then
            echo "::error::tests/torch collected NOTHING despite torch importing (#2666)."
            exit 1
          fi
          exit "$status"

      # A count, not an exit code. A directory-level pytest step exiting 0 says
      # nothing about whether anything was collected, and every prior version of
      # these two populations "passed" by not existing. Fail if a report shows no
      # executed test, so this lane can never join the set of channels that are
      # wired and carry nothing.
      - name: Assert both populations actually executed
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path

          bad = []
          for name, path in (('slow', 'python-reports/slow.xml'),
                             ('torch', 'python-reports/torch.xml')):
              p = Path(path)
              if not p.is_file():
                  bad.append(f'{name}: no JUnit report at {path} — the step never produced one')
                  continue
              root = ET.parse(p).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              total = sum(int(s.get('tests') or 0) for s in suites)
              skipped = sum(int(s.get('skipped') or 0) for s in suites)
              errors = sum(int(s.get('errors') or 0) for s in suites)
              failures = sum(int(s.get('failures') or 0) for s in suites)
              ran = total - skipped - errors
              print(f'{name}: collected={total} skipped={skipped} errors={errors} '
                    f'failures={failures} executed={ran}')
              if total == 0:
                  bad.append(f'{name}: collected 0 tests')
              elif ran <= 0:
                  # Every test skipped is the failure mode this lane was built to
                  # remove: a green report over a population that did not run.
                  bad.append(f'{name}: collected {total} but executed none '
                             f'({skipped} skipped, {errors} errored)')
          if bad:
              for line in bad:
                  print(f'::error::{line} (#2666)')
              sys.exit(1)
          print('both populations executed')
          PY

      # Same row grammar and the same channel as every other surface, so these
      # failures become entries in MASTER_FAILURES.md rather than a job status
      # nobody reads. `always()`: a job that died mid-population still publishes
      # what it measured.
      - name: Collect Python population failure identities
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p python-logs
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          rows = []
          for path in sorted(glob.glob('python-reports/*.xml')):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  rows.append(f'        FAIL [   0.000s] python::{path} report-unreadable')
                  continue
              for case in root.iter('testcase'):
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if not bad:
                      continue
                  binid = case.get('file') or (case.get('classname') or '?').replace('.', '/')
                  name = case.get('name') or '?'
                  status = 'FAIL' if bad[0].tag == 'failure' else 'ABORT'
                  seconds = case.get('time') or '0'
                  try:
                      stamp = f'{float(seconds):8.3f}s'
                  except ValueError:
                      stamp = '   0.000s'
                  rows.append(f'        {status} [{stamp}] python::{binid} {name}')

          with open('python-logs/populations.log', 'w') as fh:
              fh.write('\n'.join(rows) + ('\n' if rows else ''))
          print(f'collected {len(rows)} Python population failure row(s)')
          PY

      - name: Upload Python population logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          # `python-logs-populations`, not `python-logs`: artifact names are
          # unique per run, and the aggregate downloads both into agg/python.
          # Deliberately NOT `shard-logs-*`, for the reason given on the other
          # Python upload — a Python log in that set would mask a skipped Rust
          # matrix.
          name: python-logs-populations
          path: python-logs/
          retention-days: 7
          if-no-files-found: warn
