name: Graph Oracle Prediction

# The graph oracle's prediction-training stack (#2951): bench/oracle/graph/predict/test_predict.py on the
# CPU, with Qwen3-0.6B downloaded so the written-out decoder is checked against Hugging Face's forward
# (identity interventions, an MLP removal against a hooked run, batched interventions, attention weights);
# the vpd4l checks skip here (VPD's files are not on the runner).

on:
  push:
    branches: [main]
    paths:
      - "bench/oracle/graph/predict/**"
      - ".github/workflows/graph-predict.yml"
  workflow_dispatch:

concurrency:
  group: graph-predict-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: prediction stack tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch and the test dependencies
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'pytest>=8' numpy safetensors transformers huggingface_hub

      - name: Download Qwen3-0.6B
        run: python -c "from huggingface_hub import snapshot_download; print(snapshot_download('Qwen/Qwen3-0.6B'))"

      - name: Run the tests
        run: python -m pytest bench/oracle/graph/predict/test_predict.py -p no:cacheprovider -v --tb=short
