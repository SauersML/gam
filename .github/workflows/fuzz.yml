name: Fuzz vs mgcv

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      verbose:
        description: "gamfit solver log verbosity for this run (empty = quiet default, '-v' = debug, '-vv' = trace). Use '-v' to make budget spend attributable per scenario; the stream is uploaded as an artifact and is NOT committed."
        default: ""
        required: false
      n_trials:
        description: "Trial budget for THIS run. Empty = the nightly's 100. A smaller value makes this a probe: the harness itself is what is under test (does the mgcv reference arm come back with a number?), and a probe does NOT publish its ledger."
        default: ""
        required: false
      max_total_seconds:
        description: "Soft wall-clock budget for the trial loop, checked between trials. Empty = the nightly's 2400."
        default: ""
        required: false

# #2443/#2437: a fuzz run's value IS the corpus/findings it produced, so the
# scheduled run is keyed on `github.sha` and never cancelled — under ref-keying a
# lane `workflow_dispatch` from `main` shares the group and discards the night's
# fuzzing. Dispatched runs retain newest-wins semantics on their own ref.
concurrency:
  group: fuzz-${{ github.event_name == 'schedule' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The nightly's values live here so a dispatch can lower them without the run
  # step changing shape. A `schedule` event has no `inputs` context at all, so
  # the fallbacks are what the scheduled run always uses.
  FUZZ_N_TRIALS: ${{ github.event.inputs.n_trials || '100' }}
  FUZZ_MAX_TOTAL_SECONDS: ${{ github.event.inputs.max_total_seconds || '2400' }}

jobs:
  fuzz:
    permissions:
      contents: write
      actions: read
    name: Fuzz vs mgcv
    runs-on: ubuntu-latest
    # MUST exceed the trial budget below PLUS setup, with real margin, because
    # BOTH of those terms are larger and softer than this comment used to assume.
    #
    # The 60 -> 90 raise did not fix it. Measured over the last 20 runs: ZERO
    # successful, and 11 of 15 scheduled runs `cancelled` at exactly 1h30m — i.e.
    # still killed by this cap, just 30 minutes later. Step timings from run
    # 30426575556 (2026-07-29) say where it goes:
    #
    #   setup total                     31m36s   (05:56:48 -> 06:28:24)
    #     of which Build release binary 14m50s
    #     of which maturin build        14m10s
    #   Run fuzzer                      58m36s   (06:28:24 -> 07:27:00, CANCELLED)
    #
    # So setup is ~32 min, not the "~20-25" claimed above, leaving 58 min for a
    # 55-min trial budget: a 3-minute margin. And `--max-total-seconds` is a SOFT
    # bound — it is checked between trials, so a trial already in flight carries
    # past it, and the fuzzer overran its own 55 min by 3m36s. Three minutes of
    # margin against a soft budget is not a budget.
    #
    # Why this matters more than the wasted minutes: the step ends with
    # `exit "$status"`, which propagates the FUZZER's exit code — the actual
    # pass/fail verdict. A cap kill means that line never runs, so the verdict has
    # been discarded on every one of the last 20 runs. The upload/publish steps are
    # `if: always()` and do land inside GitHub's grace window, so the numbers are
    # in-tree; it is the RED/GREEN signal that has never once been reported. A
    # cancelled run is not a red one.
    #
    # The old coupling rule (`>= max-total-seconds/60 + 30`) was satisfied at 85
    # and still failed. The rule needs the measured setup and slack for the soft
    # budget: keep this at least `max-total-seconds/60 + 40`.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p gam-cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install --upgrade pip "maturin>=1.7,<2" numpy pandas pyarrow scikit-learn lifelines

      - name: Build and install gamfit (maturin)
        # `bench/fuzz_vs_mgcv.py` imports the project's own `gamfit` Python
        # package (`gamfit._binding.rust_module`) for its scoring helpers, so
        # the fuzzer aborts at `ModuleNotFoundError: No module named 'gamfit'`
        # unless the maturin-built wheel is installed alongside the CLI build
        # that powers `_ensure_rust_binary`. Build into `dist/` and install
        # the wheel directly so the fuzzer can `import gamfit`.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          maturin build --release -i python3 -o dist
          pip install --force-reinstall dist/*.whl

      - name: Set up R
        uses: ./.github/actions/setup-bench-r
        with:
          r-version: "4.4.3"

      - name: Install R packages
        run: Rscript -e 'install.packages(c("mgcv","jsonlite"), repos="https://cloud.r-project.org", Ncpus=max(1L, parallel::detectCores()-1L))'

      - name: Run fuzzer
        env:
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          set -o pipefail
          # #2584: stdout is the in-tree ledger (`fuzz_output.txt` is COMMITTED by
          # publish-gha-results, so it must stay small); stderr carries the solver
          # stream and goes to an artifact-only file. Raising the level globally
          # into the committed file would check in a six-figure-line log nightly.
          level_args=()
          case "${VERBOSE:-}" in
            "") ;;
            -v|-vv) level_args=("$VERBOSE") ;;
            *) echo "::error::verbose must be empty, -v or -vv (got '$VERBOSE')"; exit 1 ;;
          esac
          # The step shell is `bash -e`, so the pipeline must be un-guarded for
          # its exit code to be CAPTURED rather than abort the step: a failing
          # run is exactly when the stderr tail below is worth having in-tree.
          set +e
          python bench/fuzz_vs_mgcv.py \
            --n-trials "$FUZZ_N_TRIALS" \
            --top 30 \
            --rust-timeout 60 \
            --r-timeout 60 \
            --max-scenario-cost 200000 \
            --max-total-seconds "$FUZZ_MAX_TOTAL_SECONDS" \
            "${level_args[@]}" \
            2> fuzz_solver.log | tee fuzz_output.txt
          status=${PIPESTATUS[0]}
          set -e
          # Keep the committed ledger small but never blind: a crash tail still
          # lands in-tree, while the full stream stays artifact-only.
          {
            echo
            echo "----- stderr tail (full stream: fuzz-results artifact, fuzz_solver.log) -----"
            tail -n 200 fuzz_solver.log || true
          } >> fuzz_output.txt
          exit "$status"

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: |
            bench/fuzz_results.jsonl
            fuzz_output.txt
            fuzz_solver.log
          if-no-files-found: warn


      # Track this run's uncompressed numbers in-tree (bench/gha_results/fuzz).
      # always() so a failed or timed-out run still publishes what it measured -
      # those numbers are usually the interesting ones. Publishes nothing when the
      # run produced no results, so a bad run never blanks the last good one.
      #
      # A reduced-trial probe run is excluded: its handful of rows would replace
      # the in-tree ledger with a sample far too small to read as the nightly's
      # numbers. The probe's evidence is its own log and its uploaded artifact,
      # which the step above keeps unconditionally.
      - name: Publish results to bench/gha_results
        if: always() && env.FUZZ_N_TRIALS == '100'
        uses: ./.github/actions/publish-gha-results
        with:
          name: fuzz
          files: |
            bench/fuzz_results.jsonl
            fuzz_output.txt