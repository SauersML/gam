name: Large-scale

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Cohort scale to validate
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
  schedule:
    # Hourly smoke run; skip 07:00 UTC to avoid colliding with the daily full run.
    - cron: "23 0,6,12,18 * * *"
    # Daily full run at 02:00 America/Chicago (CDT); every job remains bounded to 50 minutes.
    - cron: "0 7 * * *"

# #2443/#2437: the scale discriminator already keeps the hourly smoke from
# cancelling the 07:00 full run, but it does NOT stop a `workflow_dispatch` with
# `scale: full` from landing in the nightly's group and cancelling it. Scheduled
# runs are records, so they key on `github.sha` and are never cancelled;
# dispatched runs keep newest-wins per (ref, scale).
concurrency:
  group: large-scale-${{ github.event_name == 'schedule' && github.sha || github.ref }}-${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * *' && 'full' || inputs.scale || 'smoke' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: read
  contents: read

jobs:
  resolve-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.runtime.outputs.run_id }}
      sha: ${{ steps.runtime.outputs.sha }}
      artifact: ${{ steps.runtime.outputs.artifact }}
    steps:
      - name: Resolve newest immutable warm runtime on this history
        # Only a successful Runtime build carries the artifact, so the window
        # is the newest 50 SUCCESSFUL builds. Measured 2026-09-09: without the
        # status filter, 50 consecutive cancelled/failed push builds (a red
        # build.rs gate under a multi-lane push burst) hid an unexpired
        # artifact built 20 minutes before the window began, and every
        # scheduled Large-scale run refused to start.
        #
        # The runtime SHA is read from the artifact name, not from the run. A
        # commissioned build (`wheel-nightly.yml -f build_sha=<sha>`) runs with
        # the dispatch ref's tip as its headSha but uploads
        # `gamfit-runtime-<build_sha>`, so keying on headSha skipped every
        # commissioned runtime unless main had not moved since the dispatch.
        # Candidates are taken newest-created first, so the most recently
        # commissioned runtime on this history wins.
        id: runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_run_id=""
          runtime_sha=""
          runtime_artifact=""
          runtime_created=""
          # wheel-nightly.yml builds on `cron: '19 4 * * *'`, one period a day,
          # so a healthy producer leaves at most 24 h between runtimes. A bound
          # at one period would refuse every time a single build runs long or one
          # cycle is missed, which is noise rather than a defect; a bound at two
          # admits exactly one missed cycle and refuses two consecutive ones,
          # which is the smallest gap that cannot happen while the producer is
          # working. Nothing here is chosen: change the producer's cron and this
          # is twice its period.
          runtime_max_age_hours=48
          while read -r candidate_run; do
            if [[ -z "$candidate_run" ]]; then
              continue
            fi
            candidate_row=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.name | test("^gamfit-runtime-[0-9a-f]{40}$")) and (.expired == false)) | "\(.name)\t\(.created_at)"] | if length == 1 then .[0] else "" end')
            if [[ -z "$candidate_row" ]]; then
              continue
            fi
            candidate_artifact="${candidate_row%%$'\t'*}"
            candidate_created="${candidate_row#*$'\t'}"
            candidate_sha="${candidate_artifact#gamfit-runtime-}"
            merge_base=$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${candidate_sha}...${GITHUB_SHA}" \
              --jq .merge_base_commit.sha)
            if [[ "$merge_base" != "$candidate_sha" ]]; then
              continue
            fi
            runtime_run_id="$candidate_run"
            runtime_sha="$candidate_sha"
            runtime_artifact="$candidate_artifact"
            runtime_created="$candidate_created"
            break
          done < <(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow wheel-nightly.yml \
            --branch main \
            --status success \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId')
          if [[ -z "$runtime_run_id" ]]; then
            echo "::error::No unexpired warm runtime artifact exists on the ancestry of ${GITHUB_SHA}; refusing a source-build fallback."
            exit 1
          fi
          # Ancestry alone does not make a runtime current: every runtime ever
          # built on this history is an ancestor of today's tip, so the check
          # above passes on a binary of any age. Run 35689260220 benchmarked a
          # nine-day-old one and reported the scheduled SHA, which reads as a
          # measurement of a tree the binary does not contain (gam#4568, #4567).
          # Age is therefore a second, independent condition on the SAME
          # artifact the run would use, applied after the choice rather than
          # inside the loop, so the message names the runtime that was actually
          # selected.
          runtime_age_hours=$(( ( $(date -u +%s) - $(date -u -d "$runtime_created" +%s) ) / 3600 ))
          if (( runtime_age_hours > runtime_max_age_hours )); then
            echo "::error::The newest warm runtime on the ancestry of ${GITHUB_SHA} is ${runtime_sha}, built ${runtime_age_hours}h ago, past the ${runtime_max_age_hours}h bound (twice wheel-nightly.yml's daily period). Benchmarking it would measure neither sha. Fix the producer: check \`gh workflow list --all | grep 'Rolling wheel'\` for disabled_manually, then \`gh workflow enable wheel-nightly.yml\`, or commission one with \`gh workflow run wheel-nightly.yml -f build_sha=${GITHUB_SHA}\`."
            {
              echo "runtime \`${runtime_sha}\` is ${runtime_age_hours}h old, past the ${runtime_max_age_hours}h bound; scheduled \`${GITHUB_SHA}\` was NOT benchmarked"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'run_id=%s\n' "$runtime_run_id" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$runtime_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "$runtime_artifact" >> "$GITHUB_OUTPUT"
          # First line of the run summary, because resolve-runtime gates every
          # other job and so writes first: a reader who sees only that line must
          # already know which binary produced the numbers below it.
          {
            echo "runtime \`${runtime_sha}\` benchmarked as scheduled \`${GITHUB_SHA}\` (runtime age ${runtime_age_hours}h, bound ${runtime_max_age_hours}h)"
            echo
            echo "### Large-scale runtime"
            echo
            echo "- scheduled workflow SHA: \`${GITHUB_SHA}\`"
            echo "- immutable runtime SHA: \`${runtime_sha}\`"
            echo "- runtime built: \`${runtime_created}\` (${runtime_age_hours}h ago)"
            echo "- producer run: \`${runtime_run_id}\`"
            echo "- artifact: \`${runtime_artifact}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: resolve-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      cache_key: ${{ steps.cache_key.outputs.cache_key }}
      scale: ${{ steps.scale.outputs.scale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-runtime.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install prepare dependencies
        # Cohort preparation and matrix construction only import NumPy; the
        # configured methods are Rust-only, so R and benchmark ML stacks do not belong here.
        shell: bash
        run: python3 -m pip install numpy

      - name: Resolve cohort scale
        id: scale
        shell: bash
        run: |
          set -euo pipefail
          scale=smoke
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 7 * * *" ]]; then
            scale=full
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scale="${{ inputs.scale }}"
          fi
          echo "scale=${scale}" >> "${GITHUB_OUTPUT}"
          echo "Large-scale cohort mode: ${scale}"

      - name: Compute cache key
        id: cache_key
        shell: bash
        run: |
          set -euo pipefail
          key="large-scale-${{ steps.scale.outputs.scale }}-${{ runner.os }}-${{ hashFiles('bench/large_scale/runner.py', 'bench/large_scale/large_scale.yml', '.github/workflows/large_scale.yml', 'Cargo.toml') }}"
          echo "cache_key=${key}" >> "${GITHUB_OUTPUT}"

      - name: Restore prepared cohort cache
        id: prep_cache
        uses: actions/cache/restore@v4
        with:
          path: bench/large_scale/prepared
          key: ${{ steps.cache_key.outputs.cache_key }}

      - name: Prepare cohort
        if: ${{ steps.prep_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.scale.outputs.scale }}" == "smoke" ]]; then
            python3 bench/large_scale/runner.py prepare --smoke --config bench/large_scale/large_scale.yml --out-dir bench/large_scale/prepared
          else
            python3 bench/large_scale/runner.py prepare --config bench/large_scale/large_scale.yml --out-dir bench/large_scale/prepared
          fi

      - name: Save prepared cohort cache
        if: ${{ steps.prep_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: bench/large_scale/prepared
          key: ${{ steps.cache_key.outputs.cache_key }}

      - name: Build method matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python3 bench/large_scale/runner.py matrix --config bench/large_scale/large_scale.yml)
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Upload prepared cohort
        uses: actions/upload-artifact@v4
        with:
          name: large-scale-prepared
          path: bench/large_scale/prepared
          if-no-files-found: error

  bootstrap-runtime:
    needs: resolve-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-runtime.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download exact warm runtime
        # `resolve-runtime` chooses one immutable artifact first, then every job
        # checks out that artifact's recorded commit. The rolling release is
        # only a convenience alias and is not an estimator input.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ needs.resolve-runtime.outputs.run_id }}
          RUNTIME_SHA: ${{ needs.resolve-runtime.outputs.sha }}
          RUNTIME_ARTIFACT: ${{ needs.resolve-runtime.outputs.artifact }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist target/release
          gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$RUNTIME_ARTIFACT" \
            --dir dist
          grep -Fx "commit=${RUNTIME_SHA}" dist/RUNTIME_PROVENANCE.txt
          (
            cd dist
            tail -n +2 RUNTIME_PROVENANCE.txt | sha256sum --check --strict
          )
          cp dist/gam target/release/gam
          chmod +x target/release/gam
          python3 .github/scripts/workflow_tasks.py extract_maturin_wheel target/release
          ls -l target/release/gam
          ls -l target/release/_rust*.so

      - name: Upload gam binary and Python extension
        uses: actions/upload-artifact@v4
        with:
          name: large-scale-gam-binary
          path: |
            target/release/gam
            target/release/_rust*.so
          if-no-files-found: error

  preprocess-ctn:
    needs:
      - resolve-runtime
      - prepare
      - bootstrap-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BENCH_CMD_TIMEOUT_SEC: ${{ needs.prepare.outputs.scale == 'full' && '2400' || '300' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-runtime.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preprocessing dependencies
        shell: bash
        run: python3 -m pip install numpy

      - name: Download prepared cohort
        uses: actions/download-artifact@v4
        with:
          name: large-scale-prepared
          path: bench/large_scale/prepared

      - name: Download prebuilt gam binary
        uses: actions/download-artifact@v4
        with:
          name: large-scale-gam-binary
          path: bench/large_scale/bin

      - name: Fit and score shared Duchon CTN
        shell: bash
        env:
          GAM_RUST_BINARY: ${{ github.workspace }}/bench/large_scale/bin/gam
        run: |
          set -euo pipefail
          chmod +x "${GAM_RUST_BINARY}"
          python3 bench/large_scale/runner.py prepare-ctn \
            --config bench/large_scale/large_scale.yml \
            --prep-dir bench/large_scale/prepared \
            --out-dir bench/large_scale/ctn-prepared

      - name: Upload shared CTN cohort
        uses: actions/upload-artifact@v4
        with:
          name: large-scale-ctn-prepared
          path: bench/large_scale/ctn-prepared
          if-no-files-found: error

  benchmark:
    needs:
      - resolve-runtime
      - prepare
      - bootstrap-runtime
      - preprocess-ctn
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # Smoke runs are the development signal and must fail fast. The daily
      # 400k cohort retains the wider mission envelope, but no job can outlive
      # the workflow's fixed 50-minute bound.
      BENCH_CMD_TIMEOUT_SEC: ${{ needs.prepare.outputs.scale == 'full' && '2400' || '300' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-runtime.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        # Shards consume the prebuilt Rust binary/extension. They need neither
        # Rust nor R/scikit packages in this job, only the runner's Python imports.
        shell: bash
        run: python3 -m pip install numpy pandas lifelines

      - name: Download shared CTN cohort
        uses: actions/download-artifact@v4
        with:
          name: large-scale-ctn-prepared
          path: bench/large_scale/ctn-prepared

      - name: Download prebuilt gam binary and Python extension
        uses: actions/download-artifact@v4
        with:
          name: large-scale-gam-binary
          path: bench/large_scale/bin

      - name: Stage gam binary and gamfit._rust extension
        # The runner imports gamfit._rust via bench/_rust_loader.py, which
        # scans the source-tree `gamfit/` directory (the in-tree package
        # shadows site-packages on sys.path because the runner does not
        # install the wheel). Drop the artifact's `_rust*.so` directly
        # there so the loader finds it; without this the bench shard
        # aborts the first survival/classification call with `RuntimeError:
        # gamfit Rust extension is not built`.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p target/release
          cp bench/large_scale/bin/gam target/release/gam
          chmod +x target/release/gam
          ls -l target/release/gam
          installed=0
          for so in bench/large_scale/bin/_rust*.so; do
            cp "$so" "gamfit/$(basename "$so")"
            installed=$((installed + 1))
          done
          if [ "${installed}" -eq 0 ]; then
            echo "::error title=Missing gamfit extension::No _rust*.so in large-scale-gam-binary artifact (bootstrap-runtime did not build gamfit._rust)"
            exit 1
          fi
          ls -l gamfit/_rust*.so

      - name: Run benchmark method
        shell: bash
        env:
          GAM_RUST_BINARY: ${{ github.workspace }}/target/release/gam
        run: |
          set -euo pipefail
          mkdir -p bench/large_scale/results bench/large_scale/runs/${{ matrix.name }}
          python3 bench/large_scale/runner.py run-method \
            --config bench/large_scale/large_scale.yml \
            --prep-dir bench/large_scale/ctn-prepared \
            --method "${{ matrix.name }}" \
            --out-dir "bench/large_scale/runs/${{ matrix.name }}" \
            --out-json "bench/large_scale/results/${{ matrix.name }}.json"

      - name: Upload method artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-scale-${{ matrix.name }}
          path: |
            bench/large_scale/results/${{ matrix.name }}.json
            bench/large_scale/runs/${{ matrix.name }}
          if-no-files-found: warn

  aggregate:
    permissions:
      contents: write
      actions: read
    needs:
      - resolve-runtime
      - benchmark
    # A failed method is a measured result and its JSON is usually the most
    # useful evidence in the run. Override the default success-only `needs`
    # gate so aggregation still collects every completed method after a red
    # matrix leg. A cancelled workflow is different: its arbitrary prefix is
    # not a suite result and must not replace the last complete measurement.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-runtime.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy matplotlib lifelines

      - name: Download prepared cohort
        uses: actions/download-artifact@v4
        with:
          name: large-scale-prepared
          path: bench/large_scale/prepared

      - name: Download method artifacts
        uses: actions/download-artifact@v4
        with:
          path: bench/large_scale/artifacts

      - name: Collect result jsons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench/large_scale/results
          find bench/large_scale/artifacts -path '*/results/*.json' -type f -print -exec cp {} bench/large_scale/results/ \;

      - name: Aggregate outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 bench/large_scale/runner.py aggregate \
            --config bench/large_scale/large_scale.yml \
            --prep-dir bench/large_scale/prepared \
            --results-dir bench/large_scale/results \
            --out-dir bench/large_scale/final

      - name: Upload aggregate bundle
        uses: actions/upload-artifact@v4
        with:
          name: large-scale-bundle
          path: bench/large_scale/final/large_scale_bundle.zip
          if-no-files-found: error


      # Track this run's uncompressed numbers in-tree (bench/gha_results/large-scale).
      # always() so a failed or timed-out run still publishes what it measured -
      # those numbers are usually the interesting ones. Publishes nothing when the
      # run produced no results, so a bad run never blanks the last good one.
      - name: Publish results to bench/gha_results
        if: always()
        uses: ./.github/actions/publish-gha-results
        with:
          name: large-scale
          files: |
            bench/large_scale/results
            bench/large_scale/final/summary.json
            bench/large_scale/final/large_scale_summary.md
