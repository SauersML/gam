name: Reference Quality Suite

# End-to-end quality tests that benchmark gam against the MATURE, STANDARD tool
# for each capability (mgcv, gamlss, survival, flexsurv, VGAM, scam, lme4,
# cmprsk, mlt/tram, scikit-learn, statsmodels, pyGAM, lifelines, scikit-survival,
# properscoring, geomstats, ...). These live under tests/quality/** and are
# included by the grouped tests/quality.rs integration target. They use the Rust
# reference harness (src/test_support/reference.rs), which shells out to R /
# Python. A missing reference dependency is a HARD failure (no skipping), so this
# job provisions the full reference stack.
#
# ITERATING ON ONE TEST: do not wait for this job. It is a periodic dashboard
# over the whole grouped quality target, so the loop from "edit one reference
# test" to "see its number" was hours. `focused-rust-proof.yml` now takes an
# `r_packages` input, so a single test can be run with its comparator installed:
#
#   gh workflow run focused-rust-proof.yml --ref main \
#     -f package=gam -f target=integration -f test_binary=quality \
#     -f filters=<test_name> -f r_packages="nnet"      # or "mgcv gamlss survival"
#
# 163 of the 187 files under tests/quality call an R comparator, and without one
# the harness reports REFERENCE_ENV_MISSING -- correctly labelled NOT MEASURED,
# but indistinguishable from a real failure at the run's exit code. Passing
# `r_packages` is what turns that into a verdict. This job remains the authority
# for the SUITE; the fast lane is for iterating on one test.
#
# Philosophy: a test whose assertion FAILS because gam genuinely diverges from
# the mature reference is an honest, useful measurement. This job RUNS every
# quality test (no fail-fast — it collects EVERY failure and a pass/fail/
# compile-error table), and THEN GATES the pipeline red if any test landed in a
# gating bucket (METRIC_OFF/GAM_ERROR/TEST_ERROR/BUILDFAIL). REF_ERROR —
# the reference R/Python environment failing, not gam — is reported but NOT
# gated. Gating is what stops quality regressions from landing on main silently.

on:
  # Periodic dashboard rather than per-commit: building+running the heavy
  # grouped quality target is too expensive to do on every quality-test push, and
  # the concurrent src/ churn would otherwise re-trigger it constantly. The
  # schedule gives a warm-cache run every few hours; dispatch is on-demand.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-quality.yml"

# Do NOT cancel an in-progress run when a new push lands: this job is a slow
# (full R+Python stack install + grouped quality build/run) match-vs-diverge
# DASHBOARD, not a fast gate. Cancelling on every push means it never reaches
# the "Run quality suite" summary. Let each run finish; newer pushes queue.
concurrency:
  group: reference-quality-${{ github.ref }}
  cancel-in-progress: false

# gam#1561 SHARDING. One job used to run all 437 cases serially. With the
# repo's own per-case bound (`.config/nextest.toml`: 600 s by default, up to
# 2400 s for the declared exemptions) a single job's WORST case is the sum of
# every case's bound -- 269,400 s, or 74.8 hours -- against a 6-hour platform
# job cap. The `timeout-minutes: 320` step bound added earlier stops that run
# from destroying its own evidence, but the cases after the bound still never
# execute: the tail is silently never measured, which is why "no case failing
# or unrecorded" has never been satisfiable from one job.
#
# The suite now runs as a matrix. The shard count is DERIVED, not chosen: the
# `plan` job packs the cases into the fewest bins whose summed per-case bounds
# each fit the run step's own `timeout-minutes`, so every shard finishes inside
# its cap even if every one of its cases runs to its bound. At today's bounds
# that is 15 shards of 27-30 cases, each holding at most 18,000 s of bound
# against a 19,200 s cap. The count is a function of the bounds and falls as
# `.config/nextest.toml` tightens them; nothing here is a hand-picked number.
#
# Cases are balanced by BOUND, not by the duration the last run recorded, and
# the difference matters. The last complete run (35534960362) measured 2,414 s
# across all 437 cases -- a mean of 5.5 s against a 600 s bound -- so a plan
# balanced on recorded durations would put every case in one shard and rebuild
# exactly the failure being fixed. A past duration is not an upper bound on a
# future one: the run this issue opens with spent over five hours inside case
# 86/433, a case that had always been fast. Only the bound bounds the future.
# The plan reports the recorded-duration load per shard as well, so the gap
# between the guarantee and the expectation stays visible.
#
# The build happens ONCE and ships its binaries to the shards: the run loop
# executes the pre-built libtest binaries directly and never invokes cargo, so a
# shard needs the reference tool stack and the artifact, not a toolchain or a
# target cache.
#
# The shards do not gate. A shard that exits non-zero would skip the merge job
# through `needs`, which is the evidence-destroying behaviour this is fixing, so
# every shard records outcomes and exits 0; the `merge` job owns the gate, the
# aggregate and the single published record.

jobs:
  plan:
    name: Plan quality shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive the shard assignment from the case list and the per-case bounds
        id: plan
        shell: bash
        run: |
          set -uo pipefail
          # The plan reads three files and nothing else: the tracked case list,
          # the tracked results of the last complete run (for the reported
          # expected load only), and `.config/nextest.toml` for the bounds. The
          # shard budget is read out of THIS workflow's own run step, so the
          # budget the plan packs against and the cap the step enforces are one
          # number and cannot drift.
          if ! python3 - <<'PLAN' > /tmp/shard-plan.tsv
          import csv, json, math, os, re, sys, tomllib

          WORKFLOW = ".github/workflows/reference-quality.yml"
          CASES = "bench/gha_results/reference-quality/quality_cases.txt"
          RESULTS = "bench/gha_results/reference-quality/quality_results.tsv"


          def bound_seconds(timeout, where):
              if not (isinstance(timeout, dict) and "period" in timeout and "terminate-after" in timeout):
                  raise SystemExit(f"{where}: slow-timeout {timeout!r} has no terminate-after, so nextest never kills there")
              period = re.fullmatch(r"(\d+)s", timeout["period"])
              if period is None:
                  raise SystemExit(f"{where}: period {timeout['period']!r} is not a whole number of seconds")
              return int(period.group(1)) * int(timeout["terminate-after"])


          with open(".config/nextest.toml", "rb") as handle:
              profiles = tomllib.load(handle)["profile"]
          default_bound = bound_seconds(profiles["default"]["slow-timeout"], "profile.default")
          overrides = []
          for index, override in enumerate(profiles["default"].get("overrides", [])):
              if "slow-timeout" not in override:
                  continue
              where = f"profile.default.overrides[{index}]"
              pattern = re.fullmatch(r"test\(/(.*)/\)", override["filter"])
              if pattern is None:
                  raise SystemExit(f"{where}: filter {override['filter']!r} is not a test(/regex/) filter")
              overrides.append((re.compile(pattern.group(1)), bound_seconds(override["slow-timeout"], where)))


          def bound(case):
              return next((seconds for regex, seconds in overrides if regex.search(case)), default_bound)


          # The budget IS the run step's cap. Read it from the workflow rather
          # than restating it, so one edit moves both.
          text = open(WORKFLOW).read()
          marked = re.findall(
              r"^[ \t]*#[ \t]*SHARD BUDGET:[^\n]*\n(?:[ \t]*#[^\n]*\n)*[ \t]*timeout-minutes:[ \t]*(\d+)[ \t]*$",
              text,
              re.M,
          )
          if len(marked) != 1:
              raise SystemExit(
                  f"{WORKFLOW}: the run step's cap must be the one `timeout-minutes:` under a "
                  f"`# SHARD BUDGET:` comment; found {marked}"
              )
          budget = int(marked[0]) * 60

          cases = [line.strip() for line in open(CASES) if line.strip()]
          if not cases:
              raise SystemExit(f"{CASES} lists no cases; the plan has nothing to shard")
          costs = {case: bound(case) for case in cases}
          if max(costs.values()) > budget:
              worst = max(costs, key=costs.get)
              raise SystemExit(
                  f"{worst} has a {costs[worst]}s bound, past the {budget}s shard budget; "
                  "no packing can hold it, so tighten the bound or raise the cap"
              )

          # Longest-processing-time-first into `shards` bins, starting at the
          # information-theoretic floor and growing until every bin fits. LPT is
          # deterministic given the list, and ties break on the case name, so the
          # same tree always yields the same plan.
          total = sum(costs.values())
          shards = max(1, math.ceil(total / budget))
          while True:
              loads = [0] * shards
              assignment = {}
              for case in sorted(cases, key=lambda name: (-costs[name], name)):
                  index = min(range(shards), key=lambda k: (loads[k], k))
                  loads[index] += costs[case]
                  assignment[case] = index + 1
              if max(loads) <= budget:
                  break
              shards += 1

          recorded = {}
          if os.path.exists(RESULTS):
              csv.field_size_limit(1 << 24)
              with open(RESULTS) as handle:
                  for row in csv.DictReader(handle, delimiter="\t"):
                      try:
                          recorded[row["test"]] = int(row["dur_s"])
                      except (KeyError, TypeError, ValueError):
                          continue
          expected = [0] * shards
          counts = [0] * shards
          for case, shard in assignment.items():
              expected[shard - 1] += recorded.get(case, costs[case])
              counts[shard - 1] += 1

          for case in cases:
              print(f"{assignment[case]}\t{case}")

          summary = [
              f"shards={shards} budget={budget}s cases={len(cases)} bound_total={total}s",
              "| shard | cases | bound load | recorded load |",
              "|---|---|---|---|",
          ]
          for index in range(shards):
              summary.append(f"| {index + 1} | {counts[index]} | {loads[index]}s | {expected[index]}s |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("## Quality shard plan\n\n" + "\n".join(summary) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"total={shards}\n")
              handle.write("shards=" + json.dumps(list(range(1, shards + 1))) + "\n")
          print(f"planned {shards} shards over {len(cases)} cases", file=sys.stderr)
          PLAN
          then
            echo "::error::could not derive the shard plan; refusing to run the suite unsharded"
            exit 1
          fi
          sort -k1,1n -k2,2 /tmp/shard-plan.tsv -o /tmp/shard-plan.tsv
          wc -l /tmp/shard-plan.tsv

      - name: Upload the shard plan
        uses: actions/upload-artifact@v4
        with:
          name: quality-shard-plan
          path: /tmp/shard-plan.tsv

  build:
    name: Build quality binaries once
    runs-on: ubuntu-latest
    # The build is the long pole and runs once for every shard. Keep a backstop
    # under the platform's 6-hour job ceiling.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Free runner disk space
        run: |
          set -uo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Cache all dependency crates (not just direct deps) under a shared
          # key so consecutive runs warm-restore the full dependency build (the
          # multi-GB faer/burn/ndarray/arrow chunk). The gam lib + grouped
          # quality binary still rebuild when src/ changes — that is inherent
          # and not cacheable, which is why the trigger below is periodic, not
          # per-commit.
          cache-all-crates: true
          shared-key: reference-quality

      - name: Build quality tests
        shell: bash
        run: |
          set -uo pipefail
          echo "building grouped quality integration target tests/quality.rs"
          # tests/quality.rs includes the moved tests/quality/** modules as one
          # integration target. Build that target once, then the run step executes
          # each libtest case directly so one failure cannot hide later evidence.
          #
          # gam#1082: build the benchmark OPTIMIZED (`release-dev` = opt-level 3,
          # codegen-units=16, no LTO — the fast-compile optimized profile). The
          # default `test` profile compiles the gam crate at opt-level 0 (only its
          # *dependencies* get opt-2 via `[profile.test.package."*"]`), so the
          # benchmark was timing every fit on UNOPTIMIZED gam code — a perf profile
          # the shipped wheel (`release-pypi`, lto=fat opt-3) and CLI (`release`)
          # never run. perf shows the opt-0 hot path is dominated by ndarray
          # per-element bounds/stride checks (`index_checked`, `stride_offset_checked`,
          # `precondition_check`) that the optimizer elides, not by real FLOPs. This
          # makes the quality measurements reflect production-representative code
          # rather than a debug build no user experiences. Convergence and the
          # quality assertions gate the run; quality_1082 also retains its
          # original per-test 360-second runtime requirement.
          cargo build --keep-going --profile release-dev --test quality --test quality_1082 \
            || echo "build reported errors; missing quality binary is flagged BUILDFAIL in the run step"
          # A handful of quality tests (RMST, competing risks) shell out to the
          # real `gam` CLI to exercise the end-to-end formula fit path. The CLI
          # binary was peeled into the `gam-cli` workspace member (#1521), so it
          # is NOT pulled in by `--test quality` and must be built explicitly
          # under the SAME profile — otherwise those tests spawn a nonexistent
          # `target/release-dev/gam` and report TEST_ERROR every run.
          echo "building the gam CLI binary (gam-cli) so CLI-shelling quality tests can spawn it"
          cargo build --keep-going --profile release-dev -p gam-cli --bin gam \
            || echo "gam CLI build reported errors; CLI-shelling quality tests will report TEST_ERROR"

      - name: Archive the quality binaries for the shards
        shell: bash
        run: |
          set -uo pipefail
          # The run loop executes these binaries directly and never calls cargo,
          # so the shards need exactly this archive: both grouped libtest
          # binaries and the CLI some cases spawn. `--keep-going` above may have
          # produced none of them; the archive is still created, and each shard
          # reports BUILDFAIL for every case it was assigned, which is what a
          # missing binary has always meant here.
          mkdir -p /tmp/quality-bin/deps
          find target/release-dev/deps -maxdepth 1 -type f -perm -u+x \
            \( -name 'quality-*' -o -name 'quality_1082-*' \) ! -name '*.*' \
            -exec cp -p {} /tmp/quality-bin/deps/ \; 2>/dev/null || true
          cp -p target/release-dev/gam /tmp/quality-bin/gam 2>/dev/null || true
          ls -l /tmp/quality-bin /tmp/quality-bin/deps || true

      - name: Upload the quality binaries
        uses: actions/upload-artifact@v4
        with:
          name: quality-binaries
          path: /tmp/quality-bin
          if-no-files-found: warn

  quality:
    name: Reference quality vs mature tools (shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      # Never cancel the siblings: each shard holds measurements no other shard
      # can reproduce, and losing them to a neighbour's failure is the reason
      # this suite has never recorded a complete run.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.total }}
      PLAN: /tmp/shard-plan/shard-plan.tsv
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Free runner disk space
        run: |
          set -uo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      # Provision the full mature-tool reference stack (system libs + R + CRAN/
      # Bioconductor/INLA packages + Python + the scientific reference libs).
      # Shared with the Rust CI test shards (test.yml) via one composite action
      # so the two provisioning paths can never drift.
      - name: Install reference tool stack (R + Python mature comparators)
        uses: ./.github/actions/install-reference-tools

      - name: Download the quality binaries
        uses: actions/download-artifact@v4
        with:
          name: quality-binaries
          # Restored where the run loop already looks (`target/release-dev/deps`
          # for the libtest binaries, `target/release-dev/gam` for the CLI some
          # cases spawn), so the loop below is unchanged by the sharding.
          path: target/release-dev

      - name: Download the shard plan
        uses: actions/download-artifact@v4
        with:
          name: quality-shard-plan
          path: /tmp/shard-plan

      - name: Make the quality binaries executable
        shell: bash
        run: |
          set -uo pipefail
          # upload-artifact does not preserve the executable bit.
          chmod +x target/release-dev/deps/* target/release-dev/gam 2>/dev/null || true
          ls -l target/release-dev target/release-dev/deps || true

      - name: Run quality suite (resilient + streaming; full per-test capture)
        # gam#1561: the platform's 6-hour JOB cap kills every later step, so a run that
        # outlived it published nothing and its measured cases were discarded (85 of
        # them on one run). A STEP bound under that cap stops only this loop; the
        # always() aggregate, upload and publish steps then record what was measured,
        # with completeness=INCOMPLETE set by the loop's own bookkeeping.
        #
        # SHARD BUDGET: the `plan` job reads the number below and packs each
        # shard's summed per-case bounds to fit inside it, so the cap the step
        # enforces and the budget the plan packs against are one number.
        timeout-minutes: 320
        shell: bash
        run: |
          # GitHub's `shell: bash` runs with `-e`, which would abort this step at
          # the FIRST diverging/failing test (cargo test returns nonzero) before
          # the streaming loop and exit 0. Turn `-e` OFF: per-test failures are
          # the expected, tolerated outcome here; we classify and stream them.
          set +e -u -o pipefail
          pass=0; metricoff=0; gamerr=0; referr=0; testerr=0; bf=0; timeouterr=0
          # REF_ERROR among comparators the job GUARANTEES are installed (the
          # install-reference-tools action hard-fails if mgcv/gamlss/survival do
          # not load). For those tests a lost reference is a genuine breakage, not the
          # tolerated "optional native tool missing" case (INLA/scoringRules/PyMC),
          # so it must gate the run rather than be absorbed by the 25% global floor.
          guaranteed_referr=0
          # EVERYTHING the run produced lands under one directory that is uploaded
          # wholesale: the full per-test stdout+stderr logs (no tail truncation),
          # a rich un-truncated TSV, and a JSONL stream. The job-summary table and
          # the totals are a VIEW on top of this complete captured data, never a
          # lossy replacement for it.
          OUT=/tmp/quality-report
          rm -rf "$OUT"; mkdir -p "$OUT/logs"
          RES="$OUT/quality_results.tsv"
          JSONL="$OUT/quality_results.jsonl"
          discovery_error=0
          # MEASURED vs NOT MEASURED. `measured=1` means libtest ENUMERATED the
          # suite from a real binary, so the rows below are observations of the
          # quality tests. Both fallback paths (no binary, or a binary that lists
          # zero cases) synthesise a ONE-ELEMENT pseudo-suite so the run still
          # reports something readable -- but that single row is a report ABOUT
          # the job, not a measurement OF the suite, and everything downstream
          # that treats it as one is wrong. This flag is what tells them apart.
          measured=1
          # gam#1082: the quality target is built under the `release-dev` profile
          # (see the build step), so its binary lands in target/release-dev/deps.
          tests=()
          declare -A test_binary test_discovery_errors
          for target in quality quality_1082; do
            bin=$(find target/release-dev/deps -maxdepth 1 -type f -perm -u+x -name "$target-*" ! -name '*.*' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
            target_tests=()
            if [ -n "$bin" ] && [ -x "$bin" ]; then
              if "$bin" --list > "$OUT/$target-list.txt" 2> "$OUT/$target-list.stderr"; then
                mapfile -t target_tests < <(sed -n 's/: test$//p' "$OUT/$target-list.txt")
              fi
              if [ "${#target_tests[@]}" -eq 0 ]; then
                discovery_error=1
                measured=0
                target_tests=("${target}_discovery")
                test_discovery_errors["${target}_discovery"]=1
              fi
            else
              measured=0
              target_tests=("$target")
            fi
            for t in "${target_tests[@]}"; do
              tests+=("$t")
              test_binary["$t"]="$bin"
            done
          done
          if [ "$measured" -eq 1 ]; then
            printf '%s\n' "${tests[@]}" > "$OUT/quality_cases.txt"
          fi
          # SHARD FILTER. `plan` assigned every case of the tracked list to a
          # shard; this job runs only the ones assigned to it. The full
          # enumeration was written above, before this filter, because the merge
          # job's completeness denominator is the suite, not the shard.
          #
          # A case the live binaries enumerate that the plan never saw (a test
          # added since the tracked list was written) is spread by its position
          # among the sorted unplanned names, so it lands on exactly one shard
          # and is never dropped for being new. A planned case the binaries no
          # longer enumerate simply does not run; the merge job reports it as a
          # case the plan expected and the suite did not produce.
          declare -A plan_shard
          while IFS=$'\t' read -r planned_shard planned_case; do
            plan_shard["$planned_case"]="$planned_shard"
          done < "$PLAN"
          mine=(); unplanned=()
          for t in "${tests[@]}"; do
            if [ -n "${plan_shard[$t]:-}" ]; then
              if [ "${plan_shard[$t]}" = "$SHARD_INDEX" ]; then mine+=("$t"); fi
            else
              unplanned+=("$t")
            fi
          done
          if [ "${#unplanned[@]}" -gt 0 ]; then
            spread=0
            while IFS= read -r t; do
              if [ $(( spread % SHARD_TOTAL + 1 )) -eq "$SHARD_INDEX" ]; then mine+=("$t"); fi
              spread=$((spread+1))
            done < <(printf '%s\n' "${unplanned[@]}" | LC_ALL=C sort)
            echo "shard $SHARD_INDEX: ${#unplanned[@]} case(s) are not in the plan; spread across the $SHARD_TOTAL shards by sorted position"
          fi
          tests=(${mine[@]+"${mine[@]}"})
          echo "shard $SHARD_INDEX/$SHARD_TOTAL runs ${#tests[@]} of the enumerated cases"
          # PER-CASE BOUND. SPEC permits deadlines in tests, and libtest has none per
          # test, so one non-terminating case used to consume the whole job: run
          # 34646487573 spent over 5 hours inside case 86/433
          # (multinomial_recovers_decision_boundary_on_held_out_split) until GitHub's
          # 6-hour job limit cancelled the run; 347 cases never executed and nothing
          # was published. The bound is the one this repo already states for every
          # test in `.config/nextest.toml`: the default profile's `slow-timeout`
          # (period x terminate-after), the first `[[profile.default.overrides]]`
          # exemption whose filter names the case, and `[profile.issue-1082]` for the
          # #1082 acceptance binary. An override this runner cannot evaluate refuses
          # the run instead of applying a bound nextest would not.
          # Every case that has a binary to execute gets a bound, whether or not
          # the other target enumerated: `measured` drops to 0 when EITHER binary is
          # missing while the surviving target's cases still run below.
          declare -A test_bound
          for t in "${tests[@]}"; do
            if [ -z "${test_binary[$t]}" ]; then
              continue
            elif [[ "${test_binary[$t]}" == */quality_1082-* ]]; then
              printf 'quality_1082\t%s\n' "$t"
            else
              printf 'quality\t%s\n' "$t"
            fi
          done > "$OUT/quality_case_targets.tsv"
          if ! python3 - "$OUT/quality_case_targets.tsv" > "$OUT/quality_case_bounds.tsv" <<'PY'
          import re
          import sys
          import tomllib

          with open(".config/nextest.toml", "rb") as handle:
              profiles = tomllib.load(handle)["profile"]


          def bound_seconds(timeout, where):
              if not (isinstance(timeout, dict) and "period" in timeout and "terminate-after" in timeout):
                  raise SystemExit(f"{where}: slow-timeout {timeout!r} has no terminate-after, so nextest never kills there")
              period = re.fullmatch(r"(\d+)s", timeout["period"])
              if period is None:
                  raise SystemExit(f"{where}: period {timeout['period']!r} is not a whole number of seconds")
              return int(period.group(1)) * int(timeout["terminate-after"])


          default_bound = bound_seconds(profiles["default"]["slow-timeout"], "profile.default")
          issue_1082_bound = bound_seconds(profiles["issue-1082"]["slow-timeout"], "profile.issue-1082")
          overrides = []
          for index, override in enumerate(profiles["default"].get("overrides", [])):
              if "slow-timeout" not in override:
                  continue
              where = f"profile.default.overrides[{index}]"
              pattern = re.fullmatch(r"test\(/(.*)/\)", override["filter"])
              if pattern is None:
                  raise SystemExit(f"{where}: filter {override['filter']!r} is not a test(/regex/) filter")
              overrides.append((re.compile(pattern.group(1)), bound_seconds(override["slow-timeout"], where)))

          with open(sys.argv[1]) as handle:
              for line in handle:
                  target, test = line.rstrip("\n").split("\t", 1)
                  if target == "quality_1082":
                      bound = issue_1082_bound
                  else:
                      bound = next((seconds for regex, seconds in overrides if regex.search(test)), default_bound)
                  print(f"{test}\t{bound}")
          PY
          then
            echo "::error::could not derive per-case bounds from .config/nextest.toml; refusing to run the suite unbounded"
            exit 1
          fi
          while IFS=$'\t' read -r bounded_test bound_s; do
            test_bound["$bounded_test"]="$bound_s"
          done < "$OUT/quality_case_bounds.tsv"
          N=${#tests[@]}; i=0
          # Tab-separated, one header row, FULL (un-truncated) metric column so
          # every captured quality figure for every test is preserved verbatim.
          printf 'idx\toutcome\tcause\ttest\trc\tdur_s\tsub_passed\tsub_failed\tmetric\treason\n' > "$RES"
          : > "$JSONL"
          {
            echo "## Reference quality suite"
            echo ""
            echo "Each row is one exact libtest case from the \`quality\` or \`quality_1082\`"
            echo "integration binary. Synthetic and \`_on_real_data\` arms are timed"
            echo "and classified independently, so grouping does not hide an individual"
            echo "test inside one aggregate invocation. The \`outcome\` says exactly WHAT happened — it never collapses"
            echo "distinct situations into one vague word:"
            echo ""
            echo "- \`PASS\` — met the quality bar."
            echo "- \`METRIC_OFF\` — gam ran and produced output, but a quality metric"
            echo "  missed its bound (an honest accuracy/calibration finding, NOT an error)."
            echo "- \`GAM_ERROR\` — gam itself errored: the fit crashed, refused, or"
            echo "  failed to converge (no usable output)."
            echo "- \`REF_ERROR\` — the mature reference tool failed or is missing"
            echo "  (R/Python package, system lib, namespace, or its script) — not gam."
            echo "- \`TEST_ERROR\` — the test/harness setup is wrong (bad data, missing"
            echo "  fixture, mismatched column lengths) — fix the test, not gam."
            echo "- \`TIMEOUT\` — the case ran past its per-test bound from"
            echo "  \`.config/nextest.toml\` and was stopped before libtest reported (no verdict)."
            echo ""
            echo "Full per-test logs + an un-truncated metric TSV + a JSONL stream are"
            echo "in the \`quality-results\` artifact."
            echo ""
            echo "| # | test | outcome | cause | sub p/f | dur | metrics | reason |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in "${tests[@]}"; do
            bin="${test_binary[$t]}"
            i=$((i+1))
            outcome=""; cause=""; reason=""; rc=0
            echo "::group::[$i/$N] $t"
            # Sanitize the log FILENAME: Rust test paths contain '::', which
            # upload-artifact rejects (colon is invalid on NTFS). Keep $t intact
            # for the test filter; only the on-disk filename is rewritten.
            tsafe="${t//:/_}"
            log="$OUT/logs/$tsafe.log"
            start=$SECONDS
            if [ "${test_discovery_errors[$t]:-0}" -eq 1 ]; then
              outcome=TEST_ERROR; cause=test_discovery; rc=-1
              reason="quality binary listed zero libtest cases"
              echo "$reason" > "$log"
            elif [ -z "$bin" ] || [ ! -x "$bin" ]; then
              # No binary => the build step couldn't compile this test.
              outcome=BUILDFAIL; rc=-1
              echo "no executable binary found for grouped quality target — the build step could not compile it" > "$log"
            else
              # Execute the pre-built binary directly — no cargo, no rebuild.
              # Production convergence remains a mathematical certificate; the
              # harness bounds each case by its per-case bound derived above (the
              # #1082 binary keeps its 360-second acceptance budget through
              # `[profile.issue-1082]`). `timeout` signals the case's whole process
              # group, so a comparator child the case spawned is stopped with it.
              "timeout" "${test_bound[$t]}s" "$bin" --exact "$t" --nocapture --test-threads=1 > "$log" 2>&1
              rc=$?
            fi
            dur=$((SECONDS-start))
            # Sub-test tallies from the libtest summary line in this binary's log.
            res_line=$(grep -aE '^test result:' "$log" | tail -1)
            sub_passed=$(printf '%s' "$res_line" | grep -oaE '[0-9]+ passed' | grep -oaE '[0-9]+' | head -1); sub_passed=${sub_passed:-0}
            sub_failed=$(printf '%s' "$res_line" | grep -oaE '[0-9]+ failed' | grep -oaE '[0-9]+' | head -1); sub_failed=${sub_failed:-0}
            # ALL numeric quality figures THE TEST printed, un-truncated. The full
            # log keeps everything regardless; this column is the structured,
            # greppable distillation of every metric the test printed.
            #
            # Two filters keep it to the test's own figures. Run 35301501610's
            # PASS row gam_multinomial_smooth_by_factor_recovers_truth captured
            # 176,202 chars of optimizer trace here. That broke the Aggregate
            # step's csv reader, whose field limit is 131,072.
            # - gam's logger writes `[INFO] ...`/`[WARN] ...` lines; the quality tests
            #   print their own figures with println!, untagged. Each line is cut at
            #   its first logger tag, which drops the per-iteration trace (`loglik=`
            #   every cycle) and keeps a `test <name> ... ` prefix that precedes it.
            # - A name must start at a token boundary (not after a letter or digit)
            #   and end at one (not before a letter), so `ess` no longer matches
            #   inside `hessian_qp_elapsed=` and `acc` no longer matches inside
            #   `accepted_step_inf=`. `ci`/`se` cover the `ci_*`/`se_*` names. A
            #   `_` still counts as a boundary, so `gam_rmse=` still yields `rmse=`.
            # tests/misc/misc/quality_workflow_classifier_test.rs runs this line on
            # a fixture log.
            metric=$(sed -E 's/\[(ERROR|WARN|INFO|DEBUG|TRACE)\] .*$//' "$log" 2>/dev/null | grep -oaE '(^|[^A-Za-z0-9])(R2|r2|rmse|mae|rel_l2|l2|auc|deviance|nll|loglik|crps|acc|accuracy|logloss|concordance|c_index|seam|edf|pearson|spearman|coverage|width|bias|frechet|distance|geodesic|rho|ess|rhat|kl|wasserstein|calibration|brier|ci|se)([^A-Za-z][^ ,;)]*)?[=: ]+-?[0-9][0-9.eE+-]*' | sed -E 's/^[^A-Za-z0-9]//' | tr '\n' ' ')
            # A reference tool failing/missing (R/Python package, system lib,
            # namespace, broken generated script) — this is NOT a gam result.
            # REFERENCE_ENV_MISSING is the harness's own canonical marker for this
            # (crates/gam-test-support/src/reference.rs); it already covers both
            # interpreters' import-failure dialects, including `cannot import name`.
            refmarker=$(grep -aE 'REFERENCE_ENV_MISSING|there is no package called|could not find function|Error in library\(|package or namespace load failed|unable to load shared object|cannot open shared object|No module named|ModuleNotFoundError|IndentationError|reference .* body failed' "$log" | head -1)
            # First panic: "<thread> panicked at <file:line>:" then the WHOLE
            # message, not its first line.
            #
            # A Rust panic message is as many lines as the panicking code
            # formatted. `assert_eq!` writes three — `assertion `left == right`
            # failed: <msg>`, then `  left: <l>`, then ` right: <r>` — and the
            # two values are the only record of what the fit actually reported.
            # Taking one line dropped them: run 35596444985's row for
            # families::quality_vs_vgam_multinomial_softmax::gam_multinomial_softmax_recovers_true_simplex
            # carries "class 0 must carry one independent λ per (smooth term,
            # penalty) (2 double-penalty terms ⇒ 4)" and NOT the count the
            # driver reported, which is the single fact needed to decide whether
            # the driver or the test is wrong.
            #
            # The message ends where the next section begins. libtest and the
            # panic runtime start those sections at column 0 with a known set of
            # openers, and every continuation line of a panic message is either
            # indented or plain prose, so the block is closed by the first line
            # that is empty or opens one of them.
            panicmsg=$(awk '
              /panicked at/ && !seen {
                seen = 1
                out = $0
                while ((getline line) > 0) {
                  if (line == "" ||
                      line ~ /^note:/ ||
                      line ~ /^stack backtrace:/ ||
                      line ~ /^thread .* panicked at/ ||
                      line ~ /^test / ||
                      line ~ /^(-{4}|={4})/ ||
                      line ~ /^failures:/ ||
                      line ~ /^error(\[[A-Za-z0-9]+\])?:/) {
                    break
                  }
                  out = out (first++ ? " " : " :: ") line
                }
                print out
                exit
              }' "$log")
            # A test declared `-> Result<(), E>` fails by RETURNING an error and
            # never panics: libtest prints `Error: <Debug of E>` at column 0 in
            # the failure section. The capture above sees nothing, so the row
            # falls through to the `nonzero exit $rc` fallback and records no
            # verdict at all — which is what run 35628754711's row for
            # misc::fit_quality_stress::hifreq_tensor_k4 says, and every probe in
            # that file returns `Result<(), String>`, so the whole file is dark.
            # Read that line instead when there is no panic; the classifier below
            # then judges its text on the same rules, so a returned gam fit error
            # still lands in GAM_ERROR and a returned quality miss in METRIC_OFF.
            if [ -z "$panicmsg" ]; then
              panicmsg=$(grep -aE '^Error: ' "$log" | head -1)
            fi
            # gam-side fit errors (the fit crashed/refused/failed to converge).
            # `LayoutError`/`identifiability audit` are gam's OWN model-layout /
            # identifiability verdicts — they must classify as GAM_ERROR even
            # though their message contains the phrase "rows, expected" (which
            # used to be matched by the broader TEST_ERROR rule below and stole
            # them; that rule is now harness-origin-only).
            #
            # The list is keyed on gam's OWN error VARIANTS, and it was missing
            # three of them that no wrapper puts an `IntegrationFailed` in front
            # of. Measured on run 30460836905 re-run at `b8745892a`, these three
            # rows were counted as METRIC_OFF -- i.e. reported as "gam ran and
            # produced output, a quality metric missed its bound" -- when gam had
            # in fact refused to produce a fit at all:
            #
            #   Optimization { context: "fit_custom_family outer smoothing", ... }
            #     misc::quality_vs_simplex_dirichlet_regression
            #   OrderFailures { kind: GaussianMixture, failures: [...] }
            #     misc::quality_mixture_rung_vs_reference
            #   NonConvergence { context: "SPD Fréchet mean", iterations: 18, ... }
            #     misc::quality_vs_scipy_spd_frechet_mean
            #
            # Both buckets gate, so this never changed the run's red/green. It
            # changed the only thing the buckets exist for: the METRIC_OFF count
            # is the suite's headline claim about gam's ACCURACY, and a refusal
            # silently inflating it makes gam look less accurate than it is while
            # hiding a non-convergence. The three variants are matched with their
            # trailing `{` so a test's prose about its own reference computation
            # ("... Newton refit did not converge") cannot be swept in.
            # A sixth missing variant, from the SAME family as the two above and
            # measured on run 30460836905 (headSha 7b4d762d8):
            #
            #   fit_tensor_surface: finite REML optimum is value-resolved but not
            #   an isolated stationary point (LowerBoundary)
            #     misc::quality_llm_weekday_circle
            #
            # That is gam REFUSING to certify an outer-REML optimum -- a fit
            # failure -- yet it landed in METRIC_OFF, i.e. it was reported as
            # "gam fitted and a quality metric missed its bound". The existing
            # `RemlOptimizationFailed|REML smoothing optimization` alternatives
            # do not cover it: this refusal is raised by the term/solve layer
            # (`gam-terms/src/structure/anova_atom.rs`, `grid_spline_2d.rs`,
            # `gam-solve/src/spline_scan.rs`, `residual_cascade.rs`,
            # `gam-sae/src/identifiability.rs`) with its own wording. All five
            # sites share the literal phrase `REML optimum is value-resolved`,
            # which is gam's own prose and cannot be produced by a test
            # describing its reference tool, so that phrase is the key.
            # A seventh missing variant, and the one that shows the rule this
            # list needs. `EstimationError::CustomFamilyFit` renders as
            # `Custom-family fit failed: {0}`
            # (crates/gam-problem/src/estimation_error.rs:500) -- gam refusing to
            # produce a fit. On run 3561ea0026 four rows carried that text and the
            # list matched only ONE of them, and by accident: the Dirichlet row
            # also wrapped an `Optimization { context:` and landed in GAM_ERROR,
            # while `quality_vs_synthetic_multinomial_deviance_identity`,
            # `quality_vs_vgam_multinomial_smooth_by_factor` and
            # `quality_vs_vgam_multinomial_softmax::..._on_real_data` -- whose
            # inner text is `outer smoothing optimization failed certified-fit
            # validation` -- were all reported as METRIC_OFF, i.e. as gam fitting
            # and missing a quality bound. One error variant classified two ways
            # depending on what wrapped it. The variant's own rendering is the key,
            # as it is for the six above it: a test describing its reference tool
            # cannot produce gam's own prose.
            gamfit_re='IntegrationFailed|InvalidConfig|IdentifiabilityFailure|LayoutError|identifiability audit|Invalid input|could not broadcast|Newton step|transformation fit failed|workflow survival baseline failed|RemlOptimizationFailed|REML smoothing optimization|Custom-family fit failed|Optimization \{ context:|OrderFailures \{|NonConvergence \{|REML optimum is value-resolved|Fit\((Raised|Estimation|Context|Annotated|CustomFamily|SurvivalMarginalSlope|Workflow)'
            if [ "$outcome" = TEST_ERROR ]; then
              testerr=$((testerr+1))
            elif [ "$outcome" = BUILDFAIL ]; then
              cause=build; reason=$(head -1 "$log"); bf=$((bf+1))
            elif [ "$rc" -eq 0 ]; then
              outcome=PASS; cause=ok; reason=""; pass=$((pass+1))
            elif [ "$rc" -eq 124 ]; then
              # `timeout` stopped the case at its per-case bound before libtest
              # reported. No verdict exists, so a partial log's panic text or
              # reference marker is not evidence of anything; the one known fact is
              # that the case ran past the repo's own per-test hang threshold.
              outcome=TIMEOUT; cause=per_test_bound
              reason="exceeded the ${test_bound[$t]}s per-case bound from .config/nextest.toml"
              timeouterr=$((timeouterr+1))
            elif [ -n "$refmarker" ]; then
              outcome=REF_ERROR; cause=reference_tool; reason="$refmarker"; referr=$((referr+1))
              # If the lost reference is one the job guarantees present, this REF_ERROR
              # is a real breakage masking a lost gam-vs-reference comparison.
              #
              # Classify by what the test's comparator ACTUALLY LOADS, not by what the
              # test is CALLED. The previous form was `case "$t" in *mgcv*|...`, i.e. a
              # substring match on the test NAME, and it had a live hole: a test whose
              # comparator body is `suppressMessages(library(mgcv))` but whose name does
              # not contain "mgcv" was counted as zero. Measured on the last complete
              # run (30460836905): `families::quality_vs_synthetic_multinomial_deviance_
              # identity` REF_ERRORed with an mgcv comparator, `guaranteed_referr`
              # counted 0, and the "100% coverage for guaranteed comparators" gate
              # passed while a guaranteed reference was in fact broken.
              #
              # A gate keyed on a naming convention only holds while the convention
              # does. Read the source instead: the libtest name is
              # `<dir>::<file-stem>::<fn>`, which maps directly onto
              # `tests/quality/<dir>/<file-stem>.rs`.
              qdir="${t%%::*}"
              qrest="${t#*::}"
              qfile="${qrest%%::*}"
              qsrc="$GITHUB_WORKSPACE/tests/quality/$qdir/$qfile.rs"
              if [ -f "$qsrc" ]; then
                if grep -qaE 'library\((mgcv|gamlss|survival)\)' "$qsrc"; then
                  guaranteed_referr=$((guaranteed_referr+1))
                  echo "  guaranteed-comparator REF_ERROR: $t (source $qdir/$qfile.rs loads a hard-verified R reference)"
                fi
              else
                # The name did not resolve to a source file, so we cannot tell which
                # comparator was lost. Count it: an unclassifiable REF_ERROR must not
                # be silently treated as the optional-tool case, which is the failure
                # this whole block exists to prevent.
                guaranteed_referr=$((guaranteed_referr+1))
                echo "  guaranteed-comparator REF_ERROR (UNRESOLVED SOURCE, counted conservatively): $t -> $qsrc"
              fi
            elif printf '%s' "$panicmsg" | grep -qaE 'gam-test-support/src/reference\.rs|No such file or directory'; then
              # Test/harness setup defect (bad data, missing fixture, length
              # mismatch). Gated on the panic ORIGINATING in the harness
              # (src/test_support/reference.rs — where write_columns_csv asserts
              # equal column lengths) rather than on the bare phrases
              # "rows, expected"/"reference column", which also appear in gam's
              # own identifiability/layout error messages and were misfiling
              # genuine GAM_ERRORs as TEST_ERROR.
              outcome=TEST_ERROR; cause=test_setup; reason="$panicmsg"; testerr=$((testerr+1))
            elif printf '%s' "$panicmsg" | grep -qaE "$gamfit_re" || printf '%s' "$panicmsg" | grep -qaE 'panicked at src/'; then
              outcome=GAM_ERROR; cause=gam_fit_failed; reason="$panicmsg"; gamerr=$((gamerr+1))
            else
              # gam produced output; a quality metric missed its bound. Honest
              # accuracy/calibration finding — not an error.
              outcome=METRIC_OFF; cause=quality_metric; reason="${panicmsg:-nonzero exit $rc}"; metricoff=$((metricoff+1))
            fi
            # Sanitize to single-line cells for the TSV / markdown table; the full
            # untouched text always remains in the per-test log artifact. GitHub's
            # TSV renderer treats a bare ASCII double quote as the start of CSV
            # quoting, so normalize quotes too instead of producing an "Illegal
            # quoting" error that makes the tracked table unsearchable.
            metric_clean=$(printf '%s' "$metric" | tr '\t|"' "  '" | tr -s ' ')
            # No length cut. The 400-character one that used to be here had
            # nothing left to protect and was losing verdicts. The consumer,
            # bench/aggregate_quality_gate_1561.py, measures the longest field in
            # the file and raises `csv.field_size_limit` to it, so no cell length
            # can break the read; the job-summary table below applies its own
            # 200-character cut, so the rendered table is capped independently;
            # and the per-test log artifact was always the complete copy. What
            # the cut did do was truncate every long refusal before its verdict:
            # `RemlDidNotConverge` states its bound and rung early but names WHY
            # it stopped — budget exhaustion, line-search collapse, cost stall,
            # or a failed post-solve certificate — and how many outer iterations
            # it ran, after character 400, and those two fields are the whole
            # difference between "the optimizer stopped short" and "the optimizer
            # could not descend". The message's own end is the bound; the awk
            # above stops at it.
            reason_clean=$(printf '%s' "$reason" | tr '\t\n|"' "   '" | tr -s ' ')
            printf '%d\t%s\t%s\t%s\t%d\t%d\t%s\t%s\t%s\t%s\n' \
              "$i" "$outcome" "$cause" "$t" "$rc" "$dur" "$sub_passed" "$sub_failed" "$metric_clean" "$reason_clean" >> "$RES"
            printf '{"idx":%d,"outcome":"%s","cause":"%s","test":"%s","rc":%d,"dur_s":%d,"sub_passed":%s,"sub_failed":%s}\n' \
              "$i" "$outcome" "$cause" "$t" "$rc" "$dur" "$sub_passed" "$sub_failed" >> "$JSONL"
            printf '| %d | %s | %s | %s | %s/%s | %ss | %s | %s |\n' \
              "$i" "$t" "$outcome" "$cause" "$sub_passed" "$sub_failed" "$dur" "$metric_clean" "${reason_clean:0:200}" >> "$GITHUB_STEP_SUMMARY"
            echo "[$i/$N] $outcome/$cause  $t  rc=$rc dur=${dur}s sub=${sub_passed}p/${sub_failed}f"
            [ -n "$metric_clean" ] && echo "  metrics: $metric_clean"
            [ -n "$reason_clean" ] && echo "  reason:  $reason_clean"
            # Echo the FULL per-test log into the (collapsible) job-log group too —
            # no 20-line tail. The artifact is the canonical complete copy in case
            # GitHub caps the job log.
            echo "----- full log: $t -----"; cat "$log"; echo "----- end log: $t -----"
            echo "::endgroup::"
          done
          # COMPLETENESS MARKER. A truncated run and a whole one are
          # indistinguishable from the TSV alone -- a prefix of a measurement
          # just looks like a smaller suite -- and that is exactly how a
          # 60-of-456 fragment became the tracked artifact and got read as the
          # suite's verdict. `N` is the count libtest enumerated BEFORE the loop,
          # so comparing it against rows actually written is an honest
          # self-report that survives into the published directory.
          #
          # `COMPLETE` is denominated in `N`, and `N` is the ENUMERATED count --
          # so on the fallback paths, where `N` is the synthetic 1, one written
          # row satisfies `rows_written == N` and the marker read `COMPLETE`.
          # That is how a BUILDFAIL run (`enumerated=1 rows_written=1
          # completeness=COMPLETE`, run 30702349083) published itself over a run
          # that had measured 456 tests. A row count can only certify
          # completeness RELATIVE to a real enumeration; when there was no
          # enumeration there is nothing to be complete with respect to, and the
          # marker must say NOT_MEASURED rather than borrow the vocabulary of a
          # measured run (#2744).
          rows_written=$(( $(wc -l < "$RES") - 1 ))
          if [ "$measured" -eq 0 ]; then
            completeness=NOT_MEASURED
          elif [ "$rows_written" -eq "$N" ]; then
            completeness=COMPLETE
          else
            completeness=PARTIAL
          fi
          printf 'completeness\t%s\nmeasured\t%s\nenumerated\t%d\nrows_written\t%d\n' \
            "$completeness" "$( [ "$measured" -eq 1 ] && echo true || echo false )" \
            "$N" "$rows_written" > "$(dirname "$RES")/completeness.tsv"
          echo "COMPLETENESS=$completeness enumerated=$N rows_written=$rows_written"
          # Hand the verdict to later steps: the publish step must not overwrite
          # the tracked in-tree record with a run that measured nothing.
          if [ "$measured" -eq 1 ]; then
            echo "QUALITY_MEASURED=true" >> "$GITHUB_ENV"
          else
            echo "QUALITY_MEASURED=false" >> "$GITHUB_ENV"
          fi
          {
            echo ""
            echo "### Totals"
            echo ""
            echo "| outcome | count | meaning |"
            echo "|---|---|---|"
            echo "| PASS | $pass | met the quality bar |"
            echo "| METRIC_OFF | $metricoff | gam ran; a quality metric missed its bound |"
            echo "| GAM_ERROR | $gamerr | gam fit crashed / refused / failed to converge |"
            echo "| REF_ERROR | $referr | reference tool failed or missing |"
            echo "| TEST_ERROR | $testerr | test/harness setup defect |"
            echo "| BUILDFAIL | $bf | did not compile |"
            echo "| TIMEOUT | $timeouterr | stopped at its per-test bound (\`.config/nextest.toml\`) |"
            echo "| **total** | **$N** | |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pass=$pass metric_off=$metricoff gam_error=$gamerr ref_error=$referr test_error=$testerr build_fail=$bf timeout=$timeouterr (of $N)"
          # Hand this shard's counts to the merge job, which owns the gate. A
          # shard cannot decide the suite's red/green: it has seen a slice.
          printf 'pass\t%d\nmetric_off\t%d\ngam_error\t%d\nref_error\t%d\ntest_error\t%d\nbuild_fail\t%d\ntimeout\t%d\nguaranteed_ref_error\t%d\nassigned\t%d\n' \
            "$pass" "$metricoff" "$gamerr" "$referr" "$testerr" "$bf" "$timeouterr" "$guaranteed_referr" "$N" \
            > "$OUT/tallies.tsv"
          # The shard always exits 0. A non-zero exit here would mark the job
          # failed, and a failed matrix job skips the merge job through `needs`
          # -- destroying the evidence of every other shard, which is the exact
          # failure this sharding exists to end. The merge job reads the rows.
          exit 0

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results-shard-${{ matrix.shard }}
          path: /tmp/quality-report
          if-no-files-found: ignore
  merge:
    name: Merge shards, aggregate and publish
    permissions:
      contents: write
      actions: read
    needs: [plan, quality]
    # `always()`: a shard that was cancelled or hit its cap still uploaded the
    # rows it measured, and those are usually the interesting ones. Merging only
    # on success would discard them for the same reason the unsharded job used
    # to discard its tail.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download every shard's results
        uses: actions/download-artifact@v4
        with:
          pattern: quality-results-shard-*
          path: /tmp/quality-shards

      - name: Merge the shards into one suite record
        shell: bash
        run: |
          # Reporting, not gating: `-e` off, as in the run step.
          set +e -u -o pipefail
          merge_root=/tmp/quality-report
          shards_root=/tmp/quality-shards
          rm -rf "$merge_root"; mkdir -p "$merge_root/logs"
          merged_tsv="$merge_root/quality_results.tsv"
          merged_jsonl="$merge_root/quality_results.jsonl"
          # The suite's enumeration is the UNION of what the shards enumerated.
          # Every shard lists the whole binary before filtering to its own slice,
          # so the union is the suite; taking one shard's list would be the same
          # prefix-for-the-whole mistake the completeness marker exists to stop.
          cat "$shards_root"/*/quality_cases.txt 2>/dev/null | LC_ALL=C sort -u > "$merge_root/quality_cases.txt"
          enumerated=$(wc -l < "$merge_root/quality_cases.txt")
          # One shard reporting `measured false` means a binary did not
          # enumerate there, so the union is not a measurement of the suite.
          measured=true
          for marker in "$shards_root"/*/completeness.tsv; do
            [ -f "$marker" ] || continue
            if [ "$(awk -F'\t' '$1=="measured"{print $2}' "$marker")" != "true" ]; then measured=false; fi
          done
          [ -n "$(ls -A "$shards_root" 2>/dev/null)" ] || measured=false
          # Rows, renumbered into one `idx` sequence and deduplicated by test
          # name in shard order. A case two shards both ran would otherwise be
          # counted twice, which would make `rows_written` exceed `enumerated`
          # and read as a bigger suite.
          printf 'idx\toutcome\tcause\ttest\trc\tdur_s\tsub_passed\tsub_failed\tmetric\treason\n' > "$merged_tsv"
          : > "$merged_jsonl"
          shard_tsvs=$(ls -d "$shards_root"/*/quality_results.tsv 2>/dev/null | LC_ALL=C sort)
          # One awk pass over the shards in name order: drop each shard's header
          # row, drop a case a previous shard already reported, and renumber the
          # surviving rows into one `idx` sequence. The duplicate names go to a
          # file so the count below is read, not parsed out of the log.
          : > "$merge_root/duplicate_cases.txt"
          if [ -n "$shard_tsvs" ]; then
            # shellcheck disable=SC2086
            awk -F'\t' -v OFS='\t' -v dup="$merge_root/duplicate_cases.txt" '
              FNR == 1 { next }
              seen[$4]++ { print $4 > dup; next }
              { $1 = ++idx; print }
            ' $shard_tsvs >> "$merged_tsv"
          fi
          duplicates=$(wc -l < "$merge_root/duplicate_cases.txt")
          if [ "$duplicates" -gt 0 ]; then
            while IFS= read -r case_name; do
              echo "::warning::case $case_name was run by more than one shard; kept the first shard's row"
            done < "$merge_root/duplicate_cases.txt"
          fi
          for shard_dir in "$shards_root"/*/; do
            [ -d "$shard_dir" ] || continue
            [ -f "$shard_dir/quality_results.jsonl" ] && cat "$shard_dir/quality_results.jsonl" >> "$merged_jsonl"
            cp -p "$shard_dir"logs/*.log "$merge_root/logs/" 2>/dev/null || true
          done
          rows_written=$(( $(wc -l < "$merged_tsv") - 1 ))
          # Sum the shards' own tallies rather than recounting the merged TSV:
          # the tallies also carry `guaranteed_ref_error`, which is decided per
          # case from its source file inside the run loop and cannot be
          # recovered from an outcome column.
          for name in pass metric_off gam_error ref_error test_error build_fail timeout guaranteed_ref_error assigned; do
            printf '%s\t%d\n' "$name" \
              "$(awk -F'\t' -v k="$name" '$1==k{s+=$2} END{print s+0}' "$shards_root"/*/tallies.tsv 2>/dev/null)"
          done > "$merge_root/tallies.tsv"
          if [ "$measured" != "true" ]; then
            completeness=NOT_MEASURED
          elif [ "$rows_written" -eq "$enumerated" ]; then
            completeness=COMPLETE
          else
            completeness=PARTIAL
          fi
          printf 'completeness\t%s\nmeasured\t%s\nenumerated\t%d\nrows_written\t%d\nshards\t%d\nduplicate_rows\t%d\n' \
            "$completeness" "$measured" "$enumerated" "$rows_written" \
            "$(ls -d "$shards_root"/*/ 2>/dev/null | wc -l)" "$duplicates" > "$merge_root/completeness.tsv"
          echo "MERGED completeness=$completeness enumerated=$enumerated rows_written=$rows_written duplicates=$duplicates"
          cat "$merge_root/completeness.tsv"
          cat "$merge_root/tallies.tsv"
          # The cases the plan expected that no shard produced a row for. A
          # planned case the binaries no longer enumerate is a deleted test; one
          # that is still enumerated and has no row is a shard that did not
          # reach it, which is what PARTIAL means.
          if [ "$rows_written" -ne "$enumerated" ]; then
            echo "----- enumerated but unrecorded -----"
            comm -23 "$merge_root/quality_cases.txt" <(tail -n +2 "$merged_tsv" | cut -f4 | LC_ALL=C sort)
            echo "-------------------------------------"
          fi
          if [ "$measured" = "true" ]; then
            echo "QUALITY_MEASURED=true" >> "$GITHUB_ENV"
          else
            echo "QUALITY_MEASURED=false" >> "$GITHUB_ENV"
          fi

      - name: Gate the suite on the merged outcomes
        shell: bash
        run: |
          set +e -u -o pipefail
          OUT=/tmp/quality-report
          RES="$OUT/quality_results.tsv"
          tally() { awk -F'\t' -v k="$1" '$1==k{print $2}' "$OUT/tallies.tsv"; }
          pass=$(tally pass); metricoff=$(tally metric_off); gamerr=$(tally gam_error)
          referr=$(tally ref_error); testerr=$(tally test_error); bf=$(tally build_fail)
          timeouterr=$(tally timeout); guaranteed_referr=$(tally guaranteed_ref_error)
          N=$(awk -F'\t' '$1=="enumerated"{print $2}' "$OUT/completeness.tsv")
          completeness=$(awk -F'\t' '$1=="completeness"{print $2}' "$OUT/completeness.tsv")
          {
            echo ""
            echo "### Totals (merged over the shards)"
            echo ""
            echo "| outcome | count | meaning |"
            echo "|---|---|---|"
            echo "| PASS | $pass | met the quality bar |"
            echo "| METRIC_OFF | $metricoff | gam ran; a quality metric missed its bound |"
            echo "| GAM_ERROR | $gamerr | gam fit crashed / refused / failed to converge |"
            echo "| REF_ERROR | $referr | reference tool failed or missing |"
            echo "| TEST_ERROR | $testerr | test/harness setup defect |"
            echo "| BUILDFAIL | $bf | did not compile |"
            echo "| TIMEOUT | $timeouterr | stopped at its per-test bound (\`.config/nextest.toml\`) |"
            echo "| **enumerated** | **$N** | completeness: $completeness |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pass=$pass metric_off=$metricoff gam_error=$gamerr ref_error=$referr test_error=$testerr build_fail=$bf timeout=$timeouterr (of $N)"
          # An INCOMPLETE suite is itself a gating failure. The acceptance of
          # #1561 is "no case failing OR UNRECORDED", and a run that measured a
          # prefix cannot report green on the strength of the prefix.
          if [ "$completeness" != "COMPLETE" ]; then
            echo "::error::Reference Quality Suite INCOMPLETE ($completeness): $(awk -F'\t' '$1=="rows_written"{print $2}' "$OUT/completeness.tsv") of $N enumerated cases produced a row. The unrecorded cases are listed in the merge step."
            { echo ""; echo "### Gate: FAILED (incomplete)"; echo ""; echo "completeness=$completeness"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # GATE the pipeline. The suite is the ONLY end-to-end measurement of gam
          # quality vs the mature standard tools; if it cannot go red, every quality
          # regression lands on main silently (the #1087 meta-bug). We ran ALL N
          # tests above (no fail-fast — every failure is collected and streamed);
          # now we exit non-zero if ANY test landed in a GATING bucket, after
          # printing exactly which ones did and why.
          #
          # Gating buckets = genuine gam/test defects + honest quality misses:
          #   METRIC_OFF  gam ran but a quality metric missed its bound
          #   GAM_ERROR   gam fit crashed / refused / failed to converge
          #   TEST_ERROR  test/harness setup defect
          #   BUILDFAIL   did not compile
          #   TIMEOUT     ran past its per-test bound; no verdict at all
          # NOT gated: REF_ERROR — the reference R/Python environment failed or is
          # missing (not a gam result; tracked separately, #1070/#1071). It is
          # reported below but never masks or triggers the gam-side gate.
          gating=$((metricoff + gamerr + testerr + bf + timeouterr))
          if [ "$gating" -gt 0 ]; then
            echo ""
            echo "::error::Reference Quality Suite FAILED: ${gating} test(s) in gating buckets (METRIC_OFF=${metricoff} GAM_ERROR=${gamerr} TEST_ERROR=${testerr} BUILDFAIL=${bf} TIMEOUT=${timeouterr}); REF_ERROR=${referr} not gated."
            echo "----- gating failures (outcome  test  reason) -----"
            # Reprint the offending rows from the TSV (skip header; field 2 = outcome).
            awk -F'\t' 'NR>1 && $2!="PASS" && $2!="REF_ERROR" {printf "  %-11s %s\n    %s\n", $2, $4, $10}' "$RES"
            echo "---------------------------------------------------"
            {
              echo ""
              echo "### Gate: FAILED"
              echo ""
              echo "${gating} test(s) in gating buckets (METRIC_OFF/GAM_ERROR/TEST_ERROR/BUILDFAIL/TIMEOUT)."
              echo "REF_ERROR (${referr}) is reference-environment, not gated."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # PER-COMPARATOR COVERAGE FLOOR (#1082, GPT-5.5 Pro concern: "quality runs
          # passing without reference coverage"). The 25% global floor below tolerates
          # missing OPTIONAL native references (INLA/scoringRules/PyMC). But the job
          # HARD-VERIFIES that mgcv/gamlss/survival load before running (the
          # install-reference-tools action fails otherwise), so a REF_ERROR on any test
          # backed by one of those is NOT a missing-infra waiver — it is a genuine
          # breakage that silently dropped a gam-vs-mature-tool comparison. Require
          # 100% reference coverage for the guaranteed comparators: a single such
          # REF_ERROR fails the run, no percentage tolerance.
          if [ "$guaranteed_referr" -gt 0 ]; then
            echo ""
            echo "::error::Reference Quality Suite UNTRUSTWORTHY: ${guaranteed_referr} test(s) backed by a GUARANTEED reference (mgcv/gamlss/survival) hit REF_ERROR. Those tools are verified-present before the run, so this is a real reference breakage that dropped a gam-vs-reference comparison — not an optional-tool waiver. 100% coverage is required for guaranteed comparators."
            echo "----- guaranteed-comparator REF_ERROR rows (test  reason) -----"
            awk -F'\t' 'NR>1 && $2=="REF_ERROR" && ($4 ~ /mgcv/ || $4 ~ /gamlss/ || $4 ~ /survival/) {printf "  %s\n    %s\n", $4, $10}' "$RES"
            echo "---------------------------------------------------------------"
            {
              echo ""
              echo "### Gate: FAILED (guaranteed-comparator reference coverage)"
              echo ""
              echo "${guaranteed_referr} test(s) backed by a hard-verified reference (mgcv/gamlss/survival) were REF_ERROR. Those references are guaranteed installed, so the lost comparison is a real breakage; 100% coverage is required for them."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # REFERENCE-COVERAGE FLOOR. REF_ERROR is non-blaming per-test (it is the
          # reference env, not a gam result), but the suite's ENTIRE value is the
          # gam-vs-mature-tool comparison. If the reference environment is broadly
          # broken, almost no comparison actually ran and the suite measured
          # nothing — it must NOT report green merely because the gam side did not
          # crash (the failure mode the #1087 meta-bug warns about). This is an
          # infrastructure failure (tracked #1070/#1071), reported distinctly from
          # a gam-side regression, but it still fails the job: a run cannot be
          # green when more than a quarter of the suite lost its reference.
          if [ "$N" -gt 0 ] && [ $((referr * 4)) -gt "$N" ]; then
            echo ""
            echo "::error::Reference Quality Suite UNTRUSTWORTHY: ${referr}/${N} test(s) lost their reference (>25%); reference environment is broken, so the suite proved almost nothing. Not a gam regression (see #1070/#1071), but the run cannot be green."
            {
              echo ""
              echo "### Gate: FAILED (reference coverage)"
              echo ""
              echo "${referr}/${N} tests were REF_ERROR (>25%). The reference R/Python environment is broken; the gam-vs-reference comparison did not run for most of the suite, so a green result here would be meaningless."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gate: PASSED — every test met its quality bar; guaranteed-comparator reference coverage 100% (mgcv/gamlss/survival REF_ERROR=0); optional-reference REF_ERROR=${referr}/${N} within the 25% floor."
          { echo ""; echo "### Gate: PASSED"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$completeness" != "COMPLETE" ]; then exit 1; fi

      # #1561 aggregate + #2395 power view. The gate above decides red/green from
      # per-test outcomes; this reads the machine-readable [QUALITY_PAIR] lines
      # every test emits and recomputes the whole-suite signed-rank aggregate,
      # plus the paired-panel power table (per-pair resolution, the standard
      # errors pairing recovers, which pairs are RESOLVED worse, and which
      # near-ties are still undecided). `always()` and non-gating on purpose: the
      # gate step exits 1 on a gating bucket, and losing this report on exactly
      # the runs that regressed would hide the numbers that explain the
      # regression. Its exit status is printed, never propagated.
      - name: Aggregate quality pairs (#1561 gate + #2395 paired power)
        if: always()
        shell: bash
        run: |
          # This step reports and does not gate, so `-e` is OFF, as in the run
          # step. Under GitHub's default `bash -e`, a nonzero aggregator exit ended
          # the step before `rc=$?`, before the report was printed and before the
          # exit line. Run 35301501610 failed that way with no output at all; its
          # traceback survived only in the published quality-aggregate.txt.
          set +e -u -o pipefail
          OUT=/tmp/quality-report
          if [ ! -d "$OUT/logs" ]; then
            echo "no per-test logs at $OUT/logs — the run step produced nothing to aggregate"
            exit 0
          fi
          cat "$OUT"/logs/*.log > "$OUT/all-tests.log" 2>/dev/null || true
          report="$OUT/quality-aggregate.txt"
          python3 bench/aggregate_quality_gate_1561.py "$OUT/all-tests.log" > "$report" 2>&1
          rc=$?
          cat "$report"
          {
            echo ""
            echo "### Quality-pair aggregate (#1561) + paired power (#2395)"
            echo ""
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "aggregator exit=${rc} (reported, not gated)"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::bench/aggregate_quality_gate_1561.py exited ${rc}; its output is printed above and saved in quality-aggregate.txt"
          fi

      - name: Upload full quality report (always — survives failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-results
          # The WHOLE report dir: rich un-truncated TSV + JSONL + every per-test
          # stdout/stderr log. "Everything that happened", not just the headlines.
          path: /tmp/quality-report
          if-no-files-found: ignore

      # Track this run's uncompressed numbers in-tree (bench/gha_results/reference-quality).
      # `!cancelled()` rather than `always()` so a FAILED or timed-out run still
      # publishes what it measured -- those numbers are usually the interesting
      # ones -- while a CANCELLED one does not.
      #
      # The distinction is not hypothetical, and the old `always()` is how the
      # tracked artifact got corrupted. `always()` INCLUDES `cancelled`, and this
      # action replaces its subdirectory wholesale, so a run killed part-way
      # overwrites a complete measurement with a prefix of one. Measured on the
      # last eight commits to `bench/gha_results/reference-quality/`, by row count
      # of `quality_results.tsv`:
      #
      #     dbef67293  rows=60   cancelled   <-- became the tracked artifact
      #     c07b33604  rows=457  failure
      #     11de0ca46  rows=457  failure
      #     9a4cfe629  rows=2    failure
      #     a32e1c030  rows=456  failure
      #
      # The 60-row fragment reported `OVERALL 37 pairs, 18 wins / 18 losses,
      # p=0.7428` over 3 categories, replacing the complete run's `OVERALL 157
      # pairs, 75 / 76, p=0.2066` over 6. Nothing in the artifact says it is a
      # fragment, so every reader since took a 59-of-456 sample for the suite.
      #
      # The existing "publishes nothing when the run produced no results" guard
      # does not help: it protects against EMPTY, and a cancelled run is
      # TRUNCATED, not empty. A prefix of a measurement is the one shape that
      # looks exactly like a smaller, better result.
      #
      # This job is `cancel-in-progress: false`, so the cancellations are the
      # 6-hourly schedule overlapping its own runtime rather than a newer push.
      #
      # #2744: the same wholesale replace also let a run that measured NOTHING
      # overwrite one that had measured the suite. A BUILDFAIL run cannot
      # enumerate the grouped binary, so the run step falls back to a synthetic
      # one-element pseudo-suite and writes one `BUILDFAIL` row; that row is a
      # non-empty, self-declared-COMPLETE TSV, so every guard downstream (the
      # action's zero-byte filter, the completeness marker) passed it through and
      # `2d4f1bbfc` replaced run 30691912146's 52-failure breakdown with it. Four
      # consecutive reds each destroyed the previous red's evidence. So the
      # publish is now gated on `QUALITY_MEASURED`, set by the run step from
      # whether libtest actually ENUMERATED the suite: a run that measured
      # nothing publishes nothing and the last measured record survives.
      # `QUALITY_MEASURED` is unset if the run step never executed, and the
      # comparison against 'true' then fails closed.
      - name: Publish results to bench/gha_results
        if: ${{ !cancelled() && env.QUALITY_MEASURED == 'true' }}
        uses: ./.github/actions/publish-gha-results
        with:
          name: reference-quality
          files: |
            /tmp/quality-report/completeness.tsv
            /tmp/quality-report/quality_cases.txt
            /tmp/quality-report/quality_results.tsv
            /tmp/quality-report/quality_results.jsonl
            /tmp/quality-report/quality-aggregate.txt

      # The counterpart of the gate above: a run that publishes nothing must SAY
      # so, or "the tracked artifact did not change" is indistinguishable from
      # "the publish silently failed". The artifact upload above still carries
      # this run's own logs, so nothing is lost -- only the in-tree record is
      # left alone.
      - name: Report that nothing was published (run measured nothing)
        if: ${{ !cancelled() && env.QUALITY_MEASURED != 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo ""
            echo "### NOT MEASURED — bench/gha_results/reference-quality left untouched"
            echo ""
            echo "libtest did not enumerate the grouped \`quality\` binary, so this run"
            echo "produced no measurement of the suite (only a report about the job)."
            echo "The tracked in-tree record still holds the last run that DID measure;"
            echo "this run's own logs are in the \`quality-results\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "QUALITY_MEASURED=${QUALITY_MEASURED:-<unset>} — nothing published"
