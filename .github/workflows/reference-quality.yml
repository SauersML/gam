name: Reference Quality Suite

# End-to-end quality tests that benchmark gam against the MATURE, STANDARD tool
# for each capability (mgcv, gamlss, survival, flexsurv, VGAM, scam, lme4,
# cmprsk, mlt/tram, scikit-learn, statsmodels, pyGAM, lifelines, scikit-survival,
# properscoring, geomstats, ...). These live under tests/quality/** and are
# included by the grouped tests/quality.rs integration target. They use the Rust
# reference harness (src/test_support/reference.rs), which shells out to R /
# Python. A missing reference dependency is a HARD failure (no skipping), so this
# job provisions the full reference stack.
#
# ITERATING ON ONE TEST: do not wait for this job. It is a periodic dashboard
# over the whole grouped quality target, so the loop from "edit one reference
# test" to "see its number" was hours. `focused-rust-proof.yml` now takes an
# `r_packages` input, so a single test can be run with its comparator installed:
#
#   gh workflow run focused-rust-proof.yml --ref main \
#     -f package=gam -f target=integration -f test_binary=quality \
#     -f filters=<test_name> -f r_packages="nnet"      # or "mgcv gamlss survival"
#
# 163 of the 187 files under tests/quality call an R comparator, and without one
# the harness reports REFERENCE_ENV_MISSING -- correctly labelled NOT MEASURED,
# but indistinguishable from a real failure at the run's exit code. Passing
# `r_packages` is what turns that into a verdict. This job remains the authority
# for the SUITE; the fast lane is for iterating on one test.
#
# Philosophy: a test whose assertion FAILS because gam genuinely diverges from
# the mature reference is an honest, useful measurement. This job RUNS every
# quality test (no fail-fast — it collects EVERY failure and a pass/fail/
# compile-error table), and THEN GATES the pipeline red if any test landed in a
# gating bucket (METRIC_OFF/GAM_ERROR/TEST_ERROR/BUILDFAIL). REF_ERROR —
# the reference R/Python environment failing, not gam — is reported but NOT
# gated. Gating is what stops quality regressions from landing on main silently.

on:
  # Periodic dashboard rather than per-commit: building+running the heavy
  # grouped quality target is too expensive to do on every quality-test push, and
  # the concurrent src/ churn would otherwise re-trigger it constantly. The
  # schedule gives a warm-cache run every few hours; dispatch is on-demand.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-quality.yml"

# Do NOT cancel an in-progress run when a new push lands: this job is a slow
# (full R+Python stack install + grouped quality build/run) match-vs-diverge
# DASHBOARD, not a fast gate. Cancelling on every push means it never reaches
# the "Run quality suite" summary. Let each run finish; newer pushes queue.
concurrency:
  group: reference-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-quality:
    permissions:
      contents: write
      actions: read
    name: Reference quality vs mature tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Free runner disk space
        run: |
          set -uo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Cache all dependency crates (not just direct deps) under a shared
          # key so consecutive runs warm-restore the full dependency build (the
          # multi-GB faer/burn/ndarray/arrow chunk). The gam lib + grouped
          # quality binary still rebuild when src/ changes — that is inherent
          # and not cacheable, which is why the trigger below is periodic, not
          # per-commit.
          cache-all-crates: true
          shared-key: reference-quality

      # Provision the full mature-tool reference stack (system libs + R + CRAN/
      # Bioconductor/INLA packages + Python + the scientific reference libs).
      # Shared with the Rust CI test shards (test.yml) via one composite action
      # so the two provisioning paths can never drift.
      - name: Install reference tool stack (R + Python mature comparators)
        uses: ./.github/actions/install-reference-tools

      - name: Build quality tests
        shell: bash
        run: |
          set -uo pipefail
          echo "building grouped quality integration target tests/quality.rs"
          # tests/quality.rs includes the moved tests/quality/** modules as one
          # integration target. Build that target once, then the run step executes
          # each libtest case directly so one failure cannot hide later evidence.
          #
          # gam#1082: build the benchmark OPTIMIZED (`release-dev` = opt-level 3,
          # codegen-units=16, no LTO — the fast-compile optimized profile). The
          # default `test` profile compiles the gam crate at opt-level 0 (only its
          # *dependencies* get opt-2 via `[profile.test.package."*"]`), so the
          # benchmark was timing every fit on UNOPTIMIZED gam code — a perf profile
          # the shipped wheel (`release-pypi`, lto=fat opt-3) and CLI (`release`)
          # never run. perf shows the opt-0 hot path is dominated by ndarray
          # per-element bounds/stride checks (`index_checked`, `stride_offset_checked`,
          # `precondition_check`) that the optimizer elides, not by real FLOPs. This
          # makes the quality measurements reflect production-representative code
          # rather than a debug build no user experiences. Convergence and the
          # quality assertions gate the run; quality_1082 also retains its
          # original per-test 360-second runtime requirement.
          cargo build --keep-going --profile release-dev --test quality --test quality_1082 \
            || echo "build reported errors; missing quality binary is flagged BUILDFAIL in the run step"
          # A handful of quality tests (RMST, competing risks) shell out to the
          # real `gam` CLI to exercise the end-to-end formula fit path. The CLI
          # binary was peeled into the `gam-cli` workspace member (#1521), so it
          # is NOT pulled in by `--test quality` and must be built explicitly
          # under the SAME profile — otherwise those tests spawn a nonexistent
          # `target/release-dev/gam` and report TEST_ERROR every run.
          echo "building the gam CLI binary (gam-cli) so CLI-shelling quality tests can spawn it"
          cargo build --keep-going --profile release-dev -p gam-cli --bin gam \
            || echo "gam CLI build reported errors; CLI-shelling quality tests will report TEST_ERROR"

      - name: Run quality suite (resilient + streaming; full per-test capture)
        shell: bash
        run: |
          # GitHub's `shell: bash` runs with `-e`, which would abort this step at
          # the FIRST diverging/failing test (cargo test returns nonzero) before
          # the streaming loop and exit 0. Turn `-e` OFF: per-test failures are
          # the expected, tolerated outcome here; we classify and stream them.
          set +e -u -o pipefail
          pass=0; metricoff=0; gamerr=0; referr=0; testerr=0; bf=0
          # REF_ERROR among comparators the job GUARANTEES are installed (the
          # install-reference-tools action hard-fails if mgcv/gamlss/survival do
          # not load). For those tests a lost reference is a genuine breakage, not the
          # tolerated "optional native tool missing" case (INLA/scoringrules/PyMC),
          # so it must gate the run rather than be absorbed by the 25% global floor.
          guaranteed_referr=0
          # EVERYTHING the run produced lands under one directory that is uploaded
          # wholesale: the full per-test stdout+stderr logs (no tail truncation),
          # a rich un-truncated TSV, and a JSONL stream. The job-summary table and
          # the totals are a VIEW on top of this complete captured data, never a
          # lossy replacement for it.
          OUT=/tmp/quality-report
          rm -rf "$OUT"; mkdir -p "$OUT/logs"
          RES="$OUT/quality_results.tsv"
          JSONL="$OUT/quality_results.jsonl"
          discovery_error=0
          # MEASURED vs NOT MEASURED. `measured=1` means libtest ENUMERATED the
          # suite from a real binary, so the rows below are observations of the
          # quality tests. Both fallback paths (no binary, or a binary that lists
          # zero cases) synthesise a ONE-ELEMENT pseudo-suite so the run still
          # reports something readable -- but that single row is a report ABOUT
          # the job, not a measurement OF the suite, and everything downstream
          # that treats it as one is wrong. This flag is what tells them apart.
          measured=1
          # gam#1082: the quality target is built under the `release-dev` profile
          # (see the build step), so its binary lands in target/release-dev/deps.
          tests=()
          declare -A test_binary test_discovery_errors
          for target in quality quality_1082; do
            bin=$(find target/release-dev/deps -maxdepth 1 -type f -perm -u+x -name "$target-*" ! -name '*.*' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
            target_tests=()
            if [ -n "$bin" ] && [ -x "$bin" ]; then
              if "$bin" --list > "$OUT/$target-list.txt" 2> "$OUT/$target-list.stderr"; then
                mapfile -t target_tests < <(sed -n 's/: test$//p' "$OUT/$target-list.txt")
              fi
              if [ "${#target_tests[@]}" -eq 0 ]; then
                discovery_error=1
                measured=0
                target_tests=("${target}_discovery")
                test_discovery_errors["${target}_discovery"]=1
              fi
            else
              measured=0
              target_tests=("$target")
            fi
            for t in "${target_tests[@]}"; do
              tests+=("$t")
              test_binary["$t"]="$bin"
            done
          done
          if [ "$measured" -eq 1 ]; then
            printf '%s\n' "${tests[@]}" > "$OUT/quality_cases.txt"
          fi
          N=${#tests[@]}; i=0
          # Tab-separated, one header row, FULL (un-truncated) metric column so
          # every captured quality figure for every test is preserved verbatim.
          printf 'idx\toutcome\tcause\ttest\trc\tdur_s\tsub_passed\tsub_failed\tmetric\treason\n' > "$RES"
          : > "$JSONL"
          {
            echo "## Reference quality suite"
            echo ""
            echo "Each row is one exact libtest case from the \`quality\` or \`quality_1082\`"
            echo "integration binary. Synthetic and \`_on_real_data\` arms are timed"
            echo "and classified independently, so grouping does not hide an individual"
            echo "test inside one aggregate invocation. The \`outcome\` says exactly WHAT happened — it never collapses"
            echo "distinct situations into one vague word:"
            echo ""
            echo "- \`PASS\` — met the quality bar."
            echo "- \`METRIC_OFF\` — gam ran and produced output, but a quality metric"
            echo "  missed its bound (an honest accuracy/calibration finding, NOT an error)."
            echo "- \`GAM_ERROR\` — gam itself errored: the fit crashed, refused, or"
            echo "  failed to converge (no usable output)."
            echo "- \`REF_ERROR\` — the mature reference tool failed or is missing"
            echo "  (R/Python package, system lib, namespace, or its script) — not gam."
            echo "- \`TEST_ERROR\` — the test/harness setup is wrong (bad data, missing"
            echo "  fixture, mismatched column lengths) — fix the test, not gam."
            echo ""
            echo "Full per-test logs + an un-truncated metric TSV + a JSONL stream are"
            echo "in the \`quality-results\` artifact."
            echo ""
            echo "| # | test | outcome | cause | sub p/f | dur | metrics | reason |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in "${tests[@]}"; do
            bin="${test_binary[$t]}"
            i=$((i+1))
            outcome=""; cause=""; reason=""; rc=0
            echo "::group::[$i/$N] $t"
            # Sanitize the log FILENAME: Rust test paths contain '::', which
            # upload-artifact rejects (colon is invalid on NTFS). Keep $t intact
            # for the test filter; only the on-disk filename is rewritten.
            tsafe="${t//:/_}"
            log="$OUT/logs/$tsafe.log"
            start=$SECONDS
            if [ "${test_discovery_errors[$t]:-0}" -eq 1 ]; then
              outcome=TEST_ERROR; cause=test_discovery; rc=-1
              reason="quality binary listed zero libtest cases"
              echo "$reason" > "$log"
            elif [ -z "$bin" ] || [ ! -x "$bin" ]; then
              # No binary => the build step couldn't compile this test.
              outcome=BUILDFAIL; rc=-1
              echo "no executable binary found for grouped quality target — the build step could not compile it" > "$log"
            else
              # Execute the pre-built binary directly — no cargo, no rebuild.
              # Production convergence remains a mathematical certificate;
              # the test harness also measures the issue's runtime contract.
              run_prefix=()
              if [[ "$bin" == */quality_1082-* ]]; then
                # SPEC permits test deadlines. This population retains #1082's
                # original 360-second acceptance budget.
                run_prefix=(timeout 360s)
              fi
              "${run_prefix[@]}" "$bin" --exact "$t" --nocapture --test-threads=1 > "$log" 2>&1
              rc=$?
            fi
            dur=$((SECONDS-start))
            # Sub-test tallies from the libtest summary line in this binary's log.
            res_line=$(grep -aE '^test result:' "$log" | tail -1)
            sub_passed=$(printf '%s' "$res_line" | grep -oaE '[0-9]+ passed' | grep -oaE '[0-9]+' | head -1); sub_passed=${sub_passed:-0}
            sub_failed=$(printf '%s' "$res_line" | grep -oaE '[0-9]+ failed' | grep -oaE '[0-9]+' | head -1); sub_failed=${sub_failed:-0}
            # ALL numeric quality figures emitted by the test, un-truncated. The
            # full log keeps everything regardless; this column is the structured,
            # greppable distillation of every metric the test printed.
            metric=$(grep -hoaE '(R2|r2|rmse|mae|rel_l2|l2|auc|deviance|nll|loglik|crps|acc|accuracy|logloss|concordance|c_index|seam|edf|pearson|spearman|coverage|width|bias|frechet|distance|geodesic|rho|ess|rhat|kl|wasserstein|calibration|brier|ci_|se_)[^ ,;)]*[=: ]+-?[0-9][0-9.eE+-]*' "$log" 2>/dev/null | tr '\n' ' ')
            # A reference tool failing/missing (R/Python package, system lib,
            # namespace, broken generated script) — this is NOT a gam result.
            # REFERENCE_ENV_MISSING is the harness's own canonical marker for this
            # (crates/gam-test-support/src/reference.rs); it already covers both
            # interpreters' import-failure dialects, including `cannot import name`.
            refmarker=$(grep -aE 'REFERENCE_ENV_MISSING|there is no package called|could not find function|Error in library\(|package or namespace load failed|unable to load shared object|cannot open shared object|No module named|ModuleNotFoundError|IndentationError|reference .* body failed' "$log" | head -1)
            # First panic: "<thread> panicked at <file:line>:" then the message.
            panicmsg=$(awk '/panicked at/{loc=$0; getline; print loc " :: " $0; exit}' "$log")
            # gam-side fit errors (the fit crashed/refused/failed to converge).
            # `LayoutError`/`identifiability audit` are gam's OWN model-layout /
            # identifiability verdicts — they must classify as GAM_ERROR even
            # though their message contains the phrase "rows, expected" (which
            # used to be matched by the broader TEST_ERROR rule below and stole
            # them; that rule is now harness-origin-only).
            #
            # The list is keyed on gam's OWN error VARIANTS, and it was missing
            # three of them that no wrapper puts an `IntegrationFailed` in front
            # of. Measured on run 30460836905 re-run at `b8745892a`, these three
            # rows were counted as METRIC_OFF -- i.e. reported as "gam ran and
            # produced output, a quality metric missed its bound" -- when gam had
            # in fact refused to produce a fit at all:
            #
            #   Optimization { context: "fit_custom_family outer smoothing", ... }
            #     misc::quality_vs_simplex_dirichlet_regression
            #   OrderFailures { kind: GaussianMixture, failures: [...] }
            #     misc::quality_mixture_rung_vs_reference
            #   NonConvergence { context: "SPD Fréchet mean", iterations: 18, ... }
            #     misc::quality_vs_scipy_spd_frechet_mean
            #
            # Both buckets gate, so this never changed the run's red/green. It
            # changed the only thing the buckets exist for: the METRIC_OFF count
            # is the suite's headline claim about gam's ACCURACY, and a refusal
            # silently inflating it makes gam look less accurate than it is while
            # hiding a non-convergence. The three variants are matched with their
            # trailing `{` so a test's prose about its own reference computation
            # ("... Newton refit did not converge") cannot be swept in.
            # A sixth missing variant, from the SAME family as the two above and
            # measured on run 30460836905 (headSha 7b4d762d8):
            #
            #   fit_tensor_surface: finite REML optimum is value-resolved but not
            #   an isolated stationary point (LowerBoundary)
            #     misc::quality_llm_weekday_circle
            #
            # That is gam REFUSING to certify an outer-REML optimum -- a fit
            # failure -- yet it landed in METRIC_OFF, i.e. it was reported as
            # "gam fitted and a quality metric missed its bound". The existing
            # `RemlOptimizationFailed|REML smoothing optimization` alternatives
            # do not cover it: this refusal is raised by the term/solve layer
            # (`gam-terms/src/structure/anova_atom.rs`, `grid_spline_2d.rs`,
            # `gam-solve/src/spline_scan.rs`, `residual_cascade.rs`,
            # `gam-sae/src/identifiability.rs`) with its own wording. All five
            # sites share the literal phrase `REML optimum is value-resolved`,
            # which is gam's own prose and cannot be produced by a test
            # describing its reference tool, so that phrase is the key.
            gamfit_re='IntegrationFailed|InvalidConfig|IdentifiabilityFailure|LayoutError|identifiability audit|Invalid input|could not broadcast|Newton step|transformation fit failed|workflow survival baseline failed|RemlOptimizationFailed|REML smoothing optimization|Optimization \{ context:|OrderFailures \{|NonConvergence \{|REML optimum is value-resolved'
            if [ "$outcome" = TEST_ERROR ]; then
              testerr=$((testerr+1))
            elif [ "$outcome" = BUILDFAIL ]; then
              cause=build; reason=$(head -1 "$log"); bf=$((bf+1))
            elif [ "$rc" -eq 0 ]; then
              outcome=PASS; cause=ok; reason=""; pass=$((pass+1))
            elif [ -n "$refmarker" ]; then
              outcome=REF_ERROR; cause=reference_tool; reason="$refmarker"; referr=$((referr+1))
              # If the lost reference is one the job guarantees present, this REF_ERROR
              # is a real breakage masking a lost gam-vs-reference comparison.
              #
              # Classify by what the test's comparator ACTUALLY LOADS, not by what the
              # test is CALLED. The previous form was `case "$t" in *mgcv*|...`, i.e. a
              # substring match on the test NAME, and it had a live hole: a test whose
              # comparator body is `suppressMessages(library(mgcv))` but whose name does
              # not contain "mgcv" was counted as zero. Measured on the last complete
              # run (30460836905): `families::quality_vs_synthetic_multinomial_deviance_
              # identity` REF_ERRORed with an mgcv comparator, `guaranteed_referr`
              # counted 0, and the "100% coverage for guaranteed comparators" gate
              # passed while a guaranteed reference was in fact broken.
              #
              # A gate keyed on a naming convention only holds while the convention
              # does. Read the source instead: the libtest name is
              # `<dir>::<file-stem>::<fn>`, which maps directly onto
              # `tests/quality/<dir>/<file-stem>.rs`.
              qdir="${t%%::*}"
              qrest="${t#*::}"
              qfile="${qrest%%::*}"
              qsrc="$GITHUB_WORKSPACE/tests/quality/$qdir/$qfile.rs"
              if [ -f "$qsrc" ]; then
                if grep -qaE 'library\((mgcv|gamlss|survival)\)' "$qsrc"; then
                  guaranteed_referr=$((guaranteed_referr+1))
                  echo "  guaranteed-comparator REF_ERROR: $t (source $qdir/$qfile.rs loads a hard-verified R reference)"
                fi
              else
                # The name did not resolve to a source file, so we cannot tell which
                # comparator was lost. Count it: an unclassifiable REF_ERROR must not
                # be silently treated as the optional-tool case, which is the failure
                # this whole block exists to prevent.
                guaranteed_referr=$((guaranteed_referr+1))
                echo "  guaranteed-comparator REF_ERROR (UNRESOLVED SOURCE, counted conservatively): $t -> $qsrc"
              fi
            elif printf '%s' "$panicmsg" | grep -qaE 'gam-test-support/src/reference\.rs|No such file or directory'; then
              # Test/harness setup defect (bad data, missing fixture, length
              # mismatch). Gated on the panic ORIGINATING in the harness
              # (src/test_support/reference.rs — where write_columns_csv asserts
              # equal column lengths) rather than on the bare phrases
              # "rows, expected"/"reference column", which also appear in gam's
              # own identifiability/layout error messages and were misfiling
              # genuine GAM_ERRORs as TEST_ERROR.
              outcome=TEST_ERROR; cause=test_setup; reason="$panicmsg"; testerr=$((testerr+1))
            elif printf '%s' "$panicmsg" | grep -qaE "$gamfit_re" || printf '%s' "$panicmsg" | grep -qaE 'panicked at src/'; then
              outcome=GAM_ERROR; cause=gam_fit_failed; reason="$panicmsg"; gamerr=$((gamerr+1))
            else
              # gam produced output; a quality metric missed its bound. Honest
              # accuracy/calibration finding — not an error.
              outcome=METRIC_OFF; cause=quality_metric; reason="${panicmsg:-nonzero exit $rc}"; metricoff=$((metricoff+1))
            fi
            # Sanitize to single-line cells for the TSV / markdown table; the full
            # untouched text always remains in the per-test log artifact. GitHub's
            # TSV renderer treats a bare ASCII double quote as the start of CSV
            # quoting, so normalize quotes too instead of producing an "Illegal
            # quoting" error that makes the tracked table unsearchable.
            metric_clean=$(printf '%s' "$metric" | tr '\t|"' "  '" | tr -s ' ')
            reason_clean=$(printf '%s' "$reason" | tr '\t\n|"' "   '" | tr -s ' ' | cut -c1-400)
            printf '%d\t%s\t%s\t%s\t%d\t%d\t%s\t%s\t%s\t%s\n' \
              "$i" "$outcome" "$cause" "$t" "$rc" "$dur" "$sub_passed" "$sub_failed" "$metric_clean" "$reason_clean" >> "$RES"
            printf '{"idx":%d,"outcome":"%s","cause":"%s","test":"%s","rc":%d,"dur_s":%d,"sub_passed":%s,"sub_failed":%s}\n' \
              "$i" "$outcome" "$cause" "$t" "$rc" "$dur" "$sub_passed" "$sub_failed" >> "$JSONL"
            printf '| %d | %s | %s | %s | %s/%s | %ss | %s | %s |\n' \
              "$i" "$t" "$outcome" "$cause" "$sub_passed" "$sub_failed" "$dur" "$metric_clean" "${reason_clean:0:200}" >> "$GITHUB_STEP_SUMMARY"
            echo "[$i/$N] $outcome/$cause  $t  rc=$rc dur=${dur}s sub=${sub_passed}p/${sub_failed}f"
            [ -n "$metric_clean" ] && echo "  metrics: $metric_clean"
            [ -n "$reason_clean" ] && echo "  reason:  $reason_clean"
            # Echo the FULL per-test log into the (collapsible) job-log group too —
            # no 20-line tail. The artifact is the canonical complete copy in case
            # GitHub caps the job log.
            echo "----- full log: $t -----"; cat "$log"; echo "----- end log: $t -----"
            echo "::endgroup::"
          done
          # COMPLETENESS MARKER. A truncated run and a whole one are
          # indistinguishable from the TSV alone -- a prefix of a measurement
          # just looks like a smaller suite -- and that is exactly how a
          # 60-of-456 fragment became the tracked artifact and got read as the
          # suite's verdict. `N` is the count libtest enumerated BEFORE the loop,
          # so comparing it against rows actually written is an honest
          # self-report that survives into the published directory.
          #
          # `COMPLETE` is denominated in `N`, and `N` is the ENUMERATED count --
          # so on the fallback paths, where `N` is the synthetic 1, one written
          # row satisfies `rows_written == N` and the marker read `COMPLETE`.
          # That is how a BUILDFAIL run (`enumerated=1 rows_written=1
          # completeness=COMPLETE`, run 30702349083) published itself over a run
          # that had measured 456 tests. A row count can only certify
          # completeness RELATIVE to a real enumeration; when there was no
          # enumeration there is nothing to be complete with respect to, and the
          # marker must say NOT_MEASURED rather than borrow the vocabulary of a
          # measured run (#2744).
          rows_written=$(( $(wc -l < "$RES") - 1 ))
          if [ "$measured" -eq 0 ]; then
            completeness=NOT_MEASURED
          elif [ "$rows_written" -eq "$N" ]; then
            completeness=COMPLETE
          else
            completeness=PARTIAL
          fi
          printf 'completeness\t%s\nmeasured\t%s\nenumerated\t%d\nrows_written\t%d\n' \
            "$completeness" "$( [ "$measured" -eq 1 ] && echo true || echo false )" \
            "$N" "$rows_written" > "$(dirname "$RES")/completeness.tsv"
          echo "COMPLETENESS=$completeness enumerated=$N rows_written=$rows_written"
          # Hand the verdict to later steps: the publish step must not overwrite
          # the tracked in-tree record with a run that measured nothing.
          if [ "$measured" -eq 1 ]; then
            echo "QUALITY_MEASURED=true" >> "$GITHUB_ENV"
          else
            echo "QUALITY_MEASURED=false" >> "$GITHUB_ENV"
          fi
          {
            echo ""
            echo "### Totals"
            echo ""
            echo "| outcome | count | meaning |"
            echo "|---|---|---|"
            echo "| PASS | $pass | met the quality bar |"
            echo "| METRIC_OFF | $metricoff | gam ran; a quality metric missed its bound |"
            echo "| GAM_ERROR | $gamerr | gam fit crashed / refused / failed to converge |"
            echo "| REF_ERROR | $referr | reference tool failed or missing |"
            echo "| TEST_ERROR | $testerr | test/harness setup defect |"
            echo "| BUILDFAIL | $bf | did not compile |"
            echo "| **total** | **$N** | |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pass=$pass metric_off=$metricoff gam_error=$gamerr ref_error=$referr test_error=$testerr build_fail=$bf (of $N)"
          # GATE the pipeline. The suite is the ONLY end-to-end measurement of gam
          # quality vs the mature standard tools; if it cannot go red, every quality
          # regression lands on main silently (the #1087 meta-bug). We ran ALL N
          # tests above (no fail-fast — every failure is collected and streamed);
          # now we exit non-zero if ANY test landed in a GATING bucket, after
          # printing exactly which ones did and why.
          #
          # Gating buckets = genuine gam/test defects + honest quality misses:
          #   METRIC_OFF  gam ran but a quality metric missed its bound
          #   GAM_ERROR   gam fit crashed / refused / failed to converge
          #   TEST_ERROR  test/harness setup defect
          #   BUILDFAIL   did not compile
          # NOT gated: REF_ERROR — the reference R/Python environment failed or is
          # missing (not a gam result; tracked separately, #1070/#1071). It is
          # reported below but never masks or triggers the gam-side gate.
          gating=$((metricoff + gamerr + testerr + bf))
          if [ "$gating" -gt 0 ]; then
            echo ""
            echo "::error::Reference Quality Suite FAILED: ${gating} test(s) in gating buckets (METRIC_OFF=${metricoff} GAM_ERROR=${gamerr} TEST_ERROR=${testerr} BUILDFAIL=${bf}); REF_ERROR=${referr} not gated."
            echo "----- gating failures (outcome  test  reason) -----"
            # Reprint the offending rows from the TSV (skip header; field 2 = outcome).
            awk -F'\t' 'NR>1 && $2!="PASS" && $2!="REF_ERROR" {printf "  %-11s %s\n    %s\n", $2, $4, $10}' "$RES"
            echo "---------------------------------------------------"
            {
              echo ""
              echo "### Gate: FAILED"
              echo ""
              echo "${gating} test(s) in gating buckets (METRIC_OFF/GAM_ERROR/TEST_ERROR/BUILDFAIL)."
              echo "REF_ERROR (${referr}) is reference-environment, not gated."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # PER-COMPARATOR COVERAGE FLOOR (#1082, GPT-5.5 Pro concern: "quality runs
          # passing without reference coverage"). The 25% global floor below tolerates
          # missing OPTIONAL native references (INLA/scoringrules/PyMC). But the job
          # HARD-VERIFIES that mgcv/gamlss/survival load before running (the
          # install-reference-tools action fails otherwise), so a REF_ERROR on any test
          # backed by one of those is NOT a missing-infra waiver — it is a genuine
          # breakage that silently dropped a gam-vs-mature-tool comparison. Require
          # 100% reference coverage for the guaranteed comparators: a single such
          # REF_ERROR fails the run, no percentage tolerance.
          if [ "$guaranteed_referr" -gt 0 ]; then
            echo ""
            echo "::error::Reference Quality Suite UNTRUSTWORTHY: ${guaranteed_referr} test(s) backed by a GUARANTEED reference (mgcv/gamlss/survival) hit REF_ERROR. Those tools are verified-present before the run, so this is a real reference breakage that dropped a gam-vs-reference comparison — not an optional-tool waiver. 100% coverage is required for guaranteed comparators."
            echo "----- guaranteed-comparator REF_ERROR rows (test  reason) -----"
            awk -F'\t' 'NR>1 && $2=="REF_ERROR" && ($4 ~ /mgcv/ || $4 ~ /gamlss/ || $4 ~ /survival/) {printf "  %s\n    %s\n", $4, $10}' "$RES"
            echo "---------------------------------------------------------------"
            {
              echo ""
              echo "### Gate: FAILED (guaranteed-comparator reference coverage)"
              echo ""
              echo "${guaranteed_referr} test(s) backed by a hard-verified reference (mgcv/gamlss/survival) were REF_ERROR. Those references are guaranteed installed, so the lost comparison is a real breakage; 100% coverage is required for them."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # REFERENCE-COVERAGE FLOOR. REF_ERROR is non-blaming per-test (it is the
          # reference env, not a gam result), but the suite's ENTIRE value is the
          # gam-vs-mature-tool comparison. If the reference environment is broadly
          # broken, almost no comparison actually ran and the suite measured
          # nothing — it must NOT report green merely because the gam side did not
          # crash (the failure mode the #1087 meta-bug warns about). This is an
          # infrastructure failure (tracked #1070/#1071), reported distinctly from
          # a gam-side regression, but it still fails the job: a run cannot be
          # green when more than a quarter of the suite lost its reference.
          if [ "$N" -gt 0 ] && [ $((referr * 4)) -gt "$N" ]; then
            echo ""
            echo "::error::Reference Quality Suite UNTRUSTWORTHY: ${referr}/${N} test(s) lost their reference (>25%); reference environment is broken, so the suite proved almost nothing. Not a gam regression (see #1070/#1071), but the run cannot be green."
            {
              echo ""
              echo "### Gate: FAILED (reference coverage)"
              echo ""
              echo "${referr}/${N} tests were REF_ERROR (>25%). The reference R/Python environment is broken; the gam-vs-reference comparison did not run for most of the suite, so a green result here would be meaningless."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gate: PASSED — every test met its quality bar; guaranteed-comparator reference coverage 100% (mgcv/gamlss/survival REF_ERROR=0); optional-reference REF_ERROR=${referr}/${N} within the 25% floor."
          { echo ""; echo "### Gate: PASSED"; } >> "$GITHUB_STEP_SUMMARY"

      # #1561 aggregate + #2395 power view. The gate above decides red/green from
      # per-test outcomes; this reads the machine-readable [QUALITY_PAIR] lines
      # every test emits and recomputes the whole-suite signed-rank aggregate,
      # plus the paired-panel power table (per-pair resolution, the standard
      # errors pairing recovers, which pairs are RESOLVED worse, and which
      # near-ties are still undecided). `always()` and non-gating on purpose: the
      # gate step exits 1 on a gating bucket, and losing this report on exactly
      # the runs that regressed would hide the numbers that explain the
      # regression. Its exit status is printed, never propagated.
      - name: Aggregate quality pairs (#1561 gate + #2395 paired power)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT=/tmp/quality-report
          if [ ! -d "$OUT/logs" ]; then
            echo "no per-test logs at $OUT/logs — the run step produced nothing to aggregate"
            exit 0
          fi
          cat "$OUT"/logs/*.log > "$OUT/all-tests.log" 2>/dev/null || true
          report="$OUT/quality-aggregate.txt"
          python3 bench/aggregate_quality_gate_1561.py "$OUT/all-tests.log" > "$report" 2>&1
          rc=$?
          cat "$report"
          {
            echo ""
            echo "### Quality-pair aggregate (#1561) + paired power (#2395)"
            echo ""
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "aggregator exit=${rc} (reported, not gated)"

      - name: Upload full quality report (always — survives failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-results
          # The WHOLE report dir: rich un-truncated TSV + JSONL + every per-test
          # stdout/stderr log. "Everything that happened", not just the headlines.
          path: /tmp/quality-report
          if-no-files-found: ignore


      # Track this run's uncompressed numbers in-tree (bench/gha_results/reference-quality).
      # `!cancelled()` rather than `always()` so a FAILED or timed-out run still
      # publishes what it measured -- those numbers are usually the interesting
      # ones -- while a CANCELLED one does not.
      #
      # The distinction is not hypothetical, and the old `always()` is how the
      # tracked artifact got corrupted. `always()` INCLUDES `cancelled`, and this
      # action replaces its subdirectory wholesale, so a run killed part-way
      # overwrites a complete measurement with a prefix of one. Measured on the
      # last eight commits to `bench/gha_results/reference-quality/`, by row count
      # of `quality_results.tsv`:
      #
      #     dbef67293  rows=60   cancelled   <-- became the tracked artifact
      #     c07b33604  rows=457  failure
      #     11de0ca46  rows=457  failure
      #     9a4cfe629  rows=2    failure
      #     a32e1c030  rows=456  failure
      #
      # The 60-row fragment reported `OVERALL 37 pairs, 18 wins / 18 losses,
      # p=0.7428` over 3 categories, replacing the complete run's `OVERALL 157
      # pairs, 75 / 76, p=0.2066` over 6. Nothing in the artifact says it is a
      # fragment, so every reader since took a 59-of-456 sample for the suite.
      #
      # The existing "publishes nothing when the run produced no results" guard
      # does not help: it protects against EMPTY, and a cancelled run is
      # TRUNCATED, not empty. A prefix of a measurement is the one shape that
      # looks exactly like a smaller, better result.
      #
      # This job is `cancel-in-progress: false`, so the cancellations are the
      # 6-hourly schedule overlapping its own runtime rather than a newer push.
      #
      # #2744: the same wholesale replace also let a run that measured NOTHING
      # overwrite one that had measured the suite. A BUILDFAIL run cannot
      # enumerate the grouped binary, so the run step falls back to a synthetic
      # one-element pseudo-suite and writes one `BUILDFAIL` row; that row is a
      # non-empty, self-declared-COMPLETE TSV, so every guard downstream (the
      # action's zero-byte filter, the completeness marker) passed it through and
      # `2d4f1bbfc` replaced run 30691912146's 52-failure breakdown with it. Four
      # consecutive reds each destroyed the previous red's evidence. So the
      # publish is now gated on `QUALITY_MEASURED`, set by the run step from
      # whether libtest actually ENUMERATED the suite: a run that measured
      # nothing publishes nothing and the last measured record survives.
      # `QUALITY_MEASURED` is unset if the run step never executed, and the
      # comparison against 'true' then fails closed.
      - name: Publish results to bench/gha_results
        if: ${{ !cancelled() && env.QUALITY_MEASURED == 'true' }}
        uses: ./.github/actions/publish-gha-results
        with:
          name: reference-quality
          files: |
            /tmp/quality-report/completeness.tsv
            /tmp/quality-report/quality_cases.txt
            /tmp/quality-report/quality_results.tsv
            /tmp/quality-report/quality_results.jsonl
            /tmp/quality-report/quality-aggregate.txt

      # The counterpart of the gate above: a run that publishes nothing must SAY
      # so, or "the tracked artifact did not change" is indistinguishable from
      # "the publish silently failed". The artifact upload above still carries
      # this run's own logs, so nothing is lost -- only the in-tree record is
      # left alone.
      - name: Report that nothing was published (run measured nothing)
        if: ${{ !cancelled() && env.QUALITY_MEASURED != 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo ""
            echo "### NOT MEASURED — bench/gha_results/reference-quality left untouched"
            echo ""
            echo "libtest did not enumerate the grouped \`quality\` binary, so this run"
            echo "produced no measurement of the suite (only a report about the job)."
            echo "The tracked in-tree record still holds the last run that DID measure;"
            echo "this run's own logs are in the \`quality-results\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "QUALITY_MEASURED=${QUALITY_MEASURED:-<unset>} — nothing published"
