name: publish-gha-results
description: >
  Publish this run's UNCOMPRESSED result files (accuracy/perf numbers, metric
  tables, reference-tool outputs) into bench/gha_results/<name>/ on main, so the
  newest results for every workflow are always tracked in-tree and their change
  over time is visible in git history.

  Call it with `if: always()` so results are captured on failure and timeout too
  — a failed run's numbers are usually the interesting ones. If the run produced
  no results, nothing is committed: an empty or missing set never overwrites the
  previous good one.

inputs:
  name:
    description: "Subdirectory under bench/gha_results/ (usually the workflow name)."
    required: true
  files:
    description: >
      Newline-separated paths to publish. Entries may be files, directories
      (published recursively), or globs. Missing entries are skipped silently —
      workflows legitimately produce different subsets on different paths.
    required: true
  max_bytes:
    description: "Skip any single file larger than this (keeps the repo sane)."
    required: false
    default: "5242880"
  token:
    description: "Token used to push. Needs contents: write on the calling job."
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Publish results to bench/gha_results
      shell: bash
      env:
        RESULTS_NAME: ${{ inputs.name }}
        RESULTS_FILES: ${{ inputs.files }}
        MAX_BYTES: ${{ inputs.max_bytes }}
        GH_TOKEN_PUBLISH: ${{ inputs.token }}
        JOB_STATUS: ${{ job.status }}
      run: |
        set -uo pipefail

        DEST_REL="bench/gha_results/${RESULTS_NAME}"
        STAGE="$(mktemp -d)/payload"
        mkdir -p "$STAGE"

        # Uncompressed, human/tool-readable result formats only. Archives and
        # binaries are what the artifact store is for; this directory is for
        # numbers you can read in a diff.
        is_result_file() {
          case "${1,,}" in
            *.json|*.jsonl|*.ndjson|*.tsv|*.csv|*.txt|*.md|*.log|*.out|*.yaml|*.yml|*.xml) return 0 ;;
            *) return 1 ;;
          esac
        }

        stage_one() { # $1 = source file, $2 = destination path relative to STAGE
          local src="$1" rel="$2" size
          is_result_file "$src" || return 0
          size=$(wc -c < "$src" 2>/dev/null || echo 0)
          # Zero bytes is not a result. Oversized files stay in the artifact.
          [ "$size" -gt 0 ] || return 0
          if [ "$size" -gt "$MAX_BYTES" ]; then
            echo "  skip (too large, ${size}B): $src"
            return 0
          fi
          mkdir -p "$STAGE/$(dirname "$rel")"
          cp -f "$src" "$STAGE/$rel" && echo "  staged (${size}B): $rel"
        }

        echo "collecting results for '${RESULTS_NAME}'"
        while IFS= read -r pattern; do
          pattern="$(echo "$pattern" | xargs || true)"
          [ -z "$pattern" ] && continue
          for path in $pattern; do
            [ -e "$path" ] || continue
            if [ -d "$path" ]; then
              base="$(basename "$path")"
              while IFS= read -r f; do
                stage_one "$f" "${base}/${f#"$path"/}"
              done < <(find "$path" -type f 2>/dev/null)
            else
              stage_one "$path" "$(basename "$path")"
            fi
          done
        done <<< "$RESULTS_FILES"

        if [ -z "$(find "$STAGE" -type f 2>/dev/null | head -1)" ]; then
          echo "no result files produced by this run — leaving the previous results in place"
          exit 0
        fi

        # WHICH steps failed before this one. `job.status` says only that the job
        # failed, and "publish job: failure" read as though publishing had failed.
        # Run 35301501610 published fine, and the failures were its steps 8 and
        # 9. The jobs API lists this job's steps while it runs: the job is the
        # in-progress one on this runner. A step that finished moments ago may not
        # be reported yet, and the lookup can be refused (no `actions: read`), so
        # an empty answer is labelled as unreported, never as "none failed".
        failed_steps=""
        if [ "${JOB_STATUS:-}" = failure ]; then
          failed_steps=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN_PUBLISH}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}/attempts/${GITHUB_RUN_ATTEMPT:-1}/jobs?per_page=100" 2>/dev/null \
            | jq -r --arg runner "${RUNNER_NAME:-}" \
                '.jobs[] | select(.runner_name == $runner and .status == "in_progress") | .steps[] | select(.conclusion == "failure") | "\(.number)\t\(.name)"' 2>/dev/null) \
            || failed_steps=""
        fi
        if [ -n "$failed_steps" ]; then
          failed_numbers=$(printf '%s\n' "$failed_steps" | cut -f1 | paste -sd, - | sed 's/,/, /g')
          status_label="job status: ${JOB_STATUS} at step(s) ${failed_numbers}"
          # Joined without rewriting the names, which may hold `;` themselves. Run
          # 35327329208's body read "streaming;  full" when the `;` join was
          # respaced.
          failed_detail=$(printf '%s\n' "$failed_steps" | awk -F'\t' 'NR > 1 { printf " | " } { printf "step %s: %s", $1, $2 }')
        elif [ "${JOB_STATUS:-}" = failure ]; then
          status_label="job status: failure, failing step not reported by the jobs API"
          failed_detail=""
        else
          status_label="job status: ${JOB_STATUS:-unknown}"
          failed_detail=""
        fi
        failed_json=$(printf '%s' "$failed_detail" | sed 's/\\/\\\\/g; s/"/\\"/g')

        # Provenance travels WITH the numbers, and only when there are numbers:
        # this file alone can never be the reason a commit happens.
        cat > "$STAGE/_run.json" <<PROVENANCE
        {
          "workflow": "${GITHUB_WORKFLOW:-}",
          "publish_job_status": "${JOB_STATUS:-}",
          "publish_job_status_note": "status of the job that PUBLISHED these results, not the conclusion of run_id -- this job is part of that run, so the run has not concluded here",
          "publish_job_failed_steps": "${failed_json}",
          "run_id": "${GITHUB_RUN_ID:-}",
          "run_number": "${GITHUB_RUN_NUMBER:-}",
          "run_attempt": "${GITHUB_RUN_ATTEMPT:-}",
          "event": "${GITHUB_EVENT_NAME:-}",
          "ref": "${GITHUB_REF:-}",
          "sha": "${GITHUB_SHA:-}",
          "completed_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "run_url": "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
        }
        PROVENANCE

        # Publish from a FRESH clone, never the job's workspace: that workspace
        # may be dirty, on a detached head, or mid-build, and none of that
        # should be able to ride along into main.
        WORKDIR="$(mktemp -d)"
        REMOTE="https://x-access-token:${GH_TOKEN_PUBLISH}@github.com/${GITHUB_REPOSITORY}.git"

        # One attempt = clone main fresh, drop our subdirectory in, push. On a
        # race we RE-CLONE rather than rebase: the clone is --depth 1 and a
        # shallow history cannot be rebased. Re-cloning also means each attempt
        # builds on whatever main is NOW, which is the semantics wanted here -
        # latest results win, within this subdirectory only.
        publish_attempt() {
          local repo="$WORKDIR/repo"
          rm -rf "$repo"
          git clone --quiet --depth 1 --branch main "$REMOTE" "$repo" || return 2
          cd "$repo" || return 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace wholesale so files a run stops producing disappear rather
          # than lingering as stale numbers next to fresh ones.
          rm -rf "${DEST_REL:?}"
          mkdir -p "$DEST_REL"
          cp -R "$STAGE/." "$DEST_REL/"

          git add -A -- "$DEST_REL"
          if git diff --cached --quiet; then
            echo "results identical to what is already on main - nothing to commit"
            return 0
          fi

          # [skip ci] is load-bearing: this pushes to main, and without it every
          # results commit would re-trigger the push-driven workflows, which
          # would publish again, forever.
          # `JOB_STATUS` is `job.status` -- the status of the job DOING THE
          # PUBLISHING, not the conclusion of the run whose id sits next to it.
          # Those differ exactly when they matter: an aggregate/publish job that
          # succeeds while its shards fail produced
          # `results(benchmark): run 30712111998 (success)` for a run whose
          # conclusion is `failure` with 20 of 21 shards red. A "(success)" in
          # the history is precisely what stops the next person re-running.
          #
          # The run's own conclusion is NOT knowable here -- this job is part of
          # that run, so the run has not concluded. Rather than fabricate one,
          # the label now names what it actually measures. Same rule as #2743:
          # a status line must track the thing it names.
          #
          # The label used to read "publish job: failure", which reads as a failed
          # publish, but this commit exists only when the publish succeeded. It
          # now says "published" and names the job's status with the failed steps
          # the jobs API reported (run 35301501610: steps 8 and 9).
          subject="results(${RESULTS_NAME}): run ${GITHUB_RUN_ID:-} published (${status_label}; run verdict NOT measured here) [skip ci]"
          if [ -n "$failed_detail" ]; then
            git commit --quiet -m "$subject" -m "Failed before publishing, per the jobs API: ${failed_detail}"
          else
            git commit --quiet -m "$subject"
          fi
          git push --quiet origin HEAD:main 2>/dev/null || return 1
          return 0
        }

        for attempt in 1 2 3 4 5; do
          publish_attempt
          case "$?" in
            0) echo "published ${DEST_REL} (attempt ${attempt})"; exit 0 ;;
            2) echo "::warning::could not clone main to publish results; skipping (the run's own verdict is unaffected)"; exit 0 ;;
          esac
          echo "lost a push race on attempt ${attempt}; re-cloning current main and retrying"
          sleep $(( (RANDOM % 5) + 2 ))
        done
        echo "::warning::could not push results for ${RESULTS_NAME} after 5 attempts"
        exit 0
