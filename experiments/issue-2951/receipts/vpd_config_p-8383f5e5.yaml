# goodfire/param-decomp run p-8383f5e5 config.yaml (public W&B file), with its _wandb machine block removed.
cadence:
    value:
        checkpointing:
            kind: periodic
            retention:
                kind: keep_last
                "n": 2
            save_every: 5000
        train_log_every: 200
data:
    value:
        eval:
            kind: name
            name: pile_neox_tok_512_val
        train:
            kind: name
            name: pile_neox_tok_512
decomposition:
    value:
        ci:
            attention:
                kind: mha
                n_heads: 16
            blocks_per_chunk: 4
            d_model: 2048
            ffn:
                hidden: 8192
                kind: gelu
            input_tap: all_block_resids
            n_blocks: 8
            type: chunkwise_transformer
        sites:
            cs:
                c_fc: 3072
                down_proj: 3072
                k_proj: 768
                o_proj: 768
                q_proj: 768
                v_proj: 768
            initialization: neuron_aligned
            kind: simple_mlp
            layers:
                kind: all
eval:
    value:
        batch_size: 128
        every: 1000
        n_steps: 1
        slow_every: 10000
        slow_on_first_step: true
eval.metrics.CEandKL.rounding_threshold:
    value: 0
eval.metrics.CI_L0.ci_alive_threshold:
    value: 0
eval.metrics.CI_L0.groups:
    value:
        layer_0:
            - h.0.*
        layer_1:
            - h.1.*
        layer_2:
            - h.2.*
        layer_3:
            - h.3.*
        total:
            - '*'
eval.metrics.CIHist.n_batches_accum:
    value: 1
eval.metrics.CompActDens.ci_alive_threshold:
    value: 0
eval.metrics.PGDRecon.hidden_acts_reconstruction:
    value:
        coeff: 0
        points:
            - resid.1
            - resid.2
            - resid.3
            - resid.4
eval.metrics.PGDRecon.init:
    value: random
eval.metrics.PGDRecon.n_steps:
    value: 20
eval.metrics.PGDRecon.name:
    value: PGDReconLoss_20step
eval.metrics.PGDRecon.source_shape:
    value: c
eval.metrics.PGDRecon.step_size:
    value: 0.1
pd:
    value:
        batch_size: 64
        ci_fn_optimizer:
            consistent_rms: 0.2
            grad_clip_norm: 1
            impl: stacked
            lr_schedule:
                max_val: 5e-05
                points:
                    - at: 0
                      frac: 1
                    - at: 0.9
                      frac: 0.1
                      interp: cosine
                    - at: 1
                      frac: 0.1
            type: muon
        components_optimizer:
            consistent_rms: 0.2
            grad_clip_norm: 1
            impl: stacked
            lr_schedule:
                max_val: 5e-05
                points:
                    - at: 0
                      frac: 1
                    - at: 0.9
                      frac: 0.1
                      interp: cosine
                    - at: 1
                      frac: 0.1
            type: muon
        faithfulness_warmup_lr: 0.001
        faithfulness_warmup_steps: 0
        faithfulness_warmup_weight_decay: 0
        steps: 800000
pd.loss_metrics.Faith.coeff:
    value: 1000
pd.loss_metrics.ImpMin.coeff:
    value: 0.0002
pd.loss_metrics.ImpMin.frequency:
    value:
        coeff: 6.6e-05
        ema_halflife_steps: 200
        reference_datapoint_count: 6553600
pd.loss_metrics.ImpMin.gamma:
    value:
        max_val: 1
        points:
            - at: 0
              frac: 1
            - at: 0.9
              frac: 0.01
            - at: 1
              frac: 0.01
pd.loss_metrics.MergedStochasticSubsetPPGDReconLoss.adv_fraction:
    value: 0.5
pd.loss_metrics.MergedStochasticSubsetPPGDReconLoss.coeff:
    value: 1
pd.loss_metrics.MergedStochasticSubsetPPGDReconLoss.n_warmup_steps:
    value: 2
pd.loss_metrics.MergedStochasticSubsetPPGDReconLoss.optimizer:
    value:
        beta1: 0.01
        beta2: 0.99
        eps: 1e-08
        lr_schedule:
            max_val: 0.01
            points:
                - at: 0
                  frac: 0
                - at: 0.025
                  frac: 1
                - at: 1
                  frac: 1
        type: adam
pd.loss_metrics.MergedStochasticSubsetPPGDReconLoss.routing:
    value:
        type: uniform_k_subset
pd.loss_metrics.MergedStochasticSubsetPPGDReconLoss.source_shape:
    value: bsc
pd.loss_metrics.Nonlinearity.coeff:
    value: 3e-05
pd.loss_metrics.Nonlinearity.relative_threshold:
    value:
        max_val: 8
        points:
            - at: 0
              frac: 1
            - at: 1
              frac: 0.25
pd.loss_metrics.Nonlinearity.unit_kind_coefficients:
    value:
        attention_head: 1
        neuron: 1
run_name:
    value: pile4l-ref6m-freq6p6em5-baseline-800k
runtime:
    value:
        compilation_cache_dir: ~/.cache/param-decomp/xla
        compiler_options: tuned-v1
        fsdp: 8
        remat_ci_fn: false
        remat_recon_forwards: false
        replicate: 1
        sharding: zero1
        tp: 1
target:
    value:
        attention_implementation: auto
        spec:
            kind: pretrained
            model_class: param_decomp.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
            run_path: goodfire/spd/runs/t-9d2b8f02
        weights_dtype: bfloat16
wandb:
    value:
        entity: null
        group: task-1274-ref6m
        project: param-decomp
        tags:
            - task-1274
            - ref6m
            - freq6p6em5
            - baseline-800k
