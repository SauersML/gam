# prime-rl RL of the graph oracle (#2951) on one MATS node (run_mats.sh: vLLM on both GPUs, data parallel, with
# serve_scores on the first and the trainer on the second). run_mats.sh sets model.name (export_hf.py's checkpoint) and
# launches from the directory holding the questions files (questions.py), which the sources name relative to it.
max_steps = 60
seq_len = 12288
dashboard = false

[model]
name = "Qwen/Qwen3-4B"

[trainer.model.lora]  # a new LoRA on the merged oracle; embeddings and output layer (part rows) stay frozen
rank = 32
alpha = 64

[trainer.model.ac]

[trainer.optim]
lr = 1e-4

[orchestrator]
batch_size = 32  # 4 questions x 8 answers

[orchestrator.concurrency]  # the controller starts from KV capacity / max context (6 here), blind to the shared prompts
initial_inflight = 16

[orchestrator.renderer]  # train.py's chat: Qwen3's template without thinking
name = "qwen3"
enable_thinking = false

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 4096
temperature = 1.0

[[orchestrator.train.source]]
name = "graph-oracle"
env.taskset.id = "graph-oracle"
env.taskset.questions = "train.jsonl"
env.taskset.task.seed = 0
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]  # before training and every 20 steps
interval = 20

[orchestrator.eval.sampling]  # evaluation goes through vLLM's chat completions, not the renderer: the same template asked for
max_completion_tokens = 4096
temperature = 1.0
chat_template_kwargs = { enable_thinking = false }

[[orchestrator.eval.source]]
name = "graph-oracle-heldout"
group_size = 2
select.limit = 40
env.taskset.id = "graph-oracle"
env.taskset.questions = "heldout.jsonl"
env.taskset.task.seed = 1000003
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[ckpt]

[deployment]  # sampling is the bottleneck: a vLLM replica on each GPU (run_mats.sh lists the second GPU twice)
num_infer_gpus = 2
num_train_gpus = 1

[inference.vllm]
gpu_memory_utilization = 0.45  # per replica: serve_scores (about 12 GB) shares the first GPU, the trainer (21 GB) the second
max_model_len = 12288

[env_vars]
# FlashInfer JIT-compiles its sampler with the node's CUDA 12.2 nvcc, which rejects CUDA 13 flags.
VLLM_USE_FLASHINFER_SAMPLER = "0"
